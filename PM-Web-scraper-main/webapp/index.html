    /* ------------------------------------------------------------------ */
    /* Weekly schedule dashboard (Sunday -> Sunday)                        */
    /* ------------------------------------------------------------------ */
    const WEEK_DEFS = [
      { key: "last", label: "Last Week", accent: "border-slate-300", head: "bg-slate-100 text-slate-600" },
      { key: "this", label: "This Week", accent: "border-emerald-300", head: "bg-emerald-700 text-white" },
      { key: "next", label: "Next Week", accent: "border-emerald-200", head: "bg-emerald-400 text-white" },
    ];

    // Parse "MM/DD/YYYY" or "MM/DD/YYYY HH:MM" into a sortable timestamp.
    // Missing/unparseable dates sort last.
    function parseWODate(s) {
      if (!s) return Infinity;
      const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})(?:\s+(\d{1,2}):(\d{2}))?/);
      if (!m) return Infinity;
      let year = +m[3];
      if (m[3].length === 2) year += year <= 68 ? 2000 : 1900; // 2-digit year
      return new Date(year, +m[1] - 1, +m[2], +(m[4] || 0), +(m[5] || 0)).getTime();
    }

    // Collect work orders into the three week buckets for the records that
    // match `predicate`, then order each list by date: scheduled soonest-due
    // first, unscheduled oldest-notified first (oldest to complete first).
    function buildBuckets(data, predicate) {
      const b = {
        last: { scheduled: [], unscheduled: [] },
        this: { scheduled: [], unscheduled: [] },
        next: { scheduled: [], unscheduled: [] },
      };
      data.departments.forEach((d) => {
        WEEK_DEFS.forEach(({ key }) => {
          (d.weeks[key]?.scheduled || []).forEach((r) => { if (predicate(r)) b[key].scheduled.push(r); });
          (d.weeks[key]?.unscheduled || []).forEach((r) => { if (predicate(r)) b[key].unscheduled.push(r); });
        });
      });
      Object.values(b).forEach((w) => {
        w.scheduled.sort((a, c) => parseWODate(a.due_date) - parseWODate(c.due_date));
        w.unscheduled.sort((a, c) => parseWODate(a.date_notified) - parseWODate(c.date_notified));
      });
      return b;
    }

    const isClosedCompleted = (r) => (r.status || "").trim() === CLOSED_STATUS;

    function WeekWORow({ r, showDept, deptLabels, onOpenWo }) {
      const when = r.wo_type === "scheduled" ? r.due_date : r.date_notified;
      return html`
        <button onClick=${() => onOpenWo(r.wo_id)}
          className="w-full text-left bg-white rounded-xl px-3 py-2 border border-emerald-100
                     hover:border-emerald-300 hover:shadow-sm transition">
          <div className="flex items-center justify-between gap-2">
            <span className="font-bold text-emerald-800 text-sm">WO #${r.wo_id}</span>
            <span className="text-[11px] text-slate-400 whitespace-nowrap">${when || ""}</span>
          </div>
          <div className="text-xs text-slate-600 mt-0.5 line-clamp-2">${r.problem || r.audit_item || r.equipment_name || "—"}</div>
          <div className="flex items-center gap-2 mt-1 flex-wrap">
            <span className="text-[11px] text-slate-500 truncate max-w-[11rem]">${r.equipment_name || ""}</span>
            ${r.status && html`<span className=${"text-[10px] px-1.5 py-0.5 rounded-full border " + statusColor(r.status)}>${r.status}</span>`}
            ${isClosedCompleted(r) && html`<span className="text-emerald-600" title="Closed and completed"><${MintLeaf} className="w-4 h-4" /></span>`}
            ${showDept && deptLabels[r.department_key] && html`<span className="text-[10px] px-1.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">${deptLabels[r.department_key]}</span>`}
          </div>
        </button>`;
    }

    function WeekColumn({ def, week, bucket, showDept, deptLabels, onOpenWo, typeFilter = "all" }) {
      const sch = bucket.scheduled || [];
      const uns = bucket.unscheduled || [];
      const showSch = typeFilter !== "unscheduled";
      const showUns = typeFilter !== "scheduled";
      return html`
        <section className=${"bg-slate-50 rounded-2xl border " + def.accent + " overflow-hidden flex flex-col"}>
          <div className=${"px-4 py-3 " + def.head}>
            <div className="font-extrabold">${def.label}</div>
            <div className="text-xs opacity-80">${week ? (week.start + " → " + week.end) : ""}</div>
            <div className="flex gap-2 mt-2 text-xs">
              <span className="bg-white/80 text-sky-700 rounded-full px-2 py-0.5 font-semibold">${sch.length} scheduled</span>
              <span className="bg-white/80 text-rose-700 rounded-full px-2 py-0.5 font-semibold">${uns.length} unscheduled</span>
            </div>
          </div>
          <div className="p-3 space-y-4 overflow-y-auto" style=${{ maxHeight: "62vh" }}>
            ${showSch && html`<div>
              <div className="text-xs font-bold uppercase tracking-wide text-sky-600 mb-2">Scheduled (${sch.length})</div>
              <div className="space-y-2">
                ${sch.length === 0
                  ? html`<div className="text-slate-400 text-xs italic">None</div>`
                  : sch.map((r) => html`<${WeekWORow} key=${"s" + r.wo_id} r=${r} showDept=${showDept} deptLabels=${deptLabels} onOpenWo=${onOpenWo} />`)}
              </div>
            </div>`}
            ${showUns && html`<div>
              <div className="text-xs font-bold uppercase tracking-wide text-rose-600 mb-2">Unscheduled (${uns.length})</div>
              <div className="space-y-2">
                ${uns.length === 0
                  ? html`<div className="text-slate-400 text-xs italic">None</div>`
                  : uns.map((r) => html`<${WeekWORow} key=${"u" + r.wo_id} r=${r} showDept=${showDept} deptLabels=${deptLabels} onOpenWo=${onOpenWo} />`)}
              </div>
            </div>`}
          </div>
        </section>`;
    }

    // Pure presentational: renders the three week columns for whatever records
    // match `predicate`. Reused by the top-level tab, the department view and
    // the machine view.
    function WeeklyPanels({ data, predicate, showDept, onOpenWo, typeFilter = "all" }) {
      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const buckets = buildBuckets(data, predicate);
      return html`
        <div className="grid md:grid-cols-3 gap-4">
          ${WEEK_DEFS.map((def) => html`
            <${WeekColumn} key=${def.key} def=${def} week=${data.weeks[def.key]}
              bucket=${buckets[def.key]} showDept=${showDept}
              deptLabels=${deptLabels} onOpenWo=${onOpenWo} typeFilter=${typeFilter} />`)}
        </div>`;
    }

    // Escape a value for CSV output. Wraps in quotes and doubles embedded quotes.
    function csvCell(v) {
      const s = String(v ?? "").replace(/"/g, '""');
      return '"' + s + '"';
    }

    // Build a CSV of the weekly schedule for whatever records match `predicate`,
    // honoring the current type filter. Downloads directly.
    function exportWeeklyCsv({ data, predicate, showDept, typeFilter, scopeLabel }) {
      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const buckets = buildBuckets(data, predicate);
      const rows = [];
      rows.push(["Week", "Type", "WO ID", "Date", "Department", "Equipment", "EQ ID", "Status", "Urgency", "Description"]);
      const showSch = typeFilter !== "unscheduled";
      const showUns = typeFilter !== "scheduled";
      WEEK_DEFS.forEach((def) => {
        const bucket = buckets[def.key] || { scheduled: [], unscheduled: [] };
        if (showSch) {
          bucket.scheduled.forEach((r) => {
            rows.push([
              def.label,
              "Scheduled",
              r.wo_id || "",
              r.due_date || "",
              deptLabels[r.department_key] || r.department_key || "",
              r.equipment_name || "",
              r.equipment_eq_id || "",
              r.status || "",
              r.urgency || "",
              r.audit_item || "",
            ]);
          });
        }
        if (showUns) {
          bucket.unscheduled.forEach((r) => {
            rows.push([
              def.label,
              "Unscheduled",
              r.wo_id || "",
              r.date_notified || "",
              deptLabels[r.department_key] || r.department_key || "",
              r.equipment_name || "",
              r.equipment_eq_id || "",
              r.status || "",
              r.urgency || "",
              r.problem || "",
            ]);
          });
        }
      });
      const csv = rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const safe = (scopeLabel || "All").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "");
      a.download = "Weekly-Schedule-" + safe + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Build a PDF of the weekly schedule (via jsPDF) for whatever records match
    // `predicate`, honoring the current type filter (all / scheduled /
    // unscheduled). Downloads directly - no print dialog.
    function exportWeeklyPdf({ data, predicate, showDept, typeFilter, scopeLabel }) {
      const JsPDF = window.jspdf && window.jspdf.jsPDF;
      if (!JsPDF) { alert("PDF library failed to load. Refresh the page and try again."); return; }
      const doc = new JsPDF({ unit: "pt", format: "letter" });
      const MARGIN = 40;
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const contentW = pageW - MARGIN * 2;
      let y = MARGIN;
      const ensure = (n) => { if (y + n > pageH - MARGIN) { doc.addPage(); y = MARGIN; } };

      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const buckets = buildBuckets(data, predicate);

      // Header band
      doc.setFillColor(4, 120, 87); doc.rect(0, 0, pageW, 6, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(4, 120, 87);
      doc.text("Bobrick", MARGIN, y + 10);
      doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(100, 116, 139);
      doc.text("Weekly Work Order Schedule", MARGIN, y + 26);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(30, 41, 59);
      doc.text(scopeLabel || "All Departments", pageW - MARGIN, y + 12, { align: "right" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(148, 163, 184);
      doc.text("Exported " + new Date().toLocaleString(), pageW - MARGIN, y + 26, { align: "right" });
      y += 42;
      doc.setDrawColor(4, 120, 87); doc.setLineWidth(1.5);
      doc.line(MARGIN, y, pageW - MARGIN, y); y += 18;

      const showSch = typeFilter !== "unscheduled";
      const showUns = typeFilter !== "scheduled";

      const woLine = (r) => {
        const when = r.wo_type === "scheduled" ? r.due_date : r.date_notified;
        let s = "WO #" + (r.wo_id || "") + "   \u00b7   " + (when || "no date");
        if (r.equipment_name) s += "   \u00b7   " + r.equipment_name;
        return s;
      };
      const woDetail = (r) => {
        let d = r.problem || r.audit_item || "";
        const bits = [];
        if (r.status) bits.push(r.status);
        if (showDept && deptLabels[r.department_key]) bits.push(deptLabels[r.department_key]);
        if (bits.length) d = (d ? d + "   " : "") + "[" + bits.join(" \u00b7 ") + "]";
        return d;
      };

      const listSection = (heading, rows, color) => {
        ensure(20);
        doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor.apply(doc, color);
        doc.text(heading + " (" + rows.length + ")", MARGIN, y); y += 14;
        if (rows.length === 0) {
          doc.setFont("helvetica", "italic"); doc.setFontSize(9); doc.setTextColor(148, 163, 184);
          ensure(12); doc.text("None", MARGIN + 10, y); y += 14; return;
        }
        rows.forEach((r) => {
          const detail = woDetail(r);
          const detailLines = detail ? doc.splitTextToSize(detail, contentW - 20) : [];
          ensure(14 + detailLines.length * 11 + 4);
          doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(30, 41, 59);
          doc.text(woLine(r), MARGIN + 10, y); y += 12;
          if (detailLines.length) {
            doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(71, 85, 105);
            detailLines.forEach((ln) => { ensure(11); doc.text(ln, MARGIN + 18, y); y += 11; });
          }
          y += 3;
        });
      };

      WEEK_DEFS.forEach((def) => {
        const wk = data.weeks[def.key];
        const bucket = buckets[def.key];
        ensure(40);
        doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(30, 41, 59);
        doc.text(def.label, MARGIN, y);
        doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(100, 116, 139);
        doc.text(wk ? (wk.start + " to " + wk.end) : "", MARGIN + 120, y);
        y += 16;
        if (showSch) listSection("Scheduled", bucket.scheduled || [], [2, 132, 199]);
        if (showUns) listSection("Unscheduled", bucket.unscheduled || [], [225, 29, 72]);
        y += 8; ensure(6);
        doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.5);
        doc.line(MARGIN, y, pageW - MARGIN, y); y += 14;
      });

      const safe = (scopeLabel || "All").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "");
      doc.save("Weekly-Schedule-" + safe + ".pdf");
    }

    // ------------------------------------------------------------------ //
    // Monthly calendar exports (CSV + PDF)
    // ------------------------------------------------------------------ //
    function _monthlyItems({ data, predicate, typeFilter }) {
      const items = [];
      if (data && data.work_orders) {
        data.work_orders.forEach((r) => {
          if (!predicate(r)) return;
          if (typeFilter !== "all" && r.wo_type !== typeFilter) return;
          items.push(r);
        });
      }
      if (data && data.events) {
        data.events.forEach((e) => {
          if (!predicate(e)) return;
          items.push(e);
        });
      }
      items.sort((a, b) => a.date.localeCompare(b.date));
      return items;
    }

    function exportMonthlyCsv({ data, predicate, showDept, typeFilter, scopeLabel }) {
      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const rows = [];
      rows.push(["Date", "Type", "WO ID", "Department", "Equipment", "EQ ID", "Status", "Urgency", "Details"]);
      const items = _monthlyItems({ data, predicate, typeFilter });
      items.forEach((r) => {
        const isEvent = r.is_event;
        const type = isEvent
          ? "Event"
          : r.is_projected
            ? "Scheduled (projected)"
            : r.wo_type === "scheduled"
              ? "Scheduled"
              : "Unscheduled";
        const details = isEvent
          ? (r.title || "") + (r.description ? " - " + r.description : "")
          : r.wo_type === "scheduled"
            ? (r.audit_item || "PM")
            : (r.problem || "");
        rows.push([
          r.date,
          type,
          r.wo_id || "",
          showDept ? (deptLabels[r.department_key] || r.department_key || "") : "",
          r.equipment_name || (r.equipment_id ? "Machine " + r.equipment_id : ""),
          r.equipment_eq_id || r.equipment_id || "",
          r.status || "",
          r.urgency || "",
          details,
        ]);
      });
      const csv = rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const safe = (scopeLabel || "All").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "");
      a.download = "Monthly-Calendar-" + safe + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportMonthlyPdf({ data, predicate, showDept, typeFilter, scopeLabel }) {
      const JsPDF = window.jspdf && window.jspdf.jsPDF;
      if (!JsPDF) { alert("PDF library failed to load. Refresh the page and try again."); return; }
      const doc = new JsPDF({ unit: "pt", format: "letter" });
      const MARGIN = 40;
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const contentW = pageW - MARGIN * 2;
      let y = MARGIN;
      const ensure = (n) => { if (y + n > pageH - MARGIN) { doc.addPage(); y = MARGIN; } };

      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const items = _monthlyItems({ data, predicate, typeFilter });

      // Header
      doc.setFillColor(4, 120, 87); doc.rect(0, 0, pageW, 6, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(4, 120, 87);
      doc.text("Bobrick", MARGIN, y + 10);
      doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(100, 116, 139);
      doc.text("Monthly Calendar", MARGIN, y + 26);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(30, 41, 59);
      doc.text(scopeLabel || "All Departments", pageW - MARGIN, y + 12, { align: "right" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(148, 163, 184);
      doc.text("Exported " + new Date().toLocaleString(), pageW - MARGIN, y + 26, { align: "right" });
      y += 42;
      doc.setDrawColor(4, 120, 87); doc.setLineWidth(1.5);
      doc.line(MARGIN, y, pageW - MARGIN, y); y += 18;

      let lastDate = "";
      items.forEach((r) => {
        const isEvent = r.is_event;
        const dateLabel = new Date(r.date + "T00:00:00").toLocaleDateString(undefined, {
          weekday: "short", month: "short", day: "numeric"
        });
        const type = isEvent
          ? "Event"
          : r.is_projected
            ? "Scheduled (projected)"
            : r.wo_type === "scheduled"
              ? "Scheduled"
              : "Unscheduled";
        const detail = isEvent
          ? (r.title || "") + (r.description ? " - " + r.description : "")
          : r.wo_type === "scheduled"
            ? (r.audit_item || "PM")
            : (r.problem || "");

        if (r.date !== lastDate) {
          ensure(22);
          doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(4, 120, 87);
          doc.text(dateLabel, MARGIN, y); y += 16;
          lastDate = r.date;
        }

        const eq = r.equipment_name || (r.equipment_id ? "Machine " + r.equipment_id : "");
        const eqId = r.equipment_eq_id || r.equipment_id || "";
        const statusBits = [];
        if (r.status) statusBits.push(r.status);
        if (r.urgency) statusBits.push(r.urgency);
        const lines = [
          type + "   ·   WO #" + (r.wo_id || "—"),
        ];
        if (eq) lines.push("Equipment: " + eq + (eqId ? " (" + eqId + ")" : ""));
        if (showDept && r.department_key) lines.push(deptLabels[r.department_key] || r.department_key);
        if (statusBits.length) lines.push(statusBits.join("   ·   "));
        lines.push("Details: " + detail);
        const split = doc.splitTextToSize(lines.join("\n"), contentW - 20);
        ensure(14 + split.length * 11 + 4);
        doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(30, 41, 59);
        split.forEach((ln) => { doc.text(ln, MARGIN + 10, y); y += 11; });
        y += 6;
      });

      if (items.length === 0) {
        ensure(16);
        doc.setFont("helvetica", "italic"); doc.setFontSize(10); doc.setTextColor(148, 163, 184);
        doc.text("No items for this view/filter.", MARGIN, y); y += 16;
      }

      const safe = (scopeLabel || "All").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "");
      doc.save("Monthly-Calendar-" + safe + ".pdf");
    }

    // Presentational weekly dashboard: type filter, export buttons, and three
    // week columns. Reused by EmbeddedWeekly, MySchedulePage, and TeamScheduleModal.
    // NOTE: named WeeklyBoard to avoid clashing with the standalone WeeklyDashboard
    // page component defined later (function declarations would otherwise collide).
    function WeeklyBoard({ data, predicate, showDept, onOpenWo, title, subtitle, scopeLabel }) {
      const [typeFilter, setTypeFilter] = useState("all");
      const TYPE_TABS = [
        { key: "all", label: "All" },
        { key: "scheduled", label: "Scheduled" },
        { key: "unscheduled", label: "Unscheduled" },
      ];
      const weekRangeText = data && data.weeks && data.weeks.this
        ? new Date(data.weeks.this.start + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
          " – " +
          new Date(data.weeks.this.end + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })
        : "";
      return html`
        <div className="fade-in">
          <div className="flex items-start justify-between flex-wrap gap-3 mb-4">
            <div>
              ${title && html`<h2 className="text-lg font-extrabold text-slate-800">${title}</h2>`}
              ${subtitle && html`<p className="text-slate-500 text-sm">${subtitle}</p>`}
              ${weekRangeText && html`<p className="text-emerald-700 text-sm font-semibold">${weekRangeText}</p>`}
            </div>
            <div className="flex items-center gap-3 flex-wrap">
              <div className="inline-flex rounded-full border border-emerald-200 bg-white p-0.5 text-sm font-semibold">
                ${TYPE_TABS.map((t) => html`
                  <button key=${t.key} onClick=${() => setTypeFilter(t.key)}
                    className=${"px-4 py-1.5 rounded-full transition " +
                      (typeFilter === t.key
                        ? "bg-emerald-700 text-white shadow-sm"
                        : "text-slate-600 hover:text-emerald-800")}>
                    ${t.label}
                  </button>`)}
              </div>
              <button onClick=${() => exportWeeklyPdf({ data, predicate, showDept, typeFilter, scopeLabel: scopeLabel || title || "Weekly Schedule" })}
                className="flex items-center gap-1.5 px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 shadow-sm">
                <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
                </svg>
                Export PDF</button>
              <button onClick=${() => exportWeeklyCsv({ data, predicate, showDept, typeFilter, scopeLabel: scopeLabel || title || "Weekly Schedule" })}
                className="flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-emerald-200 text-emerald-700 text-sm font-semibold hover:bg-emerald-50 shadow-sm">
                <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 11l5 5 5-5"/><path d="M12 4v12"/>
                </svg>
                Export CSV</button>
            </div>
          </div>
          <${WeeklyPanels} data=${data} predicate=${predicate} showDept=${showDept} onOpenWo=${onOpenWo} typeFilter=${typeFilter} />
        </div>`;
    }

    // Fetches /api/weekly and renders panels for a fixed scope (department or
    // machine). Used embedded inside the department and machine views so the
    // relevant weekly schedule shows up automatically - no manual filtering.
    // Supports paging through earlier/upcoming weeks like the monthly calendar.
    function EmbeddedWeekly({ predicate, showDept, onOpenWo, title, subtitle }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [weekOffset, setWeekOffset] = useState(0);
      useEffect(() => {
        getJSON("/api/weekly?offset=" + weekOffset).then(setData).catch((e) => setErr(e.message));
      }, [weekOffset]);
      if (err) return html`<div className="text-rose-600 text-sm">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading weekly schedule…" />`;
      return html`
        <div className="fade-in">
          <div className="flex items-center gap-3 flex-wrap mb-4">
            <div className="inline-flex items-center rounded-full border border-emerald-200 bg-white p-0.5 text-sm font-semibold">
              <button onClick=${() => setWeekOffset((o) => o - 1)}
                title="Previous weeks"
                className="px-3 py-1.5 rounded-full hover:bg-emerald-50 text-slate-700">←</button>
              <button onClick=${() => setWeekOffset(0)}
                className=${"px-3 py-1.5 rounded-full transition " + (weekOffset === 0 ? "bg-emerald-700 text-white shadow-sm" : "hover:bg-emerald-50 text-slate-700")}>
                This week</button>
              <button onClick=${() => setWeekOffset((o) => o + 1)}
                title="Upcoming weeks"
                className="px-3 py-1.5 rounded-full hover:bg-emerald-50 text-slate-700">→</button>
            </div>
          </div>
          <${WeeklyBoard} data=${data} predicate=${predicate} showDept=${showDept} onOpenWo=${onOpenWo} title=${title} subtitle=${subtitle} scopeLabel=${title || "Weekly Schedule"} />
        </div>`;
    }

    // Month calendar grid. Fetches /api/monthly (which projects recurring PMs
    // into the month) and renders a Sunday-aligned month view. Reused in the
    // division, department and machine views.
    // Month calendar grid. Fetches /api/monthly (which projects recurring PMs
    // into the month) and renders a Sunday-aligned month view. Reused in the
    // division, department and machine views.
    function EmbeddedMonthly({ predicate, showDept, onOpenWo, title, subtitle, deptKey, eqId }) {
      const now = new Date();
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [year, setYear] = useState(now.getFullYear());
      const [month, setMonth] = useState(now.getMonth() + 1);
      const [typeFilter, setTypeFilter] = useState("all");
      const [dayModal, setDayModal] = useState(null);
      const [eventForm, setEventForm] = useState(null);
      const [editProtected, setEditProtected] = useState(false);
      const [editGateAction, setEditGateAction] = useState(null);
      const [eventMachines, setEventMachines] = useState([]);

      const load = useCallback(() => {
        setErr(null);
        getJSON("/api/monthly?year=" + year + "&month=" + month)
          .then(setData)
          .catch((e) => setErr(e.message));
      }, [year, month]);
      useEffect(() => { load(); }, [load]);

      useEffect(() => {
        getJSON("/api/edit-auth").then((d) => setEditProtected(!!d.protected)).catch(() => {});
      }, []);

      const shift = (delta) => {
        const d = new Date(year, month - 1 + delta, 1);
        setYear(d.getFullYear());
        setMonth(d.getMonth() + 1);
      };
      const goThisMonth = () => {
        const d = new Date();
        setYear(d.getFullYear());
        setMonth(d.getMonth() + 1);
      };

      const openEventForm = (dateIso) => {
        setEventForm({
          date: dateIso || data.today,
          department_key: deptKey || "",
          equipment_id: eqId || "",
          title: "",
          description: "",
          author: getUserName(),
        });
        if (deptKey && !eqId) {
          getJSON("/api/departments/" + deptKey).then((d) => setEventMachines(d.machines || [])).catch(() => setEventMachines([]));
        } else {
          setEventMachines([]);
        }
      };

      const requireEdit = (action) => {
        if (!editProtected || getEditPw()) { action(); return; }
        setEditGateAction(() => action);
      };

      const saveEvent = async () => {
        if (!eventForm.title.trim()) return;
        const author = eventForm.author.trim() || getUserName();
        if (!author.trim()) { alert("Your name is required."); return; }
        try {
          const r = await fetch(API + "/api/calendar-events", {
            method: "POST",
            headers: editHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({
              date: eventForm.date,
              department_key: eventForm.department_key || "",
              equipment_id: eventForm.equipment_id || "",
              title: eventForm.title.trim(),
              description: eventForm.description.trim(),
              author: author,
            }),
          });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setEditPw(""); setEditGateAction(() => saveEvent); return; }
          if (!r.ok) throw new Error(d.error || "Save failed");
          setEventForm(null);
          load();
        } catch (e) { alert(e.message); }
      };

      const deleteEvent = async (id) => {
        if (!confirm("Delete this event?")) return;
        const author = (getUserName() || "").trim();
        if (!author) { alert("Your name is required."); return; }
        try {
          const r = await fetch(API + "/api/calendar-events/" + id, {
            method: "DELETE",
            headers: editHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ author }),
          });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setEditPw(""); setEditGateAction(() => deleteEvent(id)); return; }
          if (!r.ok) throw new Error(d.error || "Delete failed");
          load();
          if (dayModal) setDayModal((m) => m ? { ...m, items: m.items.filter((x) => x.id !== id) } : null);
        } catch (e) { alert(e.message); }
      };

      const onEventDeptChange = (dk) => {
        setEventForm((f) => ({ ...f, department_key: dk, equipment_id: "" }));
        if (dk) {
          getJSON("/api/departments/" + dk).then((d) => setEventMachines(d.machines || [])).catch(() => setEventMachines([]));
        } else {
          setEventMachines([]);
        }
      };

      if (err) return html`<div className="text-rose-600 text-sm">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading monthly calendar…" />`;

      const TYPE_TABS = [
        { key: "all", label: "All" },
        { key: "scheduled", label: "Scheduled" },
        { key: "unscheduled", label: "Unscheduled" },
      ];

      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });

      const byDate = {};
      data.work_orders.forEach((r) => {
        if (!predicate(r)) return;
        if (typeFilter !== "all" && r.wo_type !== typeFilter) return;
        const d = r.date;
        if (!d) return;
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(r);
      });
      data.events.forEach((e) => {
        if (!predicate(e)) return;
        const d = e.date;
        if (!d) return;
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(e);
      });

      const start = new Date(data.grid_start + "T00:00:00");
      const end = new Date(data.grid_end + "T00:00:00");
      const days = [];
      const cur = new Date(start);
      while (cur <= end) {
        days.push(new Date(cur));
        cur.setDate(cur.getDate() + 1);
      }
      const weeks = [];
      for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

      const isToday = (d) => data.today === d.toISOString().slice(0, 10);
      const inMonth = (d) => d.getFullYear() === data.year && d.getMonth() + 1 === data.month;
      const isThisMonth = data.year === now.getFullYear() && data.month === now.getMonth() + 1;

      const chipColor = (r) => {
        if (r.is_event) return "bg-amber-50 text-amber-700 border-amber-200";
        if (r.is_projected) return "bg-slate-100 text-slate-500 border-slate-200 border-dashed";
        if (r.wo_type === "unscheduled") return "bg-rose-50 text-rose-700 border-rose-200";
        return "bg-sky-50 text-sky-700 border-sky-200";
      };

      const renderClickableChip = (r) => {
        if (r.is_event) {
          return html`
            <button key=${"ev-" + r.id}
              onClick=${() => setDayModal({ date: r.date, items: byDate[r.date] || [] })}
              title=${"Event: " + r.title + (r.description ? "\n" + r.description : "")}
              className=${"w-full text-left rounded-lg px-1.5 py-1 text-[11px] leading-tight border " + chipColor(r) + " hover:shadow-sm cursor-pointer"}>
              <div className="text-[10px] font-bold uppercase tracking-wide text-amber-600 mb-0.5">Event</div>
              ${showDept && r.department_key && html`<div className="truncate opacity-70">${deptLabels[r.department_key]}</div>`}
              ${r.equipment_id && html`<div className="truncate opacity-80">Machine ${r.equipment_id}</div>`}
              <div className="truncate font-semibold">${r.title}</div>
            </button>`;
        }
        return html`
          <button key=${(r.wo_id || "p") + "-" + (r.audit_item || r.problem || "")}
            disabled=${!r.wo_id}
            onClick=${() => r.wo_id && onOpenWo && onOpenWo(r.wo_id)}
            title=${(r.is_projected ? "Projected occurrence\n" : "") + (r.audit_item || r.problem || "Work order") +
              (showDept && r.department_key && deptLabels[r.department_key] ? "\n" + deptLabels[r.department_key] : "")}
            className=${"w-full text-left rounded-lg px-1.5 py-1 text-[11px] leading-tight border " + chipColor(r) +
              (r.wo_id ? " hover:shadow-sm cursor-pointer" : " cursor-default")}>
            <div className="flex items-center gap-1">
              ${isClosedCompleted(r) && html`<span className="text-emerald-600" title="Closed and completed"><${MintLeaf} className="w-4 h-4" /></span>`}
              <span className="truncate font-semibold">${r.wo_type === "scheduled" ? (r.audit_item || "PM") : (r.problem || "Issue")}</span>
            </div>
            ${showDept && r.department_key && html`<div className="truncate opacity-70">${deptLabels[r.department_key]}</div>`}
            ${r.equipment_name && html`<div className="truncate opacity-80">${r.equipment_name}</div>`}
          </button>`;
      };

      return html`
        <div className="fade-in space-y-4">
          <div className="flex items-start justify-between flex-wrap gap-3">
            <div>
              ${title && html`<h2 className="text-lg font-extrabold text-slate-800">${title}</h2>`}
              ${subtitle && html`<p className="text-slate-500 text-sm">${subtitle}</p>`}
            </div>
            <div className="flex items-center gap-3 flex-wrap">
              <div className="inline-flex rounded-full border border-emerald-200 bg-white p-0.5 text-sm font-semibold">
                ${TYPE_TABS.map((t) => html`
                  <button key=${t.key} onClick=${() => setTypeFilter(t.key)}
                    className=${"px-4 py-1.5 rounded-full transition " +
                      (typeFilter === t.key
                        ? "bg-emerald-700 text-white shadow-sm"
                        : "text-slate-600 hover:text-emerald-800")}>
                    ${t.label}
                  </button>`)}
              </div>
              <button onClick=${() => requireEdit(() => openEventForm(data.today))}
                className="flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-emerald-200 text-emerald-700 text-sm font-semibold hover:bg-emerald-50 shadow-sm">
                <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                  <line x1="12" y1="15" x2="12" y2="21"/>
                  <line x1="9" y1="18" x2="15" y2="18"/>
                </svg>
                Add Event</button>
              <button onClick=${() => exportMonthlyPdf({ data, predicate, showDept, typeFilter, scopeLabel: subtitle || title || "Monthly Calendar" })}
                className="flex items-center gap-1.5 px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 shadow-sm">
                <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
                </svg>
                Export PDF</button>
              <button onClick=${() => exportMonthlyCsv({ data, predicate, showDept, typeFilter, scopeLabel: subtitle || title || "Monthly Calendar" })}
                className="flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-emerald-200 text-emerald-700 text-sm font-semibold hover:bg-emerald-50 shadow-sm">
                <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 11l5 5 5-5"/><path d="M12 4v12"/>
                </svg>
                Export CSV</button>
              <div className="inline-flex items-center rounded-full border border-emerald-200 bg-white p-0.5 text-sm font-semibold">
                <button onClick=${() => shift(-1)} className="px-3 py-1.5 rounded-full hover:bg-emerald-50 text-slate-600">←</button>
                <button onClick=${goThisMonth} className="px-3 py-1.5 rounded-full hover:bg-emerald-50 text-slate-600 text-xs">${isThisMonth ? "This Month" : "Back to This Month"}</button>
                <button onClick=${() => shift(1)} className="px-3 py-1.5 rounded-full hover:bg-emerald-50 text-slate-600">→</button>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-emerald-100 shadow-sm overflow-hidden">
            <div className="px-4 py-3 bg-emerald-700 text-white text-center">
              <div className="font-extrabold text-lg">${data.month_label}</div>
            </div>
            <div className="grid grid-cols-7 text-center text-xs font-bold text-slate-500 bg-emerald-50 border-b border-emerald-100">
              ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d) => html`<div key=${d} className="py-2">${d}</div>`)}
            </div>
            <div className="divide-y divide-emerald-50">
              ${weeks.map((wk, wi) => html`
                <div key=${wi} className="grid grid-cols-7 min-h-[8.5rem]">
                  ${wk.map((d) => {
                    const iso = d.toISOString().slice(0, 10);
                    const list = byDate[iso] || [];
                    const more = list.length > 3 ? "+" + (list.length - 3) + " more" : "";
                    const show = list.slice(0, 3);
                    return html`
                      <div key=${iso} className=${"border-r border-emerald-50 p-2 flex flex-col gap-1 " +
                          (inMonth(d) ? "bg-white" : "bg-slate-50/60") + " " +
                          (isToday(d) ? "ring-2 ring-inset ring-emerald-300" : "")}>
                        <button onClick=${() => list.length && setDayModal({ date: iso, items: list })}
                          className=${"text-xs font-bold mb-0.5 block bg-transparent border-0 p-0 text-left " + (inMonth(d) ? (isToday(d) ? "text-emerald-700" : "text-slate-600") : "text-slate-300") + (list.length ? " cursor-pointer hover:underline" : " cursor-default")}>
                          ${d.getDate()}
                        </button>
                        <div className="flex-1 space-y-1 overflow-y-auto" style=${{ maxHeight: "6rem" }}>
                          ${show.map((r) => renderClickableChip(r))}
                          ${more && html`<button onClick=${() => setDayModal({ date: iso, items: list })} className="text-[10px] text-emerald-600 hover:text-emerald-800 font-semibold pl-1 text-left">${more}</button>`}
                        </div>
                      </div>`;
                  })}
                </div>`)}
            </div>
          </div>

          ${dayModal && html`
            <div className="fixed inset-0 z-50 flex items-start justify-center p-4 overflow-y-auto bg-slate-900/50 backdrop-blur-sm"
                 onClick=${() => setDayModal(null)}>
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md my-8 fade-in"
                   onClick=${(e) => e.stopPropagation()}>
                <div className="px-4 py-3 bg-emerald-700 text-white rounded-t-2xl flex items-center justify-between">
                  <div className="font-bold">${dayModal.date}</div>
                  <button onClick=${() => setDayModal(null)} className="text-white/80 hover:text-white text-xl leading-none">×</button>
                </div>
                <div className="p-4 space-y-2 max-h-[60vh] overflow-y-auto">
                  ${dayModal.items.map((r) => html`
                    <div key=${r.is_event ? "ev-" + r.id : (r.wo_id || "p") + "-" + (r.audit_item || r.problem || "")}>
                      ${r.is_event ? html`
                        <div className="w-full rounded-lg px-3 py-2 border bg-amber-50 text-amber-700 border-amber-200">
                          <div className="flex items-center justify-between">
                            <div className="text-xs font-bold uppercase tracking-wide text-amber-600">Event</div>
                            <button onClick=${() => requireEdit(() => deleteEvent(r.id))}
                              className="text-rose-500 hover:text-rose-700 text-xs font-semibold">Delete</button>
                          </div>
                          ${showDept && r.department_key && html`<div className="text-xs truncate opacity-70">${deptLabels[r.department_key]}</div>`}
                          ${r.equipment_id && html`<div className="text-xs truncate opacity-80">Machine ${r.equipment_id}</div>`}
                          <div className="text-sm font-semibold truncate">${r.title}</div>
                          ${r.description && html`<div className="text-xs text-slate-600 mt-0.5">${r.description}</div>`}
                        </div>`
                      : html`
                        <button disabled=${!r.wo_id}
                          onClick=${() => { if (r.wo_id && onOpenWo) { setDayModal(null); onOpenWo(r.wo_id); } }}
                          className=${"w-full text-left rounded-lg px-3 py-2 border " + chipColor(r) +
                            (r.wo_id ? " hover:shadow-sm cursor-pointer" : " cursor-default")}>
                          <div className="flex items-center gap-1.5">
                            <div className="text-xs font-bold">${r.wo_type === "scheduled" ? "Scheduled" : "Unscheduled"}</div>
                            ${isClosedCompleted(r) && html`<span className="text-emerald-600" title="Closed and completed"><${MintLeaf} className="w-4 h-4" /></span>`}
                          </div>
                          ${showDept && r.department_key && html`<div className="text-xs truncate opacity-70">${deptLabels[r.department_key]}</div>`}
                          ${r.equipment_name && html`<div className="text-xs truncate opacity-80">${r.equipment_name}</div>`}
                          <div className="text-sm font-semibold truncate">${r.wo_type === "scheduled" ? (r.audit_item || "PM") : (r.problem || "Issue")}</div>
                        </button>`}
                    </div>`)}
                </div>
              </div>
            </div>`}

          ${eventForm && html`
            <div className="fixed inset-0 z-50 flex items-start justify-center p-4 overflow-y-auto bg-slate-900/50 backdrop-blur-sm"
                 onClick=${() => setEventForm(null)}>
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md my-8 fade-in"
                   onClick=${(e) => e.stopPropagation()}>

    function SparePartModal({ part, onClose, onSaved, initialDeptKey, initialEqId, initialMachineName }) {
      const [options, setOptions] = useState(null);
      const [author, setAuthor] = useState(getUserName());
      const [form, setForm] = useState(() => {
        const f = part ? { ...part } : {};
        f.machines = f.machines || [];
        if (initialDeptKey && initialEqId) {
          const existing = f.machines.some((m) => m.dept_key === initialDeptKey && m.eq_id === initialEqId);
          if (!existing) {
            f.machines = f.machines.concat([{ dept_key: initialDeptKey, eq_id: initialEqId, name: initialMachineName || "" }]);
          }
        }
        return f;
      });
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const [gate, setGate] = useState(false);
      const [machineSearch, setMachineSearch] = useState("");

      useEffect(() => {
        getJSON("/api/spare-parts/options").then((d) => setOptions(d.departments || [])).catch(() => setOptions([]));
      }, []);

      const machineOptions = [];
      (options || []).forEach((d) => {
        (d.machines || []).forEach((m) => {
          const display = m.name + (m.nickname ? " (PM: " + m.pm_name + ")" : "");
          machineOptions.push({
            value: d.dept_key + ":" + m.eq_id,
            label: d.dept_label + " — " + display,
            dept_key: d.dept_key,
            eq_id: m.eq_id,
            machine_name: m.name,
          });
        });
      });

      const addMachine = (val) => {
        if (!val) return;
        const opt = machineOptions.find((o) => o.value === val);
        if (!opt) return;
        setForm((f) => {
          const machines = f.machines || [];
          if (machines.some((m) => m.dept_key === opt.dept_key && m.eq_id === opt.eq_id)) return f;
          return { ...f, machines: machines.concat([{ dept_key: opt.dept_key, eq_id: opt.eq_id, name: opt.machine_name }]) };
        });
      };

      const removeMachine = (dept, eq) => {
        setForm((f) => ({ ...f, machines: (f.machines || []).filter((m) => !(m.dept_key === dept && m.eq_id === eq)) }));
      };

      const selectedValues = new Set((form.machines || []).map((m) => m.dept_key + ":" + m.eq_id));
      const needle = machineSearch.toLowerCase().trim();
      const availableOptions = machineOptions.filter((o) => !selectedValues.has(o.value) && (!needle || o.label.toLowerCase().includes(needle)));

      const setBool = (key, val) => setForm((f) => ({ ...f, [key]: val === true || val === "1" }));
      const set = (key, val) => setForm((f) => ({ ...f, [key]: val }));

      const handlePicture = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => setForm((f) => ({ ...f, picture: ev.target.result }));
        reader.readAsDataURL(file);
      };

      const save = async () => {
        if (!author.trim()) { setErr("Your name is required."); return; }
        if (!(form.description || "").trim()) { setErr("Part description is required."); return; }
        setBusy(true); setErr(null);
        try {
          const body = {
            description: (form.description || "").trim(),
            digital_id: (form.digital_id || "").trim(),
            picture: form.picture || "",
            machines: (form.machines || []).map((m) => ({ dept_key: m.dept_key, eq_id: m.eq_id, name: m.name })),
            part_type: (form.part_type || "").trim(),
            location: (form.location || "").trim(),
            quantity: Number(form.quantity || 0),
            condition: (form.condition || "").trim(),
            brand: (form.brand || "").trim(),
            is_part_of_set: form.is_part_of_set ? true : false,
            set_info: (form.set_info || "").trim(),
            buy_direct: form.buy_direct ? true : false,
            where_to_buy: (form.where_to_buy || "").trim(),
            purchase_link: (form.purchase_link || "").trim(),
            price_new: (form.price_new || "").trim(),
            barcode_qr: (form.barcode_qr || "").trim(),
            author: author.trim(),
          };
          const url = part ? "/api/spare-parts/" + part.id : "/api/spare-parts";
          const method = part ? "PATCH" : "POST";
          const r = await fetch(API + url, {
            method,
            headers: adminHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify(body),
          });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setAdminPw(""); setBusy(false); setGate(true); return; }
          if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
          setUserName(author.trim());
          onSaved(d);
          onClose();
        } catch (e) { setErr(e.message); setBusy(false); }
      };

      const selectOptions = [{ value: "", label: "— unlinked —" }].concat(machineOptions);

      return html`
        <div className="fixed inset-0 z-[55] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4"
          onClick=${onClose}>
          <div className="bg-white rounded-2xl shadow-xl border border-emerald-100 w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6"
            onClick=${(e) => e.stopPropagation()}>
            <h3 className="text-lg font-extrabold text-slate-800 mb-1">${part ? "Edit spare part" : "Add spare part"}</h3>
            <p className="text-sm text-slate-500 mb-4">All optional fields can be left blank.</p>

            <div className="grid md:grid-cols-2 gap-4">
              <${TextInput} label="Part description" required=${true} value=${form.description || ""} onChange=${(v) => set("description", v)} />
              <${TextInput} label="Digital ID" value=${form.digital_id || ""} onChange=${(v) => set("digital_id", v)} />
              <div className="md:col-span-2">
                <${LabeledField} label="Picture of part">
                  <input type="file" accept="image/*" onChange=${handlePicture} className=${inputCls} />
                  ${form.picture && html`<img src=${form.picture} className="mt-2 h-24 rounded-lg border border-slate-200" />`}
                </${LabeledField}>
              </div>
              <div className="md:col-span-2">
                <${LabeledField} label="For what machines">
                  ${!options && html`<div className="text-sm text-slate-400">Loading machines…</div>`}
                  ${options && html`
                    <input value=${machineSearch} onInput=${(e) => setMachineSearch(e.target.value)} placeholder="Search machines…" className=${inputCls} />
                    <select size="6" onChange=${(e) => { addMachine(e.target.value); e.target.value = ""; }} className=${inputCls + " mt-1"}>
                      <option value="">-- select a machine --</option>
                      ${availableOptions.map((o) => html`<option key=${o.value} value=${o.value}>${o.label}</option>`)}
                    </select>
                    ${(form.machines || []).length > 0 && html`<div className="text-xs text-slate-500 mt-2 mb-1">Selected:</div>`}
                    <div className="flex flex-wrap gap-2">
                      ${(form.machines || []).map((m) => html`
                        <span key=${m.dept_key + ":" + m.eq_id} className="inline-flex items-center gap-1 px-2 py-1 rounded-full bg-emerald-50 text-emerald-800 text-xs border border-emerald-100">
                          ${m.name || (m.dept_key + " " + m.eq_id)}
                          <button type="button" onClick=${() => removeMachine(m.dept_key, m.eq_id)} className="text-emerald-700 hover:text-rose-600 font-bold leading-none px-1" title="Remove">×</button>
                        </span>`)}
                    </div>`}
                </${LabeledField}>
              </div>
              <${TextInput} label="Type" value=${form.part_type || ""} onChange=${(v) => set("part_type", v)} />
              <${TextInput} label="Location" value=${form.location || ""} onChange=${(v) => set("location", v)} />
              <${TextInput} label="Quantity" type="number" value=${String(form.quantity || 0)} onChange=${(v) => set("quantity", Number(v) || 0)} />
              <${TextInput} label="Condition" value=${form.condition || ""} onChange=${(v) => set("condition", v)} />
              <${TextInput} label="Brand" value=${form.brand || ""} onChange=${(v) => set("brand", v)} />
              <div className="flex items-center gap-4 md:col-span-2">
                <label className="flex items-center gap-2 text-sm text-slate-700">
                  <input type="checkbox" checked=${!!form.is_part_of_set} onChange=${(e) => setBool("is_part_of_set", e.target.checked)} />
                  Part of a set?
                </label>
                ${form.is_part_of_set && html`<div className="flex-1"><${TextInput} label="Set info" value=${form.set_info || ""} onChange=${(v) => set("set_info", v)} /></div>`}
              </div>
              <div className="flex items-center gap-4 md:col-span-2">
                <label className="flex items-center gap-2 text-sm text-slate-700">
                  <input type="checkbox" checked=${!!form.buy_direct} onChange=${(e) => setBool("buy_direct", e.target.checked)} />
                  Buy direct from manufacturer / vendor?
                </label>
              </div>
              <${TextInput} label="Where to buy" value=${form.where_to_buy || ""} onChange=${(v) => set("where_to_buy", v)} />
              <${TextInput} label="Link for purchase" value=${form.purchase_link || ""} onChange=${(v) => set("purchase_link", v)} />
              <${TextInput} label="Price if buy brand new" value=${form.price_new || ""} onChange=${(v) => set("price_new", v)} />
              <${TextInput} label="Barcode / QR" value=${form.barcode_qr || ""} onChange=${(v) => set("barcode_qr", v)} />
            </div>

            <div className="mt-4"><${NameInput} value=${author} onChange=${setAuthor} /></div>
            ${err && html`<div className="text-rose-600 text-sm mt-3">${err}</div>`}
            <div className="flex gap-2 justify-end mt-5">
              <button onClick=${onClose} className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
              <button onClick=${save} disabled=${busy} className="px-5 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60">${busy ? "Saving…" : "Save"}</button>
            </div>
          </div>
          ${gate && html`<${AdminGate} actionLabel="save this spare part" onUnlock=${() => { setGate(false); save(); }} onCancel=${() => setGate(false)} />`}
        </div>`;
    }

    function SparePartsList({ loadUrl, canAdd, prefillDeptKey, prefillEqId, prefillMachineName }) {
      const [parts, setParts] = useState([]);
      const [filtered, setFiltered] = useState([]);
      const [loading, setLoading] = useState(true);
      const [err, setErr] = useState(null);
      const [reloadKey, setReloadKey] = useState(0);
      const [search, setSearch] = useState("");
      const [editing, setEditing] = useState(null);
      const [deleting, setDeleting] = useState(null);
      const [gateOpen, setGateOpen] = useState(false);
      const [gateAction, setGateAction] = useState(null);

      useEffect(() => {
        setLoading(true); setErr(null);
        getJSON(loadUrl).then((d) => { const list = d.parts || []; setParts(list); setFiltered(list); setLoading(false); })
          .catch((e) => { setErr(e.message); setLoading(false); });
      }, [loadUrl, reloadKey]);

      useEffect(() => {
        const s = search.toLowerCase().trim();
        if (!s) { setFiltered(parts); return; }
        setFiltered(parts.filter((p) => ((p.description || "") + " " + (p.digital_id || "") + " " + (p.part_type || "") + " " + (p.location || "") + " " + (p.brand || "") + " " + (p.machine_name || "")).toLowerCase().includes(s)));
      }, [search, parts]);

      const runWithGate = (fn) => {
        fn().catch((e) => {
          if (String(e.message).includes("Admin password required") || String(e.message).includes("HTTP 401")) {
            setGateAction(() => fn);
            setGateOpen(true);
          } else {
            setErr(e.message);
          }
        });
      };

      const refresh = () => setReloadKey((k) => k + 1);

      const doAdjust = (part, newQty) => {
        const n = Number(newQty);
        if (isNaN(n) || n < 0 || n === part.quantity) return;
        runWithGate(async () => {
          await sendJSON("/api/spare-parts/" + part.id, "PATCH", { quantity: n, author: getUserName() }, adminHeaders());
          refresh();
        });
      };

      const doDelete = () => {
        if (!deleting) return;
        const id = deleting.id;
        setDeleting(null);
        runWithGate(async () => {
          await sendJSON("/api/spare-parts/" + id, "DELETE", { author: getUserName() }, adminHeaders());
          refresh();
        });
      };

      const onSaved = () => { setEditing(null); refresh(); };

      if (err) return html`<div className="text-rose-600">${err}</div>`;
      if (loading) return html`<${Spinner} label="Loading parts…" />`;

      return html`
        <div>
          <div className="flex items-center gap-3 mb-4 flex-wrap">
            <input value=${search} onInput=${(e) => setSearch(e.target.value)} placeholder="Search parts…" className=${inputCls} />
            ${canAdd && html`<button onClick=${() => setEditing({})}
              className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800">+ Add part</button>`}
          </div>
          ${filtered.length === 0 && html`<div className="text-slate-400 py-10 text-center">No spare parts found.</div>`}
          <div className="grid gap-3">
            ${filtered.map((p) => html`
              <${SparePartCard} key=${p.id} part=${p}
                onEdit=${() => setEditing(p)}
                onDelete=${() => setDeleting(p)}
                onAdjustQty=${doAdjust} />`)}
          </div>
          ${editing && html`<${SparePartModal}
            part=${editing.id ? editing : null}
            initialDeptKey=${prefillDeptKey}
            initialEqId=${prefillEqId}
            initialMachineName=${prefillMachineName}
            onClose=${() => setEditing(null)}
            onSaved=${onSaved} />`}
          ${deleting && html`<${ConfirmActionModal}
            title="Delete spare part"
            danger=${true}
            confirmLabel="Delete"
            message=${"Delete “" + (deleting.description || "this part") + "”? This cannot be undone."}
            onConfirm=${doDelete}
            onClose=${() => setDeleting(null)} />`}
          ${gateOpen && html`<${AdminGate} actionLabel="make this change" onUnlock=${() => { setGateOpen(false); if (gateAction) gateAction(); }} onCancel=${() => setGateOpen(false)} />`}
        </div>`;
    }

    function SparePartsPage({ onCompany }) {
      return html`
        <div className="fade-in">
          <${Breadcrumb} items=${[{ label: "Bobrick", onClick: onCompany }, { label: "Spare Parts" }]} />
          <h1 className="text-2xl font-extrabold text-slate-800 mb-1">Spare Parts Inventory</h1>
          <p className="text-slate-500 mb-6">Track spare part inventory, quantities, locations, and purchase info.</p>
          <${SparePartsList} loadUrl="/api/spare-parts" canAdd=${true} />
        </div>`;
    }

    function MachineSparePartsTab({ deptKey, eqId, machineName }) {
      const url = "/api/departments/" + deptKey + "/machines/" + eqId + "/spare-parts";
      return html`
        <div>
          <${SparePartsList}
            loadUrl=${url}
            canAdd=${true}
            prefillDeptKey=${deptKey}
            prefillEqId=${eqId}
            prefillMachineName=${machineName} />
        </div>`;
    }

    function App() {
      const [route, setRoute] = useState({ view: "company" });
      // Navigation history stack powering the "Back" button. Every navigation
      // pushes the route it left; Back pops it.
      const [navHist, setNavHist] = useState([]);
      const [woId, setWoId] = useState(null);
      // Bumped whenever a work order changes, so list views can refetch.
      const [dataVersion, setDataVersion] = useState(0);
      const [technicians, setTechnicians] = useState(TECHNICIANS);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const wo = params.get("wo");
        if (wo) setWoId(wo);
      }, []);

      useEffect(() => {
        getJSON("/api/technicians")
          .then((d) => { if (Array.isArray(d.technicians) && d.technicians.length) setTechnicians(d.technicians); })
          .catch(() => {});
      }, []);

      // All navigation goes through navigate() so the Back stack stays accurate.
      const navigate = (next) => {
        const resolved = typeof next === "function" ? next(route) : next;
        if (JSON.stringify(resolved) === JSON.stringify(route)) return;
        setNavHist((h) => [...h.slice(-49), route]);
        setRoute(resolved);
      };
      const goBack = () => {
        setNavHist((h) => {
          if (!h.length) return h;
          setRoute(h[h.length - 1]);
          return h.slice(0, -1);
        });
      };

      const goCompany = () => navigate({ view: "company" });
      const openInactive = () => navigate({ view: "inactive" });
      const openSpareParts = () => navigate({ view: "spare-parts" });
      const openDivision = (divisionKey) => navigate({ view: "division", divisionKey });
      const goDivision = () => navigate((r) => ({ view: "division", divisionKey: r.divisionKey || "bla" }));
      const openDept = (deptKey, tab) =>
        navigate((r) => ({ view: "department", divisionKey: r.divisionKey || "bla", deptKey, tab: tab || "Machines" }));
      const openMachine = (eqId) =>
        navigate((r) => ({ view: "machine", divisionKey: r.divisionKey || "bla", deptKey: r.deptKey, eqId }));
      const openMySchedule = () => navigate({ view: "my-schedule" });

      const divLabel = DIV_LABELS[route.divisionKey || "bla"] || (route.divisionKey || "bla").toUpperCase();

      return html`
        <div className="min-h-screen">
          <${Header} technicians=${technicians} setTechnicians=${setTechnicians} onHome=${goCompany} onOpenInactive=${openInactive} onOpenSpareParts=${openSpareParts} onOpenMySchedule=${openMySchedule} onOpenWo=${setWoId} />
          <main className="max-w-6xl mx-auto px-6 py-8">
            ${navHist.length > 0 && html`
              <button onClick=${goBack}
                className="mb-4 inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-white border border-emerald-200 text-emerald-800 text-sm font-semibold shadow-sm hover:bg-emerald-50 hover:border-emerald-300 transition">
                <span aria-hidden="true">←</span> Back
              </button>`}
            ${route.view === "company" && html`<${CompanyDashboard} onOpenDivision=${openDivision} />`}
            ${route.view === "inactive" && html`<${InactivePage} onCompany=${goCompany} onOpenDept=${openDept} />`}
            ${route.view === "spare-parts" && html`<${SparePartsPage} onCompany=${goCompany} onOpenMachine=${openMachine} onOpenDept=${openDept} />`}
            ${route.view === "my-schedule" && html`<${MySchedulePage} user=${getRawUser()} onCompany=${goCompany} onOpenWo=${setWoId} />`}
            ${route.view === "division" && html`
              <${DivisionDashboard} divisionKey=${route.divisionKey || "bla"} onHome=${goCompany}
                refreshSignal=${dataVersion}
                onOpenDept=${openDept} onOpenWo=${setWoId} />`}
            ${route.view === "department" && html`
              <${DepartmentDashboard} deptKey=${route.deptKey}
                divisionKey=${route.divisionKey || "bla"} divisionLabel=${divLabel}
                initialTab=${route.tab || "Machines"}
                refreshSignal=${dataVersion}
                onHome=${goDivision} onCompany=${goCompany}
                onOpenMachine=${openMachine} onOpenWo=${setWoId}
                onTabChange=${(t) => setRoute((r) => r.view === "department" ? { ...r, tab: t } : r)} />`}
            ${route.view === "machine" && html`
              <${MachineView} deptKey=${route.deptKey} eqId=${route.eqId}
                deptLabel=${DEPT_LABELS[route.deptKey]} divisionLabel=${divLabel}
                onHome=${goDivision} onCompany=${goCompany}
                onOpenDept=${openDept} onOpenWo=${setWoId} />`}
          </main>
          ${woId && html`<${WorkOrderModal} woId=${woId} technicians=${technicians} onClose=${() => setWoId(null)}
            onOpenWo=${setWoId} onChanged=${() => setDataVersion((v) => v + 1)} />`}
        </div>`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
