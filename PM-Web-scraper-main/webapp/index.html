<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINT - Maintenance Intelligence & Troubleshooting</title>
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script src="/vendor/htm.js"></script>
  <script src="/vendor/tailwind.js"></script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/jspdf.js"></script>
  <style>
    :root { color-scheme: light; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f1f5f9; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Rendered markdown / checklist styling */
    .guide h1 { font-size: 1.5rem; font-weight: 800; color: #047857; margin: .25rem 0 .75rem; }
    .guide h2 { font-size: 1.15rem; font-weight: 700; color: #065f46; margin: 1.5rem 0 .5rem; }
    .guide h3 { font-size: 1rem; font-weight: 700; color: #065f46; margin: 1rem 0 .4rem; }
    .guide p { margin: .5rem 0; line-height: 1.6; color: #334155; }
    .guide ul, .guide ol { margin: .5rem 0 .5rem 1.3rem; line-height: 1.7; color: #334155; }
    .guide ul { list-style: disc; }
    .guide ol { list-style: decimal; }
    .guide li { margin: .15rem 0; }
    .guide strong { color: #1e293b; }
    .guide table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 1rem 0 1.75rem;
                   font-size: .9rem; border: 1px solid #cbd5e1; border-radius: .5rem; overflow: hidden; }
    .guide th { background: #047857; color: #fff; text-align: left; padding: .7rem .9rem;
                font-weight: 600; border-bottom: 2px solid #065f46; vertical-align: top;
                letter-spacing: .01em; }
    .guide td { border-top: 1px solid #e2e8f0; padding: .85rem .9rem; vertical-align: top;
                color: #334155; line-height: 1.65; }
    .guide td + td, .guide th + th { border-left: 1px solid #e2e8f0; }
    .guide tbody tr:nth-child(even) { background: #f8fafc; }
    .guide tbody tr:hover { background: #ecfdf5; }
    /* Bullet lists inside table cells (converted from "- item<br>- item") */
    .guide td ul.cell-list { margin: 0; padding-left: 1.1rem; list-style: disc; }
    .guide td ul.cell-list > li { margin: .3rem 0; line-height: 1.55; padding-left: .15rem; }
    .guide td ul.cell-list > li:first-child { margin-top: 0; }
    .guide td ul.cell-list > li:last-child { margin-bottom: 0; }
    .guide code { background: #ecfdf5; padding: .1rem .35rem; border-radius: .35rem; font-size: .85em; }
    .guide hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.2rem 0; }
    .guide input[type=checkbox] { margin-right: .4rem; accent-color: #059669; }

    .wo-link { color: #047857; font-weight: 600; cursor: pointer; text-decoration: underline;
               text-decoration-style: dotted; }
    .wo-link:hover { color: #065f46; background: #d1fae5; border-radius: .25rem; }

    .fade-in { animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useCallback, useRef, useMemo } = React;
    const html = htm.bind(React.createElement);
    const API = "";

    window.onerror = function (msg, url, line, col) {
      const b = document.body || document.documentElement;
      let el = document.getElementById("__js-error-banner");
      if (!el) {
        el = document.createElement("div");
        el.id = "__js-error-banner";
        el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#fee2e2;color:#991b1b;padding:10px 14px;font-family:monospace;font-size:13px;white-space:pre-wrap;border-bottom:2px solid #f87171;";
        b.appendChild(el);
      }
      el.textContent += "JS ERROR: " + msg + " at " + url + ":" + line + (col ? ":" + col : "") + "\n";
    };

    const CALENDAR_EVENT_TITLES = ["Technician visit", "Safety event", "Vendor visit"];

    /* ------------------------------------------------------------------ */
    /* Formatting helpers                                                  */
    /* ------------------------------------------------------------------ */
    const money = (n) =>
      "$" + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const hours = (n) => (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 1 }) + " h";
    const num = (n) => (Number(n) || 0).toLocaleString();
    const todayMDY = () => { const d = new Date(); return (d.getMonth() + 1) + "/" + d.getDate() + "/" + d.getFullYear(); };

    function urgencyColor(u) {
      const s = (u || "").toLowerCase();
      if (s.startsWith("1.")) return "bg-rose-100 text-rose-700 border-rose-200";
      if (s.startsWith("2.")) return "bg-orange-100 text-orange-700 border-orange-200";
      if (s.startsWith("3.")) return "bg-amber-100 text-amber-700 border-amber-200";
      if (s.startsWith("4.")) return "bg-yellow-100 text-yellow-700 border-yellow-200";
      if (s.startsWith("5.")) return "bg-sky-100 text-sky-700 border-sky-200";
      return "bg-slate-100 text-slate-600 border-slate-200";
    }

    function statusColor(st) {
      const s = (st || "").toLowerCase();
      if (s.includes("pending")) return "bg-amber-100 text-amber-700 border-amber-200";
      if (s.includes("progress") || s.includes("open") || s.includes("assigned"))
        return "bg-sky-100 text-sky-700 border-sky-200";
      if (s.includes("complete") || s.includes("closed") || s.includes("done"))
        return "bg-emerald-100 text-emerald-800 border-emerald-200";
      if (s.includes("cancel") || s.includes("void"))
        return "bg-rose-100 text-rose-700 border-rose-200";
      return "bg-slate-100 text-slate-600 border-slate-200";
    }

    async function getJSON(url) {
      const r = await fetch(API + url);
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ("HTTP " + r.status));
      return r.json();
    }

    // Send JSON to the API (POST/PATCH/PUT/DELETE) and return the parsed body.
    async function sendJSON(url, method, body, extraHeaders) {
      const r = await fetch(API + url, {
        method,
        headers: Object.assign({ "Content-Type": "application/json" }, extraHeaders || {}),
        body: JSON.stringify(body || {}),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
      return d;
    }

    // Upload one or more files to a work order (multipart).
    async function uploadAttachments(woId, files, author) {
      if (!files || !files.length) return null;
      const fd = new FormData();
      fd.append("author", author || "");
      for (const f of files) fd.append("file", f);
      const r = await fetch(API + "/api/workorder/" + encodeURIComponent(woId) + "/attachments",
        { method: "POST", body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "attachment upload failed");
      return d;
    }

    // Everyone is a "Guest" (no profile) by default and is NEVER forced to type
    // a name. Signing in as a technician or Sean stores a real name that is then
    // remembered across actions (localStorage).
    //   getRawUser()  -> the stored profile only ("" when a guest); the header
    //                    uses this to know whether someone is signed in.
    //   getUserName() -> the author recorded on changes, defaulting to "Guest"
    //                    so no action is ever blocked by a missing name.
    function getRawUser() { try { return localStorage.getItem("mintUser") || ""; } catch (e) { return ""; } }
    function getUserName() { return getRawUser() || "Guest"; }
    function setUserName(v) { try { localStorage.setItem("mintUser", v || ""); } catch (e) {} }

    // The admin password (gates deleting work orders + viewing version history)
    // is kept only in sessionStorage - cleared when the browser tab closes -
    // and sent as a header on the protected requests.
    function getAdminPw() { try { return sessionStorage.getItem("mintAdminPw") || ""; } catch (e) { return ""; } }
    function setAdminPw(v) { try { v ? sessionStorage.setItem("mintAdminPw", v) : sessionStorage.removeItem("mintAdminPw"); } catch (e) {} }
    function adminHeaders(extra) {
      const h = Object.assign({}, extra || {});
      const pw = getAdminPw();
      if (pw) h["X-Admin-Password"] = pw;
      return h;
    }

    const STATUS_OPTIONS = ["Pending", "Assigned", "In Progress", "Closed and Completed", "Cancelled"];
    const CLOSED_STATUS = "Closed and Completed";
    const FREQUENCY_OPTIONS = ["Weekly", "Bi-Weekly", "Monthly", "Quarterly", "Semi-Annually", "Annually"];
    // Initial technician list; App fetches the live list from /api/technicians.
    const TECHNICIANS = ["Gabriel", "Primo", "Max"];

    function isTechnician(name) {
      return TECHNICIANS.some((t) => t.toLowerCase() === (name || "").trim().toLowerCase());
    }

    // Sean (supervisor) password lives in sessionStorage and is sent on assignment
    // and team-stats requests.
    function getSeanPw() { try { return sessionStorage.getItem("mintSeanPw") || ""; } catch (e) { return ""; } }
    function setSeanPw(v) { try { v ? sessionStorage.setItem("mintSeanPw", v) : sessionStorage.removeItem("mintSeanPw"); } catch (e) {} }
    function setIsSean(v) { try { v ? sessionStorage.setItem("mintIsSean", "1") : sessionStorage.removeItem("mintIsSean"); } catch (e) {} }
    function seanHeaders(extra) {
      const h = Object.assign({}, extra || {});
      const pw = getSeanPw();
      if (pw) h["X-Sean-Password"] = pw;
      return h;
    }
    function isSeanMode() { try { return sessionStorage.getItem("mintIsSean") === "1"; } catch (e) { return false; } }
    const URGENCY_OPTIONS = [
      "1. Prod Stopped",
      "2. General Maint - High Priority",
      "3. Prod Affected, Not Stopped",
      "4. Prod Continuing but Affected Equipment stopped",
      "5. Prod Ongoing, Maint Required",
      "6. General Maint",
    ];

    function MintLeaf({ className, title, size }) {
      // Renders the uploaded mint-leaf artwork saved as webapp/mint-leaf.png.
      // Size is forced via inline style (fixed px, no flex-shrink) so every
      // instance renders identically regardless of its container.
      const px = size || 14;
      return html`
        <img src="/mint-leaf.png" alt=${title || "Closed and completed"}
          title=${title || "Closed and completed"}
          className=${(className || "") + " inline-block object-contain"}
          style=${{ width: px + "px", height: px + "px", minWidth: px + "px", minHeight: px + "px", flexShrink: 0 }} />`;
    }

    /* ------------------------------------------------------------------ */
    /* Form building blocks (shared by all create/edit modals)            */
    /* ------------------------------------------------------------------ */
    const inputCls =
      "w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm text-slate-700 " +
      "focus:outline-none focus:ring-2 focus:ring-emerald-300";

    function LabeledField({ label, required, children, hint }) {
      return html`
        <label className="block">
          <div className="text-xs uppercase tracking-wide text-emerald-600 font-semibold mb-1">
            ${label}${required && html`<span className="text-rose-500"> *</span>`}
          </div>
          ${children}
          ${hint && html`<div className="text-[11px] text-slate-400 mt-1">${hint}</div>`}
        </label>`;
    }

    function TextInput({ label, value, onChange, placeholder, required, type, hint, disabled }) {
      return html`
        <${LabeledField} label=${label} required=${required} hint=${hint}>
          <input type=${type || "text"} value=${value} placeholder=${placeholder || ""} disabled=${!!disabled}
            onInput=${(e) => onChange && onChange(e.target.value)}
            className=${inputCls + (disabled ? " bg-slate-100 text-slate-500 cursor-not-allowed" : "")} />
        </${LabeledField}>`;
    }

    function TextArea({ label, value, onChange, placeholder, required, rows, hint }) {
      return html`
        <${LabeledField} label=${label} required=${required} hint=${hint}>
          <textarea rows=${rows || 3} value=${value} placeholder=${placeholder || ""}
            onInput=${(e) => onChange(e.target.value)} className=${inputCls}></textarea>
        </${LabeledField}>`;
    }

    function SelectInput({ label, value, onChange, options, required, placeholder, hint }) {
      return html`
        <${LabeledField} label=${label} required=${required} hint=${hint}>
          <select value=${value} onChange=${(e) => onChange(e.target.value)} className=${inputCls}>
            ${placeholder && html`<option value="">${placeholder}</option>`}
            ${options.map((o) => {
              const val = typeof o === "string" ? o : o.value;
              const lbl = typeof o === "string" ? o : o.label;
              return html`<option key=${val} value=${val}>${lbl}</option>`;
            })}
          </select>
        </${LabeledField}>`;
    }

    // The mandatory "Your name" field, wired to remember the value.
    function NameInput({ value, onChange }) {
      return html`
        <${TextInput} label="Your name" required=${true} value=${value}
          placeholder="e.g. Jane Smith"
          hint="Recorded on every work order you create or change."
          onChange=${(v) => { onChange(v); setUserName(v); }} />`;
    }

    // Shared confirm dialog for deactivating / restoring departments & machines.
    // Requires the user's name (like every other mutating action) and calls
    // onConfirm(name) which should perform the API call.
    function ConfirmActionModal({ title, message, confirmLabel, danger, onConfirm, onClose }) {
      const [name, setName] = useState(getUserName());
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const go = async () => {
        if (!name.trim()) { setErr("Your name is required."); return; }
        setBusy(true); setErr(null);
        try { setUserName(name.trim()); await onConfirm(name.trim()); onClose(); }
        catch (e) { setErr(e.message); setBusy(false); }
      };
      const btn = danger
        ? "bg-rose-600 hover:bg-rose-700"
        : "bg-emerald-700 hover:bg-emerald-800";
      return html`
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-start justify-center p-4 overflow-y-auto"
             onClick=${onClose}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md my-8 fade-in"
               onClick=${(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between px-6 py-4 border-b border-emerald-100">
              <div className=${"font-extrabold text-lg " + (danger ? "text-rose-600" : "text-emerald-800")}>${title}</div>
              <button onClick=${onClose}
                className="w-9 h-9 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xl leading-none">×</button>
            </div>
            <div className="p-6 space-y-4">
              <p className="text-sm text-slate-600">${message}</p>
              <${NameInput} value=${name} onChange=${setName} />
              ${err && html`<div className="text-rose-600 text-sm">${err}</div>`}
              <div className="flex gap-2 justify-end pt-1">
                <button onClick=${onClose} className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
                <button onClick=${go} disabled=${busy}
                  className=${"px-5 py-2 rounded-full text-white text-sm font-semibold disabled:opacity-60 " + btn}>
                  ${busy ? "Working…" : (confirmLabel || "Confirm")}</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function FileInput({ label, files, onChange, hint }) {
      return html`
        <${LabeledField} label=${label || "Attachments"} hint=${hint || "Photos, PDFs, docs - optional."}>
          <input type="file" multiple onChange=${(e) => onChange([...e.target.files])}
            className="block w-full text-sm text-slate-600 file:mr-3 file:py-1.5 file:px-3
                       file:rounded-full file:border-0 file:bg-emerald-700 file:text-white
                       file:text-sm file:font-semibold hover:file:bg-emerald-800" />
          ${files && files.length > 0 && html`
            <div className="text-[11px] text-slate-500 mt-1">${files.length} file(s) selected: ${files.map((f) => f.name).join(", ")}</div>`}
        </${LabeledField}>`;
    }

    /* ------------------------------------------------------------------ */
    /* Small UI building blocks                                           */
    /* ------------------------------------------------------------------ */
    function Spinner({ label }) {
      return html`
        <div className="flex items-center gap-3 text-emerald-700 py-6">
          <div className="w-5 h-5 border-2 border-emerald-200 border-t-emerald-700 rounded-full animate-spin"></div>
          <span>${label || "Loading…"}</span>
        </div>`;
    }

    const KPI_DEFS = [
      { key: "unscheduled_count", label: "Unscheduled WOs", fmt: num, accent: "from-emerald-600 to-emerald-500" },
      { key: "scheduled_count",   label: "Scheduled WOs",   fmt: num, accent: "from-teal-600 to-teal-500" },
      { key: "labor_time",        label: "Labor Time",      fmt: hours, accent: "from-cyan-600 to-cyan-500" },
      { key: "material_cost",     label: "Material Cost",   fmt: money, accent: "from-sky-600 to-sky-500" },
      { key: "downtime_hours",    label: "Downtime",        fmt: hours, accent: "from-indigo-500 to-indigo-400" },
    ];

    function KpiCard({ def, value }) {
      return html`
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-emerald-100 fade-in">
          <div className="text-sm text-emerald-600 font-bold">${def.label}</div>
          <div className="mt-1 text-2xl font-extrabold text-slate-800">${def.fmt(value)}</div>
          <div className=${"mt-3 h-1.5 rounded-full bg-gradient-to-r " + def.accent}></div>
        </div>`;
    }

    function KpiRow({ stats }) {
      if (!stats) return null;
      return html`
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
          ${KPI_DEFS.map((d) => html`<${KpiCard} key=${d.key} def=${d} value=${stats[d.key]} />`)}
        </div>`;
    }

    function Breadcrumb({ items }) {
      return html`
        <nav className="flex items-center flex-wrap gap-1 text-sm text-emerald-700 mb-5">
          ${items.map((it, i) => html`
            <span key=${i} className="flex items-center gap-1">
              ${i > 0 && html`<span className="text-emerald-300">/</span>`}
              ${it.onClick
                ? html`<button onClick=${it.onClick}
                          className="hover:underline font-medium hover:text-emerald-900">${it.label}</button>`
                : html`<span className="font-semibold text-slate-700">${it.label}</span>`}
            </span>`)}
        </nav>`;
    }

    function MintLogo({ className }) {
      const leaf = "M0 0 Q5 -2 5 -6 Q9 -9 7 -12 Q9 -15 6 -18 Q7 -21 4 -23 Q3 -26 0 -28 Q-3 -26 -4 -23 Q-7 -21 -6 -18 Q-9 -15 -7 -12 Q-9 -9 -5 -6 Q-5 -2 0 0 Z";
      return html`
        <svg viewBox="0 0 150 110" className=${className} fill="none"
             strokeWidth="11" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 96 L22 42 L42 66 L62 42" stroke="#6ee7b7"/>
          <path d="M62 42 L100 96 L100 42" stroke="#34d399"/>
          <path d="M80 42 L124 42" stroke="#a7f3d0"/>
          <path d="M62 42 L62 96" stroke="#ffffff"/>
          <g strokeLinecap="round">
            <g transform="translate(62 42) rotate(-48) scale(0.8)">
              <path d=${leaf} fill="#6ee7b7" stroke="none"/>
            </g>
            <g transform="translate(62 42) rotate(48) scale(0.8)">
              <path d=${leaf} fill="#34d399" stroke="none"/>
            </g>
          </g>
        </svg>`;
    }

    function SeanGate({ actionLabel, onUnlock, onCancel }) {
      const [pw, setPw] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const inputRef = useRef(null);
      // Opened from the <select> dropdown, which keeps focus on the select, so
      // autoFocus alone won't grab it. Force focus into the box after mount.
      useEffect(() => {
        const t = setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 50);
        return () => clearTimeout(t);
      }, []);
      const submit = async () => {
        const value = (inputRef.current && inputRef.current.value) || pw || "";
        if (!value) { setErr("Enter the password."); return; }
        setBusy(true); setErr(null);
        try {
          const r = await fetch(API + "/api/verify-sean-password", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: value }),
          });
          const d = await r.json();
          if (!r.ok || !d.ok) throw new Error(d.error || "Incorrect password");
          onUnlock(value);
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };
      return ReactDOM.createPortal(html`
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4"
          onClick=${onCancel}>
          <div className="bg-white rounded-2xl shadow-xl border border-emerald-100 w-full max-w-sm p-6"
            onClick=${(e) => e.stopPropagation()}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xl">🔒</span>
              <h3 className="text-lg font-extrabold text-slate-800">Sean password required</h3>
            </div>
            <p className="text-sm text-slate-500 mb-4">Enter the supervisor password to ${actionLabel || "continue"}.</p>
            <input type="password" autoFocus ref=${inputRef}
              onInput=${(e) => setPw(e.target.value)}
              onKeyDown=${(e) => e.key === "Enter" && submit()}
              className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-300" />
            ${err && html`<div className="text-rose-600 text-sm mb-3">${err}</div>`}
            <div className="flex gap-2 justify-end">
              <button onClick=${onCancel} className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
              <button onClick=${submit} disabled=${busy}
                className="px-5 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60">
                ${busy ? "Checking…" : "Unlock"}</button>
            </div>
          </div>
        </div>`, document.body);
    }

    // Monday-start week helpers used by the team-stats weekly schedule.
    function startOfWeek(d) {
      const x = new Date(d);
      const off = (x.getDay() + 6) % 7; // Mon=0 … Sun=6
      x.setDate(x.getDate() - off); x.setHours(0, 0, 0, 0);
      return x;
    }
    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function isoToDate(iso) { return iso ? new Date(iso + "T00:00:00") : null; }
    function weekRangeLabel(start) {
      const fmt = { month: "short", day: "numeric" };
      return start.toLocaleDateString(undefined, fmt) + " – " + addDays(start, 6).toLocaleDateString(undefined, fmt);
    }
    const isScheduled = (w) => (w.wo_type || "").toLowerCase() === "scheduled";

    // Sean-only dashboard: one tab per technician, each showing a weekly
    // schedule (last / this / next week) and month-by-month completion trends.
    function TeamStatsModal({ technicians, onClose, onOpenWo }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [tab, setTab] = useState(technicians[0] || "");
      useEffect(() => {
        (async () => {
          try {
            const r = await fetch(API + "/api/team-stats", { headers: seanHeaders() });
            const d = await r.json().catch(() => ({}));

    // Sean-only modal to add/remove maintenance technicians.
    function ManageTechniciansModal({ technicians, setTechnicians, onClose }) {
      const [name, setName] = useState(getUserName());
      const [aliases, setAliases] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const [deleting, setDeleting] = useState(null);

      const refresh = async () => {
        try {
          const d = await getJSON("/api/technicians");
          if (Array.isArray(d.technicians)) setTechnicians(d.technicians);
        } catch (e) { setErr(e.message); }
      };

      const add = async () => {
        if (!name.trim()) { setErr("Your name is required."); return; }
        const tech = aliases.split(",").map((s) => s.trim()).filter(Boolean);
        if (!tech[0]) { setErr("Technician name is required."); return; }
        setBusy(true); setErr(null);
        try {
          await sendJSON("/api/technicians", "POST",
            { author: name.trim(), name: tech[0], aliases: tech.slice(1) },
            seanHeaders());
          setAliases("");
          await refresh();
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };

      const remove = async (techName) => {
        if (!name.trim()) { setErr("Your name is required."); return; }
        if (!window.confirm(`Delete technician "${techName}"?`)) return;
        setDeleting(techName); setErr(null);
        try {
          await sendJSON("/api/technicians/" + encodeURIComponent(techName), "DELETE",
            { author: name.trim() }, seanHeaders());
          await refresh();
        } catch (e) { setErr(e.message); } finally { setDeleting(null); }
      };

      return ReactDOM.createPortal(html`
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex items-start justify-center p-4 overflow-y-auto"

                ${busy ? "Adding…" : "Add technician"}</button>

              <div className="border-t border-slate-100 pt-4">

    // A single technician's weekly schedule + monthly trends.
    function TechStats({ tech, onOpenWo }) {
      const completed = tech.completed || [];
      const upcoming = tech.upcoming || [];
      const trends = tech.trends || [];

      const years = trends.map((y) => y.year).sort((a, b) => b - a);
      const [year, setYear] = useState(years[0] || new Date().getFullYear());
      const [metrics, setMetrics] = useState(["scheduled_completed_count", "unscheduled_completed_count", "labor_time"]);
      useEffect(() => { setYear(years[0] || new Date().getFullYear()); }, [tech.name]);

      // Weekly buckets (Mon–Sun): last & this week show completed work; next
      // week shows upcoming (not-yet-completed) assigned work.
      const thisStart = startOfWeek(new Date());
      const weeks = [
        { key: "last", title: "Last week", start: addDays(thisStart, -7), mode: "completed" },
        { key: "this", title: "This week", start: thisStart, mode: "completed" },
        { key: "next", title: "Next week", start: addDays(thisStart, 7), mode: "upcoming" },
      ];
      const inWeek = (iso, start) => {
        const d = isoToDate(iso);
        return d ? (d >= start && d <= addDays(start, 6)) : false;
      };

      // Monthly trend series for the selected year (from backend trends).
      const yearData = trends.find((y) => Number(y.year) === Number(year));
      const months = yearData && yearData.months
        ? yearData.months
        : Array.from({ length: 12 }, (_, i) => ({ month: i + 1, ...Object.fromEntries(TREND_METRICS.map((m) => [m.key, 0])) }));
      const TECH_METRICS = TREND_METRICS.filter((m) =>
        ["scheduled_completed_count", "unscheduled_completed_count", "labor_time"].includes(m.key));
      const toggleMetric = (k) =>
        setMetrics((s) => s.includes(k) ? s.filter((x) => x !== k) : [...s, k]);

      const woRow = (w, showLabor) => html`
        <div key=${w.wo_id} onClick=${() => onOpenWo(w.wo_id)}
          className="px-3 py-2 flex items-start justify-between gap-3 cursor-pointer hover:bg-slate-50 rounded-lg">
          <div className="min-w-0">
            <div className="text-sm font-semibold text-emerald-800">WO #${w.wo_id}
              <span className=${"ml-1 text-[10px] px-1.5 py-0.5 rounded-full align-middle font-semibold " +
                (isScheduled(w) ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700")}>
                ${isScheduled(w) ? "Scheduled" : "Unscheduled"}</span>
              ${w.equipment_name && html`<span className="text-slate-500 font-normal"> · ${w.equipment_name}</span>`}</div>
            <div className="text-xs text-slate-500 line-clamp-1">${w.problem || "—"}</div>
          </div>
          <div className="text-right whitespace-nowrap">
            <div className="text-xs text-slate-400">${showLabor ? (w.completed_datetime || "") : (w.due_date || "")}</div>
            ${showLabor && html`<div className="text-xs font-semibold text-slate-600">${hours(w.labor_time)}</div>`}
          </div>
        </div>`;

      return html`
        <div className="space-y-8">
          <div>
            <div className="text-sm font-bold text-slate-700 mb-3">Weekly schedule</div>
            <div className="grid md:grid-cols-3 gap-4">
              ${weeks.map((wk) => {
                const items = wk.mode === "completed"
                  ? completed.filter((w) => inWeek(w.completed_iso, wk.start))
                  : upcoming.filter((w) => inWeek(w.due_iso, wk.start));
                const totalLabor = items.reduce((a, w) => a + (Number(w.labor_time) || 0), 0);
                return html`
                  <div key=${wk.key} className="rounded-2xl border border-emerald-100 overflow-hidden flex flex-col">
                    <div className="px-4 py-3 bg-emerald-50/60">
                      <div className="font-bold text-slate-800">${wk.title}</div>
                      <div className="text-xs text-slate-500">${weekRangeLabel(wk.start)}</div>
                      <div className="mt-1 flex items-center gap-3 text-sm">
                        <span className="text-slate-500">${wk.mode === "completed" ? "Completed" : "Scheduled"}
                          <span className="font-extrabold text-emerald-700">${num(items.length)}</span></span>
                        ${wk.mode === "completed" && html`<span className="text-slate-500">Time
                          <span className="font-extrabold text-emerald-700">${hours(totalLabor)}</span></span>`}
                      </div>
                    </div>
                    <div className="p-2 divide-y divide-slate-50 flex-1">
                      ${items.length === 0
                        ? html`<div className="px-3 py-3 text-sm text-slate-400 italic">${wk.mode === "completed" ? "Nothing completed." : "Nothing scheduled."}</div>`
                        : items.map((w) => woRow(w, wk.mode === "completed"))}
                    </div>
                  </div>`;
              })}
            </div>
          </div>

          <div>
            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
              <div className="text-sm font-bold text-slate-700">Monthly trends</div>
              ${years.length > 0 && html`
                <div className="flex gap-1 flex-wrap">
                  ${years.map((y) => html`
                    <button key=${y} onClick=${() => setYear(y)}
                      className=${"px-3 py-1 rounded-full text-xs font-semibold " +
                        (Number(year) === y ? "bg-emerald-700 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200")}>
                      ${y}</button>`)}
                </div>`}
            </div>
            <div className="flex flex-wrap gap-2 mb-3">
              ${TECH_METRICS.map((m) => html`
                <button key=${m.key} onClick=${() => toggleMetric(m.key)}
                  className=${"px-3 py-1.5 rounded-full text-xs font-semibold border transition " +
                    (metrics.includes(m.key) ? "text-white border-transparent" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50")}
                  style=${metrics.includes(m.key) ? { backgroundColor: m.color } : {}}>
                  ${m.label}</button>`)}
            </div>
            ${trends.length === 0
              ? html`<div className="h-40 flex items-center justify-center text-slate-400 text-sm">No work orders yet.</div>`
              : html`<${TrendChart} months=${months} selectedKeys=${metrics} year=${Number(year)} />`}
            ${trends.length > 0 && html`<div className="mt-8">
              <${MonthTable} months=${months} selected=${TREND_METRICS.map((m) => m.key)} onToggle=${toggleMetric} onMonthClick=${null} />
            </div>`}
          </div>
        </div>`;
    }

    // Add / edit / delete a single vendor contact (password gated on the server).
    function VendorEditModal({ initial, machines, nameMap, types, onClose, onSaved, onTypesChanged }) {
      const [form, setForm] = useState(initial);
      const [author, setAuthor] = useState(getUserName());
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const [mq, setMq] = useState("");
      const [typeOptions, setTypeOptions] = useState(types || []);
      const [newType, setNewType] = useState("");
      const isNew = !initial.id;

      const set = (k, v) => setForm((f) => Object.assign({}, f, { [k]: v }));
      const toggleMachine = (eq) => setForm((f) => {
        const has = (f.machine_eq || []).includes(eq);
        return Object.assign({}, f, {
          machine_eq: has ? f.machine_eq.filter((x) => x !== eq) : [...(f.machine_eq || []), eq],
        });
      });

      const isPwErr = (e) => e && e.message && /password|401|locked/i.test(e.message);

      const addType = async () => {
        const name = newType.trim();
        if (!name) return;
        if (!author.trim()) { setErr("Your name is required to add a type."); return; }
        setBusy(true); setErr(null);
        try {
          const saved = await sendJSON("/api/vendor-contact-types", "POST", { name, author: author.trim() }, editHeaders());
          setTypeOptions((ts) => [...new Set([...ts, saved.name])].sort((a, b) => a.localeCompare(b)));
          set("type", saved.name); setNewType(""); setUserName(author.trim());
        } catch (e) {
          if (isPwErr(e)) setEditPw("");
          setErr(e.message || "Could not add type.");
        } finally { setBusy(false); }
      };

      const deleteType = async () => {
        const name = (form.type || "").trim();
        if (!name) { setErr("Select a type to delete."); return; }
        if (!author.trim()) { setErr("Your name is required to delete a type."); return; }
        if (!window.confirm(`Delete the '${name}' type? This only works if no contacts use it.`)) return;
        setBusy(true); setErr(null);
        try {
          await sendJSON("/api/vendor-contact-types/" + encodeURIComponent(name), "DELETE", { author: author.trim() }, editHeaders());
          setTypeOptions((ts) => ts.filter((t) => t.toLowerCase() !== name.toLowerCase()));
          set("type", ""); setUserName(author.trim());
          if (onTypesChanged) onTypesChanged();
        } catch (e) {
          if (isPwErr(e)) setEditPw("");
          setErr(e.message || "Could not delete type.");
        } finally { setBusy(false); }
      };

      const save = async () => {
        if (!author.trim()) { setErr("Your name is required."); return; }
        if (!(form.company || "").trim() && !(form.contact || "").trim()) {
          setErr("Enter a company or contact name."); return;
        }
        setBusy(true); setErr(null);
        try {
          const payload = Object.assign({}, form, { author: author.trim() });
          const url = isNew ? "/api/vendor-contacts" : "/api/vendor-contacts/" + initial.id;
          await sendJSON(url, isNew ? "POST" : "PATCH", payload, editHeaders());
          setUserName(author.trim());
          onSaved();
        } catch (e) {
          if (isPwErr(e)) { setEditPw(""); setErr("Editing is locked. Close this, click Unlock editing, then try again."); }
          else setErr(e.message || "Save failed.");
        } finally { setBusy(false); }
      };

      const del = async () => {
        if (!author.trim()) { setErr("Your name is required to delete."); return; }
        if (!window.confirm("Delete this contact from the vendor list? This also removes it from any assigned machine cards.")) return;
        setBusy(true); setErr(null);
        try {
          await sendJSON("/api/vendor-contacts/" + initial.id, "DELETE", { author: author.trim() }, editHeaders());
          setUserName(author.trim());
          onSaved();
        } catch (e) {
          if (isPwErr(e)) { setEditPw(""); setErr("Editing is locked."); }
          else setErr(e.message || "Delete failed.");
        } finally { setBusy(false); }
      };

      const selected = form.machine_eq || [];
      const mneedle = mq.trim().toLowerCase();
      const options = machines.filter((m) => !selected.includes(m.eq_id) &&
        (!mneedle || (m.name + " " + m.eq_id).toLowerCase().includes(mneedle))).slice(0, 40);

      const inputCls = "w-full px-3 py-2 rounded-lg border border-emerald-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300";
      const field = (label, key, ph) => html`
        <div>
          <label className="block text-xs font-bold text-slate-500 mb-1">${label}</label>
          <input value=${form[key] || ""} onInput=${(e) => set(key, e.target.value)} placeholder=${ph || ""} className=${inputCls} />
        </div>`;

      return html`
        <div className="fixed inset-0 z-50 flex items-start justify-center p-4 overflow-y-auto bg-slate-900/50 backdrop-blur-sm" onClick=${onClose}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl my-8 fade-in" onClick=${(e) => e.stopPropagation()}>
            <div className="px-5 py-3 bg-emerald-700 text-white rounded-t-2xl flex items-center justify-between">
              <div className="font-bold">${isNew ? "Add Vendor Contact" : "Edit Vendor Contact"}</div>
              <button onClick=${onClose} className="text-white/80 hover:text-white text-xl leading-none">×</button>
            </div>
            <div className="p-5 space-y-4">
              <div className="grid md:grid-cols-2 gap-3">
                ${field("Company", "company")}
                ${field("Contact name", "contact")}
                ${field("Business phone", "phone")}
                ${field("Cell / alternate", "cell")}
                ${field("Fax", "fax")}
                ${field("Email / website", "email")}
              </div>
              ${field("Address", "address")}
              <div className="grid md:grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">Type</label>
                  <select value=${form.type || ""} onChange=${(e) => set("type", e.target.value)} className=${inputCls + " bg-white"}>
                    <option value="">—</option>
                    ${typeOptions.map((t) => html`<option key=${t} value=${t}>${t}</option>`)}
                  </select>
                  <div className="flex gap-1 mt-1">
                    <input value=${newType} onInput=${(e) => setNewType(e.target.value)} placeholder="Add new type" className="min-w-0 flex-1 px-2 py-1 rounded border border-slate-200 text-xs" />
                    <button type="button" onClick=${addType} disabled=${busy || !newType.trim()} className="px-2 py-1 rounded bg-indigo-50 text-indigo-700 text-xs font-semibold hover:bg-indigo-100 disabled:opacity-50">Add</button>
                  </div>
                  <button type="button" onClick=${deleteType} disabled=${busy || !(form.type || "").trim()} className="mt-1 text-xs text-rose-600 hover:text-rose-800 disabled:opacity-40">Delete selected type</button>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">Service contract</label>
                  <select value=${form.service_contract || ""} onChange=${(e) => set("service_contract", e.target.value)} className=${inputCls + " bg-white"}>
                    <option value="">—</option><option value="Yes">Yes</option><option value="No">No</option>
                  </select>
                </div>
                ${field("Contract type", "contract_type", "e.g. Annual")}
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-500 mb-1">Assigned machines (Toilet Partitions)</label>
                <div className="flex flex-wrap gap-1 mb-2">
                  ${selected.length === 0 && html`<span className="text-xs text-slate-400">None assigned.</span>`}
                  ${selected.map((eq) => html`
                    <span key=${eq} className="inline-flex items-center gap-1 text-xs bg-indigo-50 text-indigo-700 border border-indigo-100 rounded-full px-2 py-0.5">
                      EQ ${eq}${nameMap[eq] ? " · " + nameMap[eq] : ""}
                      <button onClick=${() => toggleMachine(eq)} className="text-indigo-400 hover:text-indigo-700 leading-none">×</button>
                    </span>`)}
                </div>
                <input value=${mq} onInput=${(e) => setMq(e.target.value)} placeholder="Search machines to assign…" className=${inputCls + " mb-1"} />
                ${mq.trim() && html`
                  <div className="max-h-40 overflow-y-auto border border-slate-100 rounded-lg divide-y divide-slate-50">
                    ${options.map((m) => html`
                      <button key=${m.eq_id} onClick=${() => toggleMachine(m.eq_id)}
                        className="w-full text-left px-3 py-1.5 text-xs hover:bg-emerald-50">
                        <span className="font-semibold text-slate-600">EQ ${m.eq_id}</span> · ${m.name}</button>`)}
                    ${options.length === 0 && html`<div className="px-3 py-2 text-xs text-slate-400">No machines match.</div>`}
                  </div>`}
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-500 mb-1">Your name</label>
                <input value=${author} onInput=${(e) => setAuthor(e.target.value)} className=${inputCls} />
              </div>

              ${err && html`<div className="bg-rose-50 text-rose-700 rounded-lg px-3 py-2 text-sm">${err}</div>`}

              <div className="flex items-center justify-between pt-1">
                <div>
                  ${!isNew && html`<button onClick=${del} disabled=${busy}
                    className="px-4 py-2 rounded-full text-sm font-semibold text-rose-600 hover:bg-rose-50 disabled:opacity-50">Delete</button>`}
                </div>
                <div className="flex gap-2">
                  <button onClick=${onClose} className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
                  <button onClick=${save} disabled=${busy}
                    className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-50">${busy ? "Saving…" : "Save"}</button>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function VendorContacts() {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [q, setQ] = useState("");
      const [typeFilter, setTypeFilter] = useState("all");   // all | TPF | Facility
      const [protectedEdit, setProtectedEdit] = useState(false);
      const [gateAction, setGateAction] = useState(null);
      const [editing, setEditing] = useState(null);          // draft vendor being added/edited
      const [editingMachine, setEditingMachine] = useState(null);
      const [reloadKey, setReloadKey] = useState(0);

      useEffect(() => {
        setData(null);
        getJSON("/api/vendor-contacts").then(setData).catch((e) => setErr(e.message));
      }, [reloadKey]);
      useEffect(() => { getJSON("/api/edit-auth").then((d) => setProtectedEdit(!!d.protected)).catch(() => {}); }, []);

      if (err) return html`<div className="text-rose-600">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading contacts…" />`;

      const isAuthed = () => !protectedEdit || !!getEditPw();
      const requireAuth = (action) => { if (isAuthed()) action(); else setGateAction(() => action); };
      const reload = () => setReloadKey((k) => k + 1);

      const machines = data.machines || [];
      const nameMap = {};
      machines.forEach((m) => { nameMap[m.eq_id] = m.name; });

      const needle = q.trim().toLowerCase();
      const textMatch = (obj) => !needle ||
        Object.values(obj).some((v) => String(v == null ? "" : (Array.isArray(v) ? v.join(" ") : v)).toLowerCase().includes(needle));
      const typeMatch = (v) => typeFilter === "all" || (v.type || "").toLowerCase() === typeFilter.toLowerCase();
      const vendors = (data.vendors || []).filter((v) => typeMatch(v) && textMatch(v));
      const machineContacts = (data.machine_contacts || []).filter(textMatch);

      const emptyDraft = () => ({ company: "", contact: "", address: "", phone: "", cell: "", fax: "",
        email: "", type: "TPF", service_contract: "", contract_type: "", machine_eq: [] });
      const openNew = () => requireAuth(() => setEditing(emptyDraft()));
      const openEdit = (v) => requireAuth(() => setEditing(Object.assign(emptyDraft(), v, { machine_eq: [...(v.machine_eq || [])] })));

      const knownTypes = [...new Set(data.types || [])].sort((a, b) => a.localeCompare(b));
      const FILTERS = [{ k: "all", label: "All" }, ...knownTypes.map((t) => ({ k: t, label: t }))];

      return html`
        <div className="fade-in space-y-6">
          ${gateAction && html`<${PasswordGate}
            onCancel=${() => setGateAction(null)}
            onUnlock=${() => { const a = gateAction; setGateAction(null); if (a) a(); }} />`}
          ${editing && html`<${VendorEditModal}
            initial=${editing} machines=${machines} nameMap=${nameMap} types=${data.types || []}
            onClose=${() => setEditing(null)} onSaved=${() => { setEditing(null); reload(); }} onTypesChanged=${reload} />`}
          ${editingMachine && html`<${MachineContactEditModal}
            initial=${editingMachine} onClose=${() => setEditingMachine(null)}
            onSaved=${() => { setEditingMachine(null); reload(); }} />`}

          <div className="flex justify-end">
            <button onClick=${openNew}
              className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 shadow-sm shrink-0">+ Add Contact</button>
          </div>

          <div className="flex items-center justify-between flex-wrap gap-3">
            <div className="inline-flex rounded-full border border-emerald-200 bg-white p-0.5 text-sm font-semibold">
              ${FILTERS.map((f) => html`
                <button key=${f.k} onClick=${() => setTypeFilter(f.k)}
                  className=${"px-4 py-1.5 rounded-full transition " +
                    (typeFilter === f.k ? "bg-emerald-700 text-white shadow-sm" : "text-slate-600 hover:text-emerald-800")}>
                  ${f.label}</button>`)}
            </div>
            <input value=${q} onInput=${(e) => setQ(e.target.value)} placeholder="Search contacts…"
              className="px-4 py-2 rounded-full border border-slate-200 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-emerald-200" />
          </div>

          <div>
            <h3 className="text-sm font-extrabold text-slate-700 mb-3 flex items-center gap-2">
              Vendor & Utility List <span className="text-xs font-semibold text-slate-400">(${vendors.length})</span></h3>
            <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
              ${vendors.map((v) => html`
                <div key=${v.id} className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition flex flex-col">
                  <div className="flex items-start justify-between gap-2 mb-1">
                    <div className="font-bold text-slate-800 text-sm leading-tight">${v.company}</div>
                    <div className="flex items-center gap-1 shrink-0">
                      ${vendorTypeBadge(v.type)}
                      ${v.service_contract && v.service_contract.toLowerCase() === "yes"
                        && html`<span className="text-[10px] px-2 py-0.5 rounded-full border bg-emerald-50 text-emerald-700 border-emerald-100 font-semibold">Contract</span>`}
                    </div>
                  </div>
                  ${v.contact && html`<div className="text-xs text-slate-500 mb-1 whitespace-pre-line">${v.contact}</div>`}
                  ${v.machine_eq && v.machine_eq.length > 0 && html`
                    <div className="inline-flex items-center gap-1 text-[10px] font-semibold text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-full px-2 py-0.5 mb-2 w-fit">
                      ${v.machine_eq.map((e) => html`<span key=${e}>${nameMap[e] || "EQ " + e}</span>`)}
                    </div>`}
                  <${ContactLines} c=${v} />
                  ${v.address && html`<div className="text-[11px] text-slate-400 mt-2 leading-snug whitespace-pre-line">${v.address}</div>`}
                  ${v.contract_type && html`<div className="text-[10px] text-slate-400 mt-1">${v.contract_type}</div>`}
                  <button onClick=${() => openEdit(v)}
                    className="mt-3 self-start text-xs font-semibold text-emerald-700 hover:text-emerald-900">Edit</button>
                </div>`)}
              ${vendors.length === 0 && html`<div className="text-sm text-slate-400 col-span-full">No matching vendors.</div>`}
            </div>
          </div>

          <div>
            <h3 className="text-sm font-extrabold text-slate-700 mb-3 flex items-center gap-2">
              Machine Contacts · Toilet Partitions <span className="text-xs font-semibold text-slate-400">(${machineContacts.length})</span></h3>
            <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
              ${machineContacts.map((c, i) => html`
                <div key=${i} className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition">
                  <div className="text-[10px] font-semibold text-emerald-700 mb-1 uppercase tracking-wide">EQ ${c.eq_id} · ${c.machine_name}</div>
                  <div className="font-bold text-slate-800 text-sm leading-tight">${c.name || c.company || "(unnamed)"}</div>
                  ${(c.role || c.company) && html`<div className="text-xs text-slate-500 mb-1">${[c.role, c.company].filter(Boolean).join(" · ")}</div>`}
                  <${ContactLines} c=${c} />
                  <button onClick=${() => requireAuth(() => setEditingMachine(Object.assign({}, c)))}
                    className="mt-3 text-xs font-semibold text-emerald-700 hover:text-emerald-900">Edit</button>
                </div>`)}
              ${machineContacts.length === 0 && html`<div className="text-sm text-slate-400 col-span-full">No matching machine contacts.</div>`}
            </div>
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Longevity tab (division + department)                                */
    /* ------------------------------------------------------------------ */
    function LongevityTab({ apiUrl, title, hideDepartment, divisionKey }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [q, setQ] = useState("");
      const [deptFilter, setDeptFilter] = useState("");
      const [sort, setSort] = useState({ key: "item_num", dir: "asc" });
      const [expanded, setExpanded] = useState(new Set());
      const [editing, setEditing] = useState(null);     // { item_num, draft }
      const [saving, setSaving] = useState(null);
      const [saveErr, setSaveErr] = useState(null);
      const [protectedEdit, setProtectedEdit] = useState(false);
      const [gateAction, setGateAction] = useState(null);
      const currentYear = new Date().getFullYear();

      const divKey = (divisionKey || "bla").toLowerCase();

      const load = () => {
        setData(null);
        setErr(null);
        setDeptFilter("");
        setExpanded(new Set());
        setEditing(null);
        setSaveErr(null);
        getJSON(apiUrl).then((d) => setData(d.items || [])).catch((e) => setErr(e.message));
      };

      useEffect(() => {
        load();
        getJSON("/api/edit-auth").then((s) => setProtectedEdit(!!s.protected)).catch(() => setProtectedEdit(false));
      }, [apiUrl]);

      const isAuthed = () => !protectedEdit || !!getEditPw();
      const requireAuth = (action) => { if (isAuthed()) action(); else setGateAction(() => action); };

      const departments = useMemo(() => {
        const set = new Set((data || []).map((r) => r.department).filter(Boolean));
        return Array.from(set).sort((a, b) => a.localeCompare(b));
      }, [data]);

      const filtered = (data || []).filter((row) => {
        const matchesDept = !deptFilter || row.department === deptFilter;
        if (!matchesDept) return false;
        if (!q.trim()) return true;
        const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
        const hay = [
          row.machine,
          row.department,
          row.category,
          row.asset_num,
          row.serial_no,
          row.condition,
          row.estimated_replacement_year,
          row.comments,
        ].join(" ").toLowerCase();
        return terms.every((t) => hay.includes(t));
      });

      const sorted = [...filtered].sort((a, b) => {
        const av = (a[sort.key] || "").toString().toLowerCase();
        const bv = (b[sort.key] || "").toString().toLowerCase();
        if (sort.key === "item_num" || sort.key === "year_new" || sort.key === "estimated_replacement_year") {
          const aRaw = av.replace(/[^0-9.]/g, "");
          const bRaw = bv.replace(/[^0-9.]/g, "");
          const aHas = aRaw !== "";
          const bHas = bRaw !== "";
          // Rows without a value always sink to the bottom, regardless of direction.
          if (aHas !== bHas) return aHas ? -1 : 1;
          const an = parseFloat(aRaw) || 0;
          const bn = parseFloat(bRaw) || 0;
          if (an !== bn) return sort.dir === "asc" ? an - bn : bn - an;
        }
        if (av < bv) return sort.dir === "asc" ? -1 : 1;
        if (av > bv) return sort.dir === "asc" ? 1 : -1;
        return 0;
      });

      // "red" = past its estimated replacement year, "orange" = due this
      // year, "yellow" = due in either of the next two years, null = fine.
      const replacementUrgency = (row) => {
        const y = parseInt(row.estimated_replacement_year, 10);
        if (isNaN(y)) return null;
        if (y < currentYear) return "red";
        if (y === currentYear) return "orange";
        if (y <= currentYear + 2) return "yellow";
        return null;
      };
      const URGENCY_ROW_CLASSES = {
        red: "bg-rose-100 hover:bg-rose-200",
        orange: "bg-orange-100 hover:bg-orange-200",
        yellow: "bg-yellow-100 hover:bg-yellow-200",
      };
      const URGENCY_DETAIL_CLASSES = {
        red: "bg-rose-50/60",
        orange: "bg-orange-50/60",
        yellow: "bg-yellow-50/60",
      };

      // item_num alone is NOT reliably unique (blank Item# cells in the
      // workbook fall back to a per-sheet row number that can collide across
      // departments), so every piece of row-identity state (expand/collapse,
      // editing, saving) keys off this composite instead.
      const rowKey = (row) => (row.department || "") + "|" + (row.machine || "") + "|" + (row.item_num || "");

      const toggleRow = (key) => {
        setExpanded((prev) => {
          const next = new Set(prev);
          if (next.has(key)) next.delete(key);
          else next.add(key);
          return next;
        });
      };

      const startEdit = (row) => {
        const draft = {
          asset_num: row.asset_num || "",
          year_new: row.year_new || "",
          condition: row.condition || "",
          service_status: row.service_status || "",
          estimated_replacement_year: row.estimated_replacement_year || "",
          comments: row.comments || "",
        };
        setEditing({ key: rowKey(row), item_num: row.item_num, department: row.department, machine: row.machine, draft });
        setExpanded((prev) => new Set(prev).add(rowKey(row)));
      };

      const updateDraft = (field, value) => {
        setEditing((e) => e ? { ...e, draft: { ...e.draft, [field]: value } } : null);
      };

      const cancelEdit = () => setEditing(null);

      const saveEdit = async () => {
        if (!editing) return;
        setSaving(editing.key);
        setSaveErr(null);
        try {
          await sendJSON(`/api/longevity/${divKey}/${editing.item_num}`, "POST", {
            author: getUserName(),
            updates: editing.draft,
            department: editing.department,
            machine: editing.machine,
          });
          setEditing(null);
          load();
        } catch (e) {
          setSaveErr(e.message);
        } finally {
          setSaving(null);
        }
      };

      const setSortKey = (key) => {
        setSort((s) => ({ key, dir: s.key === key && s.dir === "asc" ? "desc" : "asc" }));
      };

      const th = (key, label, width = "") => html`
        <th key=${key} onClick=${() => setSortKey(key)}
          className=${"px-2 py-2 text-left text-xs font-semibold text-slate-600 bg-slate-50 border-b border-slate-200 cursor-pointer hover:bg-slate-100 select-none " + width}>
          ${label} ${sort.key === key && html`<span className="ml-1 text-slate-400">${sort.dir === "asc" ? "▲" : "▼"}</span>`}
        </th>`;

      const roTd = (value, classes = "") => html`<td className=${"px-2 py-2 text-sm text-slate-700 border-b border-slate-100 align-top " + classes}>${value || "-"}</td>`;

      const editInput = (field, value, placeholder, extraClasses = "") => html`
        <input type="text" value=${value} placeholder=${placeholder}
          onInput=${(e) => updateDraft(field, e.target.value)}
          className=${"w-full px-2 py-1 text-sm border border-slate-300 rounded focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none " + extraClasses}
          onClick=${(e) => e.stopPropagation()} />`;

      const detail = (label, value) => html`<div className="text-xs"><span className="font-semibold text-slate-500">${label}:</span> <span className="text-slate-700">${value || "-"}</span></div>`;

      if (err) return html`<div className="text-rose-600">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading longevity data…" />`;

      return html`
        <div className="fade-in space-y-4">
          ${gateAction && html`<${PasswordGate}
            onCancel=${() => setGateAction(null)}
            onUnlock=${() => { const a = gateAction; setGateAction(null); if (a) a(); }} />`}

          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
            <div>
              <h2 className="text-lg font-extrabold text-slate-800">${title}</h2>
              <p className="text-slate-500 text-sm">Machine condition and estimated replacement year data from the longevity workbook.</p>
              <div className="flex items-center gap-3 mt-1.5 text-xs text-slate-500">
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-rose-400"></span>Past due</span>
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-orange-400"></span>Due this year</span>
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>Due next 2 years</span>
              </div>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-xs text-slate-400">${num(sorted.length)} rows</span>
              ${!hideDepartment && html`
                <select value=${deptFilter} onChange=${(e) => setDeptFilter(e.target.value)}
                  className="px-3 py-1.5 text-sm rounded-full border border-slate-300 bg-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none">
                  <option value="">All departments</option>
                  ${departments.map((d) => html`<option key=${d} value=${d}>${d}</option>`)}
                </select>`}
              <input type="text" value=${q} onInput=${(e) => setQ(e.target.value)} placeholder="Search machines, assets, years…"
                className="px-3 py-1.5 text-sm rounded-full border border-slate-300 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none w-full sm:w-64" />
              <div className="inline-flex items-center rounded-full border border-slate-300 bg-white p-0.5 text-xs font-semibold">
                <span className="px-2 text-slate-400">Sort</span>
                ${[
                  { key: "item_num", label: "Item #" },
                  { key: "estimated_replacement_year", label: "Est. Replace Year" },
                  { key: "year_new", label: "Purchase Year" },
                ].map((opt) => {
                  const active = sort.key === opt.key;
                  return html`
                    <button key=${opt.key} onClick=${() => setSortKey(opt.key)}
                      className=${"px-2.5 py-1 rounded-full transition " + (active ? "bg-emerald-700 text-white shadow-sm" : "text-slate-600 hover:text-emerald-800")}>
                      ${opt.label}${active ? (sort.dir === "asc" ? " ▲" : " ▼") : ""}
                    </button>`;
                })}
              </div>
            </div>
          </div>

          ${saveErr && html`<div className="text-rose-600 text-sm">${saveErr}</div>`}

          <div className="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr>
                  ${!hideDepartment && th("department", "Department")}
                  ${th("machine", "Machine / Equipment")}
                  ${th("asset_num", "Asset #")}
                  ${th("estimated_replacement_year", "Est. Replace Year", "w-28")}
                  ${th("condition", "Condition", "w-28")}
                  ${th("comments", "Comments")}
                  <th className="px-2 py-2 text-left text-xs font-semibold text-slate-600 bg-slate-50 border-b border-slate-200 w-20"></th>
                </tr>
              </thead>
              <tbody>
                ${sorted.map((row) => {
                  const key = rowKey(row);
                  const isEditing = editing && editing.key === key;
                  const urgency = replacementUrgency(row);
                  return html`
                    <${React.Fragment} key=${key}>
                      <tr className=${(urgency ? URGENCY_ROW_CLASSES[urgency] + " " : "hover:bg-slate-50 ") + "cursor-pointer"} onClick=${() => toggleRow(key)}>
                        ${!hideDepartment && roTd(row.department, "whitespace-nowrap")}
                        ${roTd(row.machine, "break-words max-w-xs")}
                        ${isEditing
                          ? html`<td className="px-2 py-2 text-sm border-b border-slate-100 align-top whitespace-nowrap">${editInput("asset_num", editing.draft.asset_num, "Asset #")}</td>`
                          : roTd(row.asset_num, "whitespace-nowrap")}
                        ${isEditing
                          ? html`<td className="px-2 py-2 text-sm border-b border-slate-100 align-top whitespace-nowrap">${editInput("estimated_replacement_year", editing.draft.estimated_replacement_year, "Year", "w-20")}</td>`
                          : roTd(row.estimated_replacement_year, "font-semibold text-slate-800 whitespace-nowrap")}
                        ${isEditing
                          ? html`<td className="px-2 py-2 text-sm border-b border-slate-100 align-top whitespace-nowrap">${editInput("condition", editing.draft.condition, "Condition", "w-20")}</td>`
                          : roTd(row.condition, "whitespace-nowrap")}
                        ${isEditing
                          ? html`<td className="px-2 py-2 text-sm border-b border-slate-100 align-top">${editInput("comments", editing.draft.comments, "Comments", "max-w-xs")}</td>`
                          : roTd(row.comments, "break-words max-w-sm text-slate-500")}
                        <td className="px-2 py-2 text-sm border-b border-slate-100 align-top whitespace-nowrap text-center">
                          ${isEditing
                            ? html`
                              <div className="flex items-center justify-center gap-1">
                                <button onClick=${(e) => { e.stopPropagation(); saveEdit(); }} disabled=${saving === key}
                                  className="text-emerald-700 hover:text-emerald-900 disabled:opacity-50 text-xs font-semibold">Save</button>
                                <span className="text-slate-300">|</span>
                                <button onClick=${(e) => { e.stopPropagation(); cancelEdit(); }}
                                  className="text-slate-500 hover:text-slate-700 text-xs font-semibold">Cancel</button>
                              </div>`
                            : html`
                              <button onClick=${(e) => { e.stopPropagation(); requireAuth(() => startEdit(row)); }}
                                className="text-emerald-700 hover:text-emerald-900 text-xs font-semibold">Edit</button>`}
                        </td>
                      </tr>
                      ${(expanded.has(key) || isEditing) && html`
                        <tr className=${urgency ? URGENCY_DETAIL_CLASSES[urgency] : "bg-slate-50"}>
                          <td colspan=${hideDepartment ? 6 : 7} className="px-3 py-3 border-b border-slate-100">
                            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-2">
                              ${detail("Item #", row.item_num)}
                              ${detail("Category", row.category)}
                              ${detail("Type", row.type)}
                              ${detail("Location", row.location)}
                              ${detail("Serial #", row.serial_no)}
                              ${isEditing
                                ? html`<div className="text-xs flex items-center gap-1"><span className="font-semibold text-slate-500">Year New:</span> ${editInput("year_new", editing.draft.year_new, "Year")}</div>`
                                : detail("Year New", row.year_new)}
                              ${isEditing
                                ? html`<div className="text-xs flex items-center gap-1"><span className="font-semibold text-slate-500">Service Status:</span> ${editInput("service_status", editing.draft.service_status, "Status")}</div>`
                                : detail("Service Status", row.service_status)}
                              ${detail("As Of", row.as_of_year_month)}
                              ${!hideDepartment && detail("Department", row.department)}
                              ${detail("Division", row.division)}
                            </div>
                            ${row.comments && !isEditing && html`<div className="mt-2 text-sm text-slate-700"><span className="font-semibold text-slate-500">Comments:</span> ${row.comments}</div>`}
                          </td>
                        </tr>`}
                    </${React.Fragment}>`;
                })}
                ${sorted.length === 0 && html`
                  <tr><td colspan=${hideDepartment ? 6 : 7} className="px-3 py-8 text-center text-sm text-slate-400">
                    No matching rows.
                  </td></tr>`}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Division dashboard                                                 */
    /* ------------------------------------------------------------------ */
    const DIV_TABS = ["Departments", "Longevity", "Weekly Schedule", "Monthly Calendar", "Unscheduled", "Scheduled"];

    function DivisionDashboard({ divisionKey, onHome, onOpenDept, onOpenWo, refreshSignal }) {
      const divKey = divisionKey || "bla";
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [tab, setTab] = useState("Departments");
      const [woData, setWoData] = useState(null);
      const [woErr, setWoErr] = useState(null);
      const [creating, setCreating] = useState(false);
      const [reloadKey, setReloadKey] = useState(0);
      const [deactivating, setDeactivating] = useState(null);  // dept being deactivated
      const [restoring, setRestoring] = useState(null);        // dept being restored
      const [showInactive, setShowInactive] = useState(false);

      useEffect(() => {
        setData(null);
        getJSON("/api/divisions/" + divKey).then(setData).catch((e) => setErr(e.message));
      }, [divKey, reloadKey, refreshSignal]);

      // Drop the cached work-order lists when a WO is created/edited/deleted so
      // the open tab refetches.
      useEffect(() => { setWoData(null); setWoErr(null); }, [refreshSignal]);

      // Lazily load the division-wide work-order lists the first time the user
      // opens the Unscheduled/Scheduled tab (it's a large payload).
      useEffect(() => {
        if ((tab === "Unscheduled" || tab === "Scheduled") && !woData && !woErr) {
          getJSON("/api/workorders").then(setWoData).catch((e) => setWoErr(e.message));
        }
      }, [tab, woData, woErr]);

      const refreshAll = () => { setReloadKey((k) => k + 1); setWoData(null); setWoErr(null); };

      if (err) return html`<div className="text-rose-600">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading division…" />`;

      const totalUns = data.departments.reduce((a, d) => a + (d.unscheduled_count || 0), 0);
      const totalSch = data.departments.reduce((a, d) => a + (d.scheduled_count || 0), 0);

      return html`
        <div className="fade-in">
          ${onHome && html`<${Breadcrumb} items=${[
            { label: "Bobrick", onClick: onHome },
            { label: data.name + " Division" },
          ]} />`}
          <div className="flex items-start justify-between flex-wrap gap-3 mb-1">
            <h1 className="text-2xl font-extrabold text-slate-800">${data.name} Division</h1>
            <button onClick=${() => setCreating(true)}
              className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 shadow-sm">
              + New Work Order</button>
          </div>
          <p className="text-slate-500 mb-5">Combined quick view across all departments.</p>
          <${KpiRow} stats=${data.totals} />
          ${creating && html`<${CreateWorkOrderModal} divisionKey=${divKey}
            onClose=${() => setCreating(false)} onCreated=${refreshAll} onOpenWo=${onOpenWo} />`}

          <div className="flex gap-2 mt-8 mb-6 bg-white p-1.5 rounded-full shadow-sm border border-emerald-100 w-fit flex-wrap">
            ${(divKey === "bla" ? [...DIV_TABS, "Contacts"] : DIV_TABS).map((t) => html`
              <button key=${t} onClick=${() => setTab(t)}
                className=${"px-4 py-2 rounded-full text-sm font-semibold transition " +
                  (tab === t ? "bg-emerald-700 text-white shadow" : "text-slate-500 hover:bg-emerald-50")}>
                ${t}
                ${t === "Unscheduled" && html`<span className="ml-1 opacity-70">(${num(totalUns)})</span>`}
                ${t === "Scheduled" && html`<span className="ml-1 opacity-70">(${num(totalSch)})</span>`}
              </button>`)}
          </div>

          ${tab === "Contacts" && html`<${VendorContacts} />`}

          ${tab === "Longevity" && html`
            <div className="fade-in">
              <${LongevityTab} apiUrl=${"/api/divisions/" + divKey + "/longevity"} title="Estimated Replacement Year — ${data.name}" divisionKey=${divKey} />
            </div>`}

          ${tab === "Weekly Schedule" && html`
            <div className="fade-in">
              <${EmbeddedWeekly}
                predicate=${() => true}
                showDept=${true}
                onOpenWo=${onOpenWo}
                subtitle="All departments · scheduled & unscheduled work orders by week (Sunday → Sunday)." />
            </div>`}

          ${tab === "Monthly Calendar" && html`
            <div className="fade-in">
              <${EmbeddedMonthly}
                predicate=${() => true}
                showDept=${true}
                onOpenWo=${onOpenWo}
                title="Monthly Calendar"
                subtitle="All departments · scheduled & unscheduled work orders for the month." />
            </div>`}

          ${(tab === "Unscheduled" || tab === "Scheduled") && html`
            <div className="fade-in">
              ${woErr
                ? html`<div className="text-rose-600">${woErr}</div>`
                : !woData
                  ? html`<${Spinner} label="Loading all work orders…" />`
                  : html`<${WorkOrderList}
                      records=${tab === "Unscheduled" ? woData.unscheduled : woData.scheduled}
                      kind=${tab.toLowerCase()} onOpen=${onOpenWo}
                      filters=${tab === "Unscheduled" ? ["department", "urgency", "status"] : ["department", "status"]} />`}
            </div>`}

          ${tab === "Departments" && html`
          <div className="fade-in">
          <div className="grid md:grid-cols-2 gap-5">
            ${data.departments.map((d) => html`
              <div key=${d.key} onClick=${() => onOpenDept(d.key)}
                className="relative text-left bg-white rounded-3xl p-6 shadow-sm border border-emerald-100
                           hover:shadow-xl hover:border-emerald-300 transition group cursor-pointer">
                <button title="Deactivate department"
                  onClick=${(e) => { e.stopPropagation(); setDeactivating(d); }}
                  className="absolute top-3 right-3 w-8 h-8 rounded-full text-slate-300 hover:text-rose-600
                             hover:bg-rose-50 flex items-center justify-center text-xl leading-none
                             opacity-0 group-hover:opacity-100 transition">×</button>
                <div className="flex items-center justify-between pr-8">
                  <div>
                    <div className="text-xl font-extrabold text-slate-800 group-hover:text-emerald-800">${d.label}</div>
                    <div className="text-sm text-slate-500">${d.machine_count} machines</div>
                  </div>
                  <span className="text-emerald-500 text-2xl group-hover:translate-x-1 transition">→</span>
                </div>
                <div className="grid grid-cols-2 gap-2 mt-5 text-sm">
                  <div className="bg-emerald-50 rounded-xl px-3 py-2">
                    <div className="text-emerald-700 font-semibold">${num(d.unscheduled_count)}</div>
                    <div className="text-slate-500 text-xs">Unscheduled</div></div>
                  <div className="bg-teal-50 rounded-xl px-3 py-2">
                    <div className="text-teal-700 font-semibold">${num(d.scheduled_count)}</div>
                    <div className="text-slate-500 text-xs">Scheduled</div></div>
                  <div className="bg-cyan-50 rounded-xl px-3 py-2">
                    <div className="text-cyan-700 font-semibold">${hours(d.labor_time)}</div>
                    <div className="text-slate-500 text-xs">Labor</div></div>
                  <div className="bg-sky-50 rounded-xl px-3 py-2">
                    <div className="text-sky-700 font-semibold">${money(d.material_cost)}</div>
                    <div className="text-slate-500 text-xs">Material</div></div>
                  <div className="bg-indigo-50 rounded-xl px-3 py-2 col-span-2">
                    <div className="text-indigo-600 font-semibold">${hours(d.downtime_hours)}</div>
                    <div className="text-slate-500 text-xs">Downtime</div></div>
                </div>
                <div className="mt-4 flex justify-end">
                  <button onClick=${(e) => { e.stopPropagation(); onOpenDept(d.key, "Monthly Calendar"); }}
                    className="text-xs font-semibold text-emerald-700 hover:text-emerald-800 flex items-center gap-1.5 px-3 py-1.5 rounded-full hover:bg-emerald-50 transition">
                    <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor"
                         strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                      <line x1="16" y1="2" x2="16" y2="6"/>
                      <line x1="8" y1="2" x2="8" y2="6"/>
                      <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    Calendar
                  </button>
                </div>
              </div>`)}
          </div>

          ${(data.inactive_departments || []).length > 0 && html`
            <div className="mt-10 border-t border-slate-200 pt-4">
              <button onClick=${() => setShowInactive((v) => !v)}
                className="text-sm font-semibold text-slate-500 hover:text-emerald-800 flex items-center gap-1">
                <span>${showInactive ? "▾" : "▸"}</span>
                <span>Inactive departments (${data.inactive_departments.length})</span>
              </button>
              ${showInactive && html`
                <div className="mt-3 grid md:grid-cols-2 gap-3">
                  ${data.inactive_departments.map((d) => html`
                    <div key=${d.key} className="flex items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
                      <div className="font-semibold text-slate-600 truncate">${d.label}</div>
                      <button onClick=${() => setRestoring(d)}
                        className="px-3 py-1.5 rounded-full bg-emerald-700 text-white text-xs font-semibold hover:bg-emerald-800 whitespace-nowrap">Restore</button>
                    </div>`)}
                </div>`}
            </div>`}
          </div>`}

          ${deactivating && html`<${ConfirmActionModal}
            title="Deactivate department" danger=${true} confirmLabel="Deactivate"
