            message=${"Move “" + deactivating.label + "” to the inactive section? Its machines and work orders will be hidden everywhere but nothing is deleted — you can restore it anytime."}
            onConfirm=${async (author) => { await sendJSON("/api/departments/" + deactivating.key + "/deactivate", "POST", { author }); refreshAll(); }}
            onClose=${() => setDeactivating(null)} />`}

          ${restoring && html`<${ConfirmActionModal}
            title="Restore department" confirmLabel="Restore"
            message=${"Restore “" + restoring.label + "” and bring back its machines and work orders?"}
            onConfirm=${async (author) => { await sendJSON("/api/departments/" + restoring.key + "/restore", "POST", { author }); refreshAll(); }}
            onClose=${() => setRestoring(null)} />`}
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Floor plan                                                         */
    /* ------------------------------------------------------------------ */
    // Interactive department floor plan. View mode: click a box/sidebar row to
    // highlight the machine; "Open" jumps to its full machine page. Edit mode
    // (admin-gated) lets you drag/resize/add/delete boxes and relink machines,
    // then Save. Boxes with a pending urgency-1 work order glow red.
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    function FloorPlanTab({ deptKey, machines, onOpenMachine }) {
      const [data, setData] = useState(null);
      const [items, setItems] = useState([]);
      const [err, setErr] = useState(null);
      const [selectedId, setSelectedId] = useState(null);
      const [editing, setEditing] = useState(false);
      const [gate, setGate] = useState(false);
      const [addEq, setAddEq] = useState("");
      const [author, setAuthor] = useState(getUserName());
      const [busy, setBusy] = useState(false);
      const [reloadKey, setReloadKey] = useState(0);
      const [drag, setDrag] = useState(null);
      const canvasRef = useRef(null);
      // True once a drag gesture actually moves a box. Used so the click that
      // fires after a drag (whose target retargets to the canvas when the box
      // slides out from under the cursor) doesn't clear the selection.
      const movedRef = useRef(false);

      const canvas = (data && data.canvas) || { w: 960, h: 820 };

      useEffect(() => {
        setData(null); setErr(null); setEditing(false); setSelectedId(null);
        getJSON("/api/departments/" + deptKey + "/floorplan")
          .then((d) => { setData(d); setItems(d.items || []); })
          .catch((e) => setErr(e.message));
      }, [deptKey, reloadKey]);

      // Drag / resize via window pointer events while a gesture is active.
      useEffect(() => {
        if (!drag) return;
        const move = (e) => {
          if (e.clientX !== drag.px || e.clientY !== drag.py) movedRef.current = true;
          const sx = canvas.w / drag.rw, sy = canvas.h / drag.rh;
          const dx = (e.clientX - drag.px) * sx, dy = (e.clientY - drag.py) * sy;
          setItems((list) => list.map((it) => {
            if (it.id !== drag.id) return it;
            if (drag.mode === "resize") {
              return { ...it,
                w: clamp(drag.ow + dx, 34, canvas.w - it.x),
                h: clamp(drag.oh + dy, 24, canvas.h - it.y) };
            }
            return { ...it,
              x: clamp(drag.ox + dx, 0, canvas.w - it.w),
              y: clamp(drag.oy + dy, 0, canvas.h - it.h) };
          }));
        };
        const up = () => setDrag(null);
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
        return () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
      }, [drag, canvas.w, canvas.h]);

      const startDrag = (e, it, mode) => {
        if (!editing) return;
        e.stopPropagation(); e.preventDefault();
        movedRef.current = false;
        const rect = canvasRef.current.getBoundingClientRect();
        setSelectedId(it.id);
        setDrag({ id: it.id, mode, px: e.clientX, py: e.clientY,
          ox: it.x, oy: it.y, ow: it.w, oh: it.h, rw: rect.width, rh: rect.height });
      };

      const updateItem = (id, patch) =>
        setItems((list) => list.map((it) => (it.id === id ? { ...it, ...patch } : it)));

      const placedEqs = new Set(items.filter((i) => i.eq_id).map((i) => String(i.eq_id)));
      const available = (machines || []).filter((m) => !placedEqs.has(String(m.eq_id)));

      const addMachineBox = (eqId) => {
        const m = (machines || []).find((x) => String(x.eq_id) === String(eqId));
        if (!m) return;
        const id = "n-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        setItems((list) => list.concat([{ id, eq_id: String(m.eq_id), label: m.name,
          x: 20, y: 20, w: 120, h: 70, z: list.length,
          machine_name: m.name, has_critical_wo: m.has_critical_wo,
          all_closed: m.all_closed,
          has_guide: m.has_guide,
          stats: { unscheduled_count: m.unscheduled_count, scheduled_count: m.scheduled_count,
            downtime_hours: m.downtime_hours, labor_time: m.labor_time, material_cost: m.material_cost } }]));
        setSelectedId(id); setAddEq("");
      };

      const addLabelBox = () => {
        const id = "n-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        setItems((list) => list.concat([{ id, eq_id: "", label: "New label",
          x: 20, y: 20, w: 120, h: 60, z: list.length }]));
        setSelectedId(id);
      };

      const deleteSelected = () => {
        if (!selectedId) return;
        setItems((list) => list.filter((it) => it.id !== selectedId));
        setSelectedId(null);
      };

      const relinkSelected = (eqId) => {
        const m = (machines || []).find((x) => String(x.eq_id) === String(eqId));
        updateItem(selectedId, m
          ? { eq_id: String(m.eq_id), machine_name: m.name, has_critical_wo: m.has_critical_wo,
              all_closed: m.all_closed,
              has_guide: m.has_guide,
              stats: { unscheduled_count: m.unscheduled_count, scheduled_count: m.scheduled_count,
                downtime_hours: m.downtime_hours, labor_time: m.labor_time, material_cost: m.material_cost } }
          : { eq_id: "", machine_name: "", has_critical_wo: false, all_closed: false, stats: undefined });
      };

      const startEditing = () => {
        if (data && data.protected && !getAdminPw()) { setGate(true); return; }
        setEditing(true);
      };

      const cancelEditing = () => { setEditing(false); setSelectedId(null); setReloadKey((k) => k + 1); };

      const save = async () => {
        if (!author.trim()) { setErr("Your name is required to save the layout."); return; }
        setBusy(true); setErr(null);
        try {
          const payload = { author: author.trim(), items: items.map((it, i) => ({
            id: String(it.id).startsWith("seed-") ? "" : it.id,
            eq_id: it.eq_id || "", label: it.label || "",
            x: it.x, y: it.y, w: it.w, h: it.h, z: i })) };
          const r = await fetch(API + "/api/departments/" + deptKey + "/floorplan", {
            method: "POST", headers: adminHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify(payload) });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setAdminPw(""); setBusy(false); setEditing(false); setGate(true); return; }
          if (!r.ok) throw new Error(d.error || "Save failed");
          setUserName(author.trim());
          setData(d); setItems(d.items || []); setEditing(false); setSelectedId(null);
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };

      if (err && !data) return html`<div className="text-rose-600">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading floor plan…" />`;

      // The machines prop carries the nickname-aware display name (nickname or
      // PM name); the floor-plan payload only has the raw PM name, so resolve the
      // shown name by EQ ID here.
      const nameByEq = {};
      (machines || []).forEach((m) => { nameByEq[String(m.eq_id)] = m.name; });
      const displayName = (it) => nameByEq[String(it.eq_id)] || it.machine_name || it.label;
      const linked = items.filter((i) => i.eq_id);
      const sidebar = linked.slice().sort((a, b) => displayName(a).localeCompare(displayName(b)));
      const selected = items.find((i) => i.id === selectedId);
      const pct = (v, total) => (100 * v / total) + "%";

      return html`
        <div className="fade-in">
          <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
            <p className="text-slate-500 text-sm">
              ${linked.length} machines on the plan · click a machine to highlight it, or open its full page.
              ${data.seeded && !editing ? html` <span className="text-amber-600 font-semibold">Showing the default layout — save any edit to make it permanent.</span>` : ""}
            </p>
            <div className="flex items-center gap-2">
              ${!editing
                ? html`<button onClick=${startEditing}
                    className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 shadow-sm flex items-center gap-1.5">
                    <span>🔒</span> Edit layout</button>`
                : html`
                  <button onClick=${cancelEditing}
                    className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
                  <button onClick=${save} disabled=${busy}
                    className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60">
                    ${busy ? "Saving…" : "Save layout"}</button>`}
            </div>
          </div>

          ${err && html`<div className="text-rose-600 text-sm mb-3">${err}</div>`}

          ${editing && html`
            <div className="mb-4 p-4 rounded-2xl bg-emerald-50/70 border border-emerald-200 space-y-3">
              <div className="flex flex-wrap items-end gap-3">
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-xs font-bold text-slate-500 mb-1">Add a machine to the plan</label>
                  <select value=${addEq} onChange=${(e) => addMachineBox(e.target.value)} className=${inputCls}>
                    <option value="">Select a machine…</option>
                    ${available.map((m) => html`<option key=${m.eq_id} value=${m.eq_id}>${m.name} (${m.eq_label})</option>`)}
                  </select>
                </div>
                <button onClick=${addLabelBox}
                  className="px-3 py-2 rounded-xl border border-emerald-300 text-emerald-800 text-sm font-semibold hover:bg-emerald-100 whitespace-nowrap">+ Blank label</button>
                <div className="min-w-[160px]">
                  <label className="block text-xs font-bold text-slate-500 mb-1">Your name</label>
                  <input value=${author} onInput=${(e) => setAuthor(e.target.value)} placeholder="Required to save" className=${inputCls} />
                </div>
              </div>
              <div className="text-xs text-slate-500">Drag boxes to move · drag the corner handle to resize · select a box to edit its label, relink its machine, or delete it.</div>
            </div>`}

          ${editing && selected && html`
            <div className="mb-4 p-4 rounded-2xl bg-white border border-emerald-200 shadow-sm">
              <div className="flex items-center justify-between mb-3">
                <div className="font-bold text-slate-700 text-sm">Selected box</div>
                <button onClick=${deleteSelected}
                  className="px-3 py-1.5 rounded-full bg-rose-600 text-white text-xs font-semibold hover:bg-rose-700">Delete box</button>
              </div>
              <div className="grid sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">Label</label>
                  <input value=${selected.label || ""} onInput=${(e) => updateItem(selected.id, { label: e.target.value })} className=${inputCls} />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">Linked machine</label>
                  <select value=${selected.eq_id || ""} onChange=${(e) => relinkSelected(e.target.value)} className=${inputCls}>
                    <option value="">— none (label only) —</option>
                    ${(machines || []).map((m) => html`<option key=${m.eq_id} value=${m.eq_id}>${m.name} (${m.eq_label})</option>`)}
                  </select>
                </div>
              </div>
            </div>`}

          <div className="flex flex-col lg:flex-row gap-5">
            <!-- Sidebar: machines on the plan -->
            <div className="lg:w-72 shrink-0">
              <div className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Machines on plan (${linked.length})</div>
              <div className="space-y-2 lg:max-h-[720px] lg:overflow-y-auto pr-1">
                ${sidebar.length === 0
                  ? html`<div className="text-slate-400 text-sm">No machines linked yet.</div>`
                  : sidebar.map((it) => {
                    const st = it.stats || {};
                    const sel = it.id === selectedId;
                    return html`
                      <div key=${it.id} onClick=${() => setSelectedId(it.id)}
                        className=${"rounded-xl p-3 border cursor-pointer transition " +
                          (it.has_critical_wo
                            ? "bg-rose-50 border-rose-300 " + (sel ? "ring-2 ring-rose-400" : "hover:border-rose-400")
                            : "bg-white border-emerald-100 " + (sel ? "ring-2 ring-emerald-400 border-emerald-300" : "hover:border-emerald-300"))}>
                        <div className="flex items-start justify-between gap-2">
                          <div className=${"font-bold text-sm leading-tight " + (it.has_critical_wo ? "text-rose-700" : "text-slate-800")}>
                            ${displayName(it)}
                          </div>
                          <button onClick=${(e) => { e.stopPropagation(); onOpenMachine(it.eq_id); }}
                            title="Open full machine page"
                            className="text-[11px] font-semibold text-emerald-700 hover:text-emerald-900 whitespace-nowrap">Open →</button>
                        </div>
                        ${it.has_critical_wo && html`<div className="text-[10px] font-bold text-rose-600 mt-0.5">● Pending urgency-1 work order</div>`}
                        ${!it.has_critical_wo && it.all_closed && html`<div className="text-[10px] font-bold text-emerald-600 mt-0.5 flex items-center gap-1"><${MintLeaf} className="w-4 h-4" /> All work orders closed</div>`}
                        <div className="flex flex-wrap gap-1.5 mt-2 text-[11px]">
                          <span className="bg-emerald-50 text-emerald-700 rounded px-1.5 py-0.5 font-semibold">${num(st.unscheduled_count)} unsch.</span>
                          <span className="bg-teal-50 text-teal-700 rounded px-1.5 py-0.5 font-semibold">${num(st.scheduled_count)} sch.</span>
                          <span className="bg-indigo-50 text-indigo-600 rounded px-1.5 py-0.5 font-semibold" title="Downtime">${hours(st.downtime_hours)}</span>
                        </div>
                      </div>`;
                  })}
              </div>
            </div>

            <!-- Canvas -->
            <div className="flex-1 min-w-0">
              <div ref=${canvasRef}
                onClick=${() => { if (movedRef.current) { movedRef.current = false; return; } if (!drag) setSelectedId(null); }}
                className="relative w-full rounded-2xl border border-slate-200 bg-slate-50 overflow-hidden select-none"
                style=${{ aspectRatio: canvas.w + " / " + canvas.h,
                  backgroundImage: "linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px)",
                  backgroundSize: (100 / (canvas.w / 40)) + "% " + (100 / (canvas.h / 40)) + "%" }}>
                <!-- Divider between the upper machines and the lower row (Holz-Her),
                     stopping at the Rainbow's left edge on the right. -->
                <div className="absolute left-0 h-0.5 bg-slate-500 z-0"
                  style=${{ top: pct(455, canvas.h), width: pct(820, canvas.w) }}></div>
                ${items.map((it) => {
                  const sel = it.id === selectedId;
                  const linkedBox = !!it.eq_id;
                  const crit = it.has_critical_wo;
                  const isLine = !linkedBox && !(it.label || "").trim() && it.h <= 8;
                  const base = isLine
                    ? "absolute "
                    : "absolute rounded-md flex items-center justify-center text-center p-1 overflow-hidden text-[11px] leading-tight ";
                  const look = isLine
                    ? (sel ? "bg-emerald-600" : "bg-slate-400")
                    : (sel
                        ? "bg-emerald-200 border-2 border-emerald-600 text-emerald-900 font-semibold"
                        : (crit
                            ? "bg-rose-100 border-2 border-rose-500 text-rose-800 font-semibold"
                            : (linkedBox
                                ? "bg-white border border-slate-400 text-slate-700"
                                : "bg-slate-100 border border-dashed border-slate-300 text-slate-400")));
                  const ring = (sel && !isLine) ? " ring-2 ring-emerald-500 ring-offset-1 z-20" : "";
                  return html`
                    <div key=${it.id}
                      onPointerDown=${(e) => editing ? startDrag(e, it, "move") : null}
                      onClick=${(e) => { e.stopPropagation(); movedRef.current = false; setSelectedId(it.id); }}
                      className=${base + look + ring + (editing ? " cursor-move" : (linkedBox ? " cursor-pointer" : ""))}
                      style=${{ left: pct(it.x, canvas.w), top: pct(it.y, canvas.h),
                        width: pct(it.w, canvas.w), height: pct(it.h, canvas.h) }}>
                      <span className="pointer-events-none">${it.label}</span>
                      ${linkedBox && !editing && html`
                        <button onClick=${(e) => { e.stopPropagation(); onOpenMachine(it.eq_id); }}
                          title="Open machine page"
                          className="absolute top-0.5 right-0.5 w-5 h-5 rounded bg-emerald-700/90 text-white text-[10px] font-bold flex items-center justify-center hover:bg-emerald-800">↗</button>`}
                      ${linkedBox && !editing && it.all_closed && html`
                        <span title="All work orders closed and completed" className="absolute bottom-0.5 left-0.5 text-emerald-600 bg-white/90 rounded-full p-0.5">
                          <${MintLeaf} size=${14} />
                        </span>`}
                      ${editing && html`
                        <div onPointerDown=${(e) => startDrag(e, it, "resize")}
                          className="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-600 rounded-tl cursor-nwse-resize"></div>`}
                    </div>`;
                })}
              </div>
              <div className="flex items-center gap-4 mt-3 text-xs text-slate-500 flex-wrap">
                <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-sm border-2 border-rose-500 bg-rose-100"></span> Pending urgency-1 WO</span>
                <span className="flex items-center gap-1.5 text-emerald-600"><${MintLeaf} className="w-4 h-4" /> All WOs closed</span>
                <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-sm border border-slate-400 bg-white"></span> Machine</span>
                <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-sm border-2 border-emerald-600 bg-emerald-200"></span> Selected</span>
                <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-sm border border-dashed border-slate-300 bg-slate-100"></span> Label only</span>
              </div>
            </div>
          </div>

          ${gate && html`<${AdminGate} actionLabel="edit the floor plan"
            onUnlock=${() => { setGate(false); setEditing(true); }}
            onCancel=${() => setGate(false)} />`}
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Department dashboard                                               */
    /* ------------------------------------------------------------------ */
    function MachineCard({ m, onOpen, onDeactivate }) {
      return html`
        <div key=${m.eq_id} onClick=${() => onOpen(m.eq_id)}
          className=${"relative text-left bg-white rounded-2xl p-5 shadow-sm transition group cursor-pointer " +
            (m.has_critical_wo
              ? "border-2 border-rose-400 hover:border-rose-500 hover:shadow-lg hover:shadow-rose-100"
              : "border border-emerald-100 hover:shadow-lg hover:border-emerald-300")}>
          ${m.has_critical_wo && html`
            <span className="absolute -top-2 -left-2 bg-rose-600 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow">
              Critical WO
            </span>`}
          ${onDeactivate && html`
            <button title="Deactivate machine"
              onClick=${(e) => { e.stopPropagation(); onDeactivate(m); }}
              className="absolute top-2 right-2 w-7 h-7 rounded-full text-slate-300 hover:text-rose-600
                         hover:bg-rose-50 flex items-center justify-center text-lg leading-none
                         opacity-0 group-hover:opacity-100 transition">×</button>`}
          <div className="flex items-start justify-between gap-2 pr-6">
            <div className="font-bold text-slate-800 group-hover:text-emerald-800 leading-tight">${m.name}</div>
            ${m.has_guide && html`<span className="text-[10px] font-bold uppercase bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Guide</span>`}
          </div>
          <div className="text-xs text-emerald-600 font-mono mt-0.5">${m.eq_label}</div>
          ${m.nickname && html`<div className="text-[11px] text-slate-400 mt-0.5 truncate" title=${m.pm_name}>PM: ${m.pm_name}</div>`}
          <div className="flex flex-wrap gap-2 mt-4 text-xs">
            <span className="bg-emerald-50 text-emerald-700 rounded-lg px-2 py-1 font-semibold">${num(m.unscheduled_count)} unsch.</span>
            <span className="bg-teal-50 text-teal-700 rounded-lg px-2 py-1 font-semibold">${num(m.scheduled_count)} sch.</span>
            <span className="bg-indigo-50 text-indigo-600 rounded-lg px-2 py-1 font-semibold" title="Downtime">${hours(m.downtime_hours)} down</span>
            <span className="bg-cyan-50 text-cyan-700 rounded-lg px-2 py-1 font-semibold" title="Labor time">${hours(m.labor_time)} labor</span>
            <span className="bg-sky-50 text-sky-700 rounded-lg px-2 py-1 font-semibold" title="Material cost">${money(m.material_cost)}</span>
          </div>
        </div>`;
    }

    function MachineGrid({ machines, onOpenMachine, onDeactivate }) {
      return html`
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${machines.map((m) => html`<${MachineCard} key=${m.eq_id} m=${m} onOpen=${onOpenMachine} onDeactivate=${onDeactivate} />`)}
        </div>`;
    }

    const DEPT_TABS = ["Machines", "Longevity", "Weekly Schedule", "Monthly Calendar", "Unscheduled", "Scheduled"];

    function DepartmentDashboard({ deptKey, divisionKey, divisionLabel, initialTab, onHome, onCompany, onOpenMachine, onOpenWo, onTabChange, refreshSignal }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [q, setQ] = useState("");
      const [tab, setTab] = useState(initialTab || "Machines");
      const [creating, setCreating] = useState(false);
      const [reloadKey, setReloadKey] = useState(0);
      const [deactivating, setDeactivating] = useState(null);  // machine being deactivated
      const [restoring, setRestoring] = useState(null);        // machine being restored
      const [showInactive, setShowInactive] = useState(false);

      useEffect(() => { setTab(initialTab || "Machines"); }, [deptKey, initialTab]);

      useEffect(() => {
        setData(null);
        getJSON("/api/departments/" + deptKey).then(setData).catch((e) => setErr(e.message));
      }, [deptKey, reloadKey, refreshSignal]);

      const refresh = () => setReloadKey((k) => k + 1);

      if (err) return html`<div className="text-rose-600">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading department…" />`;

      const inactiveMachines = data.inactive_machines || [];

      const machines = data.machines.filter((m) => {
        const s = q.trim().toLowerCase();
        if (!s) return true;
        return (m.name || "").toLowerCase().includes(s) ||
               (m.eq_label || "").toLowerCase().includes(s) ||
               (m.eq_id || "").toLowerCase().includes(s);
      });
      const groups = data.groups || [];
      // Toilet Partitions gets a department-wide Trends tab aggregating just its
      // "Machines" group. Other departments keep the standard tab set.
      const deptTabs = deptKey === "toilet"
        ? ["Machines", "Floor Plan", "Trends", "Longevity", "Weekly Schedule", "Monthly Calendar", "Unscheduled", "Scheduled"]
        : DEPT_TABS;

      return html`
        <div className="fade-in">
          <${Breadcrumb} items=${[
            { label: "Bobrick", onClick: onCompany },
            { label: (divisionLabel || "BLA") + " Division", onClick: onHome },
            { label: data.label },
          ]} />
          <div className="flex items-start justify-between flex-wrap gap-3 mb-1">
            <h1 className="text-2xl font-extrabold text-slate-800">${data.label}</h1>
            <button onClick=${() => setCreating(true)}
              className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 shadow-sm">
              + New Work Order</button>
          </div>
          <p className="text-slate-500 mb-5">${data.machines.length} machines · department quick view.</p>
          <${KpiRow} stats=${data.stats} />
          ${creating && html`<${CreateWorkOrderModal} divisionKey=${divisionKey || "bla"} presetDeptKey=${deptKey}
            onClose=${() => setCreating(false)} onCreated=${() => setReloadKey((k) => k + 1)} onOpenWo=${onOpenWo} />`}

          <div className="flex gap-2 mt-8 mb-6 bg-white p-1.5 rounded-full shadow-sm border border-emerald-100 w-fit flex-wrap">
            ${deptTabs.map((t) => html`
              <button key=${t} onClick=${() => { setTab(t); if (onTabChange) onTabChange(t); }}
                className=${"px-4 py-2 rounded-full text-sm font-semibold transition " +
                  (tab === t ? "bg-emerald-700 text-white shadow" : "text-slate-500 hover:bg-emerald-50")}>
                ${t}
                ${t === "Unscheduled" && html`<span className="ml-1 opacity-70">(${data.stats.unscheduled_count})</span>`}
                ${t === "Scheduled" && html`<span className="ml-1 opacity-70">(${data.stats.scheduled_count})</span>`}
              </button>`)}
          </div>

          ${tab === "Trends" && html`
            <div className="fade-in">
              <${DeptTrendsTab} deptKey=${deptKey} group="Machines" onOpenWo=${onOpenWo} />
            </div>`}

          ${tab === "Longevity" && html`
            <div className="fade-in">
              <${LongevityTab} apiUrl=${"/api/departments/" + deptKey + "/longevity"} title="Estimated Replacement Year — ${data.label}" hideDepartment=${true} divisionKey=${divisionKey || "bla"} />
            </div>`}

          ${tab === "Weekly Schedule" && html`
            <div className="fade-in">
              <${EmbeddedWeekly}
                predicate=${(r) => r.department_key === deptKey}
                showDept=${false}
                onOpenWo=${onOpenWo}
                subtitle=${data.label + " · scheduled & unscheduled work orders by week (Sunday → Sunday)."} />
            </div>`}

          ${tab === "Monthly Calendar" && html`
            <div className="fade-in">
              <${EmbeddedMonthly}
                predicate=${(r) => r.department_key === deptKey}
                showDept=${false}
                onOpenWo=${onOpenWo}
                title="Monthly Calendar"
                subtitle=${data.label + " · scheduled & unscheduled work orders for the month."}
                deptKey=${deptKey} />
            </div>`}

          ${tab === "Floor Plan" && html`
            <${FloorPlanTab} deptKey=${deptKey} machines=${data.machines || []} onOpenMachine=${onOpenMachine} />`}

          ${tab === "Machines" && html`
            <div className="fade-in">
              <div className="flex items-center justify-end mb-3 gap-3 flex-wrap">
                <input value=${q} onInput=${(e) => setQ(e.target.value)}
                  placeholder="Search by name or EQ ID…"
                  className="px-4 py-2 rounded-full border border-emerald-200 bg-white text-sm w-64
                             focus:outline-none focus:ring-2 focus:ring-emerald-300" />
              </div>
              ${groups.length === 0
                ? html`<${MachineGrid} machines=${machines} onOpenMachine=${onOpenMachine} onDeactivate=${setDeactivating} />`
                : html`
                  <div className="space-y-8">
                    ${groups.map((g) => {
                      const inGroup = machines.filter((m) => m.group === g);
                      if (inGroup.length === 0) return null;
                      return html`
                        <section key=${g}>
                          <div className="flex items-center gap-3 mb-3">
                            <h3 className="text-base font-bold text-slate-700">${g}</h3>
                            <span className="text-xs font-semibold text-emerald-700 bg-emerald-50 rounded-full px-2.5 py-0.5">${inGroup.length}</span>
                            <div className="flex-1 h-px bg-emerald-100"></div>
                          </div>
                          <${MachineGrid} machines=${inGroup} onOpenMachine=${onOpenMachine} onDeactivate=${setDeactivating} />
                        </section>`;
                    })}
                  </div>`}
              ${machines.length === 0 && html`<div className="text-slate-400 mt-6">No machines match “${q}”.</div>`}

              ${inactiveMachines.length > 0 && html`
                <div className="mt-10 border-t border-slate-200 pt-4">
                  <button onClick=${() => setShowInactive((v) => !v)}
                    className="text-sm font-semibold text-slate-500 hover:text-emerald-800 flex items-center gap-1">
                    <span>${showInactive ? "▾" : "▸"}</span>
                    <span>Inactive machines (${inactiveMachines.length})</span>
                  </button>
                  ${showInactive && html`
                    <div className="mt-3 grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                      ${inactiveMachines.map((m) => html`
                        <div key=${m.eq_id} className="flex items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
                          <div className="min-w-0">
                            <div className="font-semibold text-slate-600 truncate">${m.name}</div>
                            <div className="text-xs text-slate-400 font-mono">EQ ID ${m.eq_id}</div>
                          </div>
                          <button onClick=${() => setRestoring(m)}
                            className="px-3 py-1.5 rounded-full bg-emerald-700 text-white text-xs font-semibold hover:bg-emerald-800 whitespace-nowrap">Restore</button>
                        </div>`)}
                    </div>`}
                </div>`}
            </div>`}

          ${tab === "Unscheduled" && html`
            <div className="fade-in">
              <${WorkOrderList} records=${data.unscheduled} kind="unscheduled" onOpen=${onOpenWo}
                filters=${["machine", "urgency", "status"]} />
            </div>`}

          ${tab === "Scheduled" && html`
            <div className="fade-in">
              <${WorkOrderList} records=${data.scheduled} kind="scheduled" onOpen=${onOpenWo}
                filters=${["machine", "status"]} />
            </div>`}

          ${deactivating && html`<${ConfirmActionModal}
            title="Deactivate machine" danger=${true} confirmLabel="Deactivate"
            message=${"Move “" + deactivating.name + "” to the inactive section? Its work orders will be hidden everywhere but nothing is deleted — you can restore it anytime."}
            onConfirm=${async (author) => { await sendJSON("/api/machines/deactivate", "POST", { author, dept_key: deptKey, eq_id: deactivating.eq_id, name: deactivating.name }); refresh(); }}
            onClose=${() => setDeactivating(null)} />`}

          ${restoring && html`<${ConfirmActionModal}
            title="Restore machine" confirmLabel="Restore"
            message=${"Restore “" + restoring.name + "” and bring back its work orders?"}
            onConfirm=${async (author) => { await sendJSON("/api/machines/restore", "POST", { author, dept_key: deptKey, eq_id: restoring.eq_id }); refresh(); }}
            onClose=${() => setRestoring(null)} />`}
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Work order list + modal                                            */
    /* ------------------------------------------------------------------ */
    // Which value each filter reads off a work-order record.
    const WO_FILTER_ACCESSORS = {
      department: (r) => r.department_label || r.department || r.department_key || "",
      machine: (r) => r.equipment_name || "",
      urgency: (r) => r.urgency || "",
      status: (r) => r.status || "",
    };
    const WO_FILTER_LABELS = {
      department: "All departments",
      machine: "All machines",
      urgency: "All urgencies",
      status: "All statuses",
    };

    // `filters` is an optional list naming which dropdowns to show, e.g.
    // ["department", "urgency", "status"]. Options are derived from the records.
    function WorkOrderList({ records, kind, onOpen, filters }) {
      const [q, setQ] = useState("");
      const [sel, setSel] = useState({});
      const active = Array.isArray(filters) ? filters : [];
      if (!records || records.length === 0)
        return html`<div className="text-slate-400 py-8 text-center">No ${kind} work orders.</div>`;

      // Always show newest first. Scheduled orders by due date, unscheduled by
      // the date they were reported; undated records sort to the bottom.
      const woTime = (r) => {
        const raw = kind === "scheduled"
          ? (r.due_date || r.date_notified)
          : (r.date_notified || r.due_date);
        const t = parseWODate(raw);
        return t === Infinity ? -Infinity : t;
      };
      const sorted = [...records].sort((a, b) => {
        const diff = woTime(b) - woTime(a);
        if (diff) return diff;
        // Same date: newest work-order number first (stable, deterministic).
        return String(b.wo_id || "").localeCompare(String(a.wo_id || ""), undefined, { numeric: true });
      });

      // Unique, sorted option values present in the records for each dropdown.
      const optionsFor = (name) => {
        const acc = WO_FILTER_ACCESSORS[name];
        return [...new Set(records.map(acc).filter(Boolean))]
          .sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
      };

      const filtered = sorted.filter((r) => {
        const s = q.trim().toLowerCase();
        if (s && !((r.wo_id || "").toLowerCase().includes(s) ||
                   (r.problem || r.audit_item || "").toLowerCase().includes(s) ||
                   (r.status || "").toLowerCase().includes(s))) return false;
        return active.every((name) =>
          !sel[name] || WO_FILTER_ACCESSORS[name](r) === sel[name]);
      });

      const selCls = "px-4 py-2 rounded-full border border-emerald-200 bg-white text-sm text-slate-700 " +
                     "focus:outline-none focus:ring-2 focus:ring-emerald-300";

      return html`
        <div>
          <div className="flex flex-wrap items-center gap-3 mb-4">
            <input value=${q} onInput=${(e) => setQ(e.target.value)}
              placeholder=${"Search " + kind + " work orders…"}
              className="px-4 py-2 rounded-full border border-emerald-200 bg-white text-sm w-full max-w-sm
                         focus:outline-none focus:ring-2 focus:ring-emerald-300" />
            ${active.map((name) => html`
              <select key=${name} value=${sel[name] || ""} className=${selCls}
                onChange=${(e) => setSel((s) => ({ ...s, [name]: e.target.value }))}>
                <option value="">${WO_FILTER_LABELS[name]}</option>
                ${optionsFor(name).map((o) => html`<option key=${o} value=${o}>${o}</option>`)}
              </select>`)}
          </div>
          <div className="space-y-3">
            ${filtered.map((r) => html`
              <button key=${r.wo_id} onClick=${() => onOpen(r.wo_id)}
                className="w-full text-left bg-white rounded-2xl p-4 shadow-sm border border-emerald-100
                           hover:shadow-md hover:border-emerald-300 transition">
                <div className="flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-bold text-emerald-800">WO #${r.wo_id}</span>
                    ${r.urgency && html`<span className=${"text-xs px-2 py-0.5 rounded-full border " + urgencyColor(r.urgency)}>${r.urgency}</span>`}
                    ${r.status && html`<span className=${"text-xs px-2 py-0.5 rounded-full border " + statusColor(r.status)}>${r.status}</span>`}
                    ${r.assigned_to && html`<span className="text-xs px-2 py-0.5 rounded-full border bg-indigo-50 text-indigo-600 border-indigo-100">${r.assigned_to}</span>`}
                    ${r.department_label && html`<span className="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">${r.department_label}</span>`}
                  </div>
                  <div className="text-xs text-slate-400 whitespace-nowrap">${r.date_notified || r.due_date || ""}</div>
                </div>
                <div className="text-sm text-slate-600 mt-1.5 line-clamp-2">${r.problem || r.audit_item || "—"}</div>
                <div className="flex gap-3 mt-2 text-xs text-slate-400">
                  <span>Labor ${hours(r.labor_time)}</span>
                  <span>Material ${money(r.material_cost)}</span>
                  <span>Downtime ${hours(r.downtime_hours)}</span>
                  ${(() => { const n = r.attachment_count != null ? r.attachment_count : (r.attachments ? r.attachments.length : 0); return n > 0 && html`<span className="text-emerald-600 font-semibold">📎 ${n}</span>`; })()}
                </div>
              </button>`)}
          </div>
          ${filtered.length === 0 && html`<div className="text-slate-400 py-6 text-center">No work orders match the current search and filters.</div>`}
        </div>`;
    }

    function Field({ label, value }) {
      if (value === undefined || value === null || value === "") return null;
      return html`
        <div>
          <div className="text-xs uppercase tracking-wide text-emerald-600 font-semibold">${label}</div>
          <div className="text-slate-700 whitespace-pre-wrap">${value}</div>
        </div>`;
    }

    // Inline editor for a work order's core fields. Requires a name.
    function WoEditForm({ rec, name, setName, technicians, onSaved, onCancel }) {
      const scheduled = rec.wo_type === "scheduled";
      const completerOptions = [
        { value: "", label: "Select who completed this…" },
        ...(technicians || []).map((n) => ({ value: n, label: n })),
        { value: "__other__", label: "Other" },
      ];
      const completerNames = (technicians || []);
      const initialPerformed = (rec.work_performed_by || "").trim();
      const knownCompleter = completerNames.includes(initialPerformed);
      const [f, setF] = useState({
        equipment_name: rec.equipment_name || "",
        equipment_eq_id: rec.equipment_eq_id || "",
        status: rec.status || "Pending",
        urgency: rec.urgency || "",
        date_notified: rec.date_notified || "",
        due_date: rec.due_date || "",
        problem: rec.problem || "",
        audit_item: rec.audit_item || "",
        work_performed_by: initialPerformed,
        helpers: rec.helpers || "",
        labor_time: rec.labor_time || "",
        material_cost: rec.material_cost || "",
        downtime_hours: rec.downtime_hours || "",
        completed_datetime: rec.completed_datetime || "",
        completion_comments: rec.completion_comments || "",
        frequency: rec.frequency || "",
      });
      const [primaryCompleter, setPrimaryCompleter] = useState(knownCompleter ? initialPerformed : "__other__");
      const [otherName, setOtherName] = useState(knownCompleter ? "" : initialPerformed);
      const set = (k) => (v) => setF((s) => ({ ...s, [k]: v }));
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);

      // Machine dropdown, sourced from this WO's department. Picking a machine
      // auto-fills the (read-only) EQ ID. If the current machine isn't in the
      // master list (e.g. an old scraped WO), we keep it as a "current" option.
      const [machines, setMachines] = useState([]);
      useEffect(() => {
        const dk = rec.department_key;
        if (!dk) { setMachines([]); return; }
        getJSON("/api/departments/" + dk).then((d) => setMachines(d.machines || [])).catch(() => setMachines([]));
      }, [rec.department_key]);

      const KEEP_CURRENT = "__keep_current__";
      const machineOptions = machines.map((m) => ({ value: String(m.eq_id), label: m.name + " (" + m.eq_label + ")" }));
      const matchedMachine = machines.find((m) =>
        (f.equipment_eq_id && m.eq_label === f.equipment_eq_id) || (f.equipment_name && m.name === f.equipment_name));
      const machineSelectValue = matchedMachine ? String(matchedMachine.eq_id) : (f.equipment_name ? KEEP_CURRENT : "");
      const machineSelectOptions = matchedMachine || !f.equipment_name
        ? machineOptions
        : [{ value: KEEP_CURRENT, label: f.equipment_name + (f.equipment_eq_id ? " (" + f.equipment_eq_id + ")" : "") + " — current" }, ...machineOptions];
      const pickMachine = (eqId) => {
        if (eqId === KEEP_CURRENT || eqId === "") return;
        const m = machines.find((x) => String(x.eq_id) === String(eqId));
        if (m) setF((s) => ({ ...s, equipment_eq_id: m.eq_label, equipment_name: m.name }));
      };

      // Both WO types only collect labor/downtime/material/work-by/comments at
      // close-out. When the status is set to "Closed and Completed" these become
      // required (scheduled WOs also require the date completed).
      const closing = f.status === CLOSED_STATUS;

      const save = async () => {
        if (!name.trim()) { setErr("Your name is required."); return; }
        let fields = { ...f };
        fields.work_performed_by = primaryCompleter === "__other__"
          ? otherName.trim()
          : primaryCompleter;
        if (closing) {
          const req = [
            ["work_performed_by", "Work performed by"],
            ["labor_time", "Labor time"],
            ["downtime_hours", "Downtime"],
            ["material_cost", "Material cost"],
            ["completion_comments", "Comments"],
          ];
          if (scheduled) req.unshift(["completed_datetime", "Date completed"]);
          for (const [k, lbl] of req) {
            if (!String(fields[k] ?? "").trim()) { setErr(lbl + " is required to close this work order."); return; }
          }
          if (!String(fields.completed_datetime || "").trim()) fields.completed_datetime = todayMDY();
        }
        setBusy(true); setErr(null);
        try {
          const d = await sendJSON("/api/workorder/" + rec.wo_id, "PATCH",
            { author: name.trim(), fields });
          onSaved(d.work_order);
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };

      return html`
        <div className="space-y-4">
          <${NameInput} value=${name} onChange=${setName} />
          <div className="grid sm:grid-cols-2 gap-3">
            <${SelectInput} label="Machine" value=${machineSelectValue} onChange=${pickMachine}
              options=${machineSelectOptions} placeholder=${machines.length ? "Select machine…" : "Loading machines…"} />
            <${TextInput} label="EQ ID" value=${f.equipment_eq_id} disabled=${true}
              hint="Set automatically from the selected machine." />
            <${SelectInput} label="Status" value=${f.status} onChange=${set("status")} options=${STATUS_OPTIONS} />
            ${scheduled
              ? html`<${TextInput} label="Due Date" value=${f.due_date} onChange=${set("due_date")} placeholder="M/D/YYYY" />`
              : html`<${SelectInput} label="Urgency" value=${f.urgency} onChange=${set("urgency")} options=${URGENCY_OPTIONS} placeholder="Select urgency…" />`}
            ${!scheduled && html`<${TextInput} label="Date Notified" value=${f.date_notified} onChange=${set("date_notified")} placeholder="MM/DD/YYYY" />`}
            ${scheduled && html`<${SelectInput} label="Frequency" value=${f.frequency} onChange=${set("frequency")} options=${FREQUENCY_OPTIONS} placeholder="How often…" />`}
          </div>
          ${scheduled
            ? html`<${TextArea} label="Audit Item" value=${f.audit_item} onChange=${set("audit_item")} rows=${4} />`
            : html`<${TextArea} label="Problem" value=${f.problem} onChange=${set("problem")} rows=${4} />`}

          ${closing && html`
            <div className="rounded-2xl border border-emerald-200 bg-emerald-50/60 p-4 space-y-3">
              <div className="text-sm font-bold text-emerald-800">Completion details (required)</div>
              <div className="grid sm:grid-cols-2 gap-3">
                <${SelectInput} label="Work Completed By" required=${true} value=${primaryCompleter} onChange=${setPrimaryCompleter} options=${completerOptions} />
                ${primaryCompleter === "__other__" && html`<${TextInput} label="Other Name" required=${true} value=${otherName} onChange=${setOtherName} placeholder="Who completed this?" />`}
                <${TextInput} label="Helpers" value=${f.helpers} onChange=${set("helpers")} placeholder="e.g. Gabriel, Max" hint="Comma-separated names of people who helped." />
                <${TextInput} label="Date Completed" required=${scheduled} value=${f.completed_datetime} onChange=${set("completed_datetime")} placeholder="MM/DD/YYYY" hint=${scheduled ? "" : "Defaults to today if left blank."} />

                <${TextInput} label="Downtime (h)" required=${true} value=${f.downtime_hours} onChange=${set("downtime_hours")} type="number" />

          ${err && html`<div className="text-rose-600 text-sm">${err}</div>`}

    // Password prompt for admin-gated actions (delete WO / view history).
    // Verifies against the server, then remembers it for the browser session.
    function AdminGate({ actionLabel, onUnlock, onCancel }) {
      const [pw, setPw] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const submit = async () => {
        if (!pw) return;
        setBusy(true); setErr(null);
        try {
          const r = await fetch(API + "/api/verify-admin-password", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw }),
          });
          const d = await r.json();
          if (!r.ok || !d.ok) throw new Error(d.error || "Incorrect password");
          setAdminPw(pw);
          onUnlock();
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };
      return html`
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4"
          onClick=${onCancel}>
          <div className="bg-white rounded-2xl shadow-xl border border-emerald-100 w-full max-w-sm p-6"
            onClick=${(e) => e.stopPropagation()}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xl">🔒</span>
              <h3 className="text-lg font-extrabold text-slate-800">Admin password required</h3>
            </div>
            <p className="text-sm text-slate-500 mb-4">Enter the admin password to ${actionLabel || "continue"}.</p>
            <input type="password" value=${pw} autoFocus
              onChange=${(e) => setPw(e.target.value)}
              onKeyDown=${(e) => { if (e.key === "Enter") submit(); }}
              placeholder="Admin password"
              className=${inputCls} />
            ${err && html`<div className="text-rose-600 text-sm mt-2">${err}</div>`}
            <div className="flex gap-2 justify-end mt-4">
              <button onClick=${onCancel}
                className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
              <button onClick=${submit} disabled=${busy || !pw}
                className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60">
                ${busy ? "Checking…" : "Unlock"}</button>
            </div>
          </div>
        </div>`;
    }

    // Admin-gated editor for a machine's display nickname. The real PM
    // equipment name is never changed; the nickname is only what MINT shows.
    // On a 401 it pops the AdminGate, then retries the save automatically.
    function NicknameModal({ deptKey, eqId, pmName, nickname, onClose, onSaved }) {
      const [nick, setNick] = useState(nickname || "");
      const [author, setAuthor] = useState(getUserName());
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const [gate, setGate] = useState(false);

      const save = async () => {
        if (!author.trim()) { setErr("Your name is required."); return; }
        setBusy(true); setErr(null);
        try {
          const r = await fetch(API + "/api/departments/" + deptKey + "/machines/" + eqId + "/nickname", {
            method: "POST",
            headers: adminHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ nickname: nick.trim(), author: author.trim() }),
          });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setAdminPw(""); setBusy(false); setGate(true); return; }
          if (!r.ok) throw new Error(d.error || "Save failed");
          setUserName(author.trim());
          onSaved(d.nickname || "");
          onClose();
        } catch (e) { setErr(e.message); setBusy(false); }
      };

      return html`
        <div className="fixed inset-0 z-[55] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4"
          onClick=${onClose}>
          <div className="bg-white rounded-2xl shadow-xl border border-emerald-100 w-full max-w-sm p-6"
            onClick=${(e) => e.stopPropagation()}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xl">🏷️</span>
              <h3 className="text-lg font-extrabold text-slate-800">Machine nickname</h3>
            </div>
            <p className="text-sm text-slate-500 mb-1">Shown throughout MINT instead of the PM name.</p>
            <div className="text-xs text-slate-400 mb-4">PM name: <span className="font-mono text-slate-500">${pmName}</span></div>
            <label className="block text-xs font-bold text-slate-500 mb-1">Nickname</label>
            <input value=${nick} autoFocus
              onInput=${(e) => setNick(e.target.value)}
              onKeyDown=${(e) => { if (e.key === "Enter") save(); }}
              placeholder="Leave blank to use the PM name"
              className=${inputCls} />
            <div className="mt-3"><${NameInput} value=${author} onChange=${setAuthor} /></div>
            ${err && html`<div className="text-rose-600 text-sm mt-2">${err}</div>`}
            <div className="flex gap-2 justify-end mt-4">
              <button onClick=${onClose}
                className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
              <button onClick=${save} disabled=${busy}
                className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60">
                ${busy ? "Saving…" : "Save"}</button>
            </div>
          </div>
          ${gate && html`<${AdminGate} actionLabel="set the machine nickname"
            onUnlock=${() => { setGate(false); save(); }}
            onCancel=${() => setGate(false)} />`}
        </div>`;
    }

    function WorkOrderModal({ woId, technicians, onClose, onOpenWo, onChanged }) {
      const [rec, setRec] = useState(null);
      const [err, setErr] = useState(null);
      const [editing, setEditing] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [name, setName] = useState(getUserName());
      const [adminProtected, setAdminProtected] = useState(false);
      const [gate, setGate] = useState(null);       // {label, action} when a password is needed
      const [audit, setAudit] = useState(null);      // version history (loaded on demand, gated)
      const [auditLoading, setAuditLoading] = useState(false);
      const [deleting, setDeleting] = useState(false);
      const [stopping, setStopping] = useState(false);

      const load = useCallback(() => {
        setRec(null); setErr(null);
        getJSON("/api/workorder/" + woId).then(setRec).catch((e) => setErr(e.message));
      }, [woId]);

      useEffect(() => { load(); setEditing(false); setShowHistory(false); setAudit(null); }, [load]);
      useEffect(() => {
        getJSON("/api/admin-auth").then((d) => setAdminProtected(!!d.protected)).catch(() => {});
      }, []);

      const refresh = () => {
        getJSON("/api/workorder/" + woId).then(setRec).catch((e) => setErr(e.message));
        if (onChanged) onChanged();
      };

      // Run `action` if admin isn't required / already unlocked this session;
      // otherwise pop the password gate first and run it once unlocked.
      const requireAdmin = (label, action) => {
        if (!adminProtected || getAdminPw()) { action(); return; }
        setGate({ label, action });
      };

      const doDelete = async () => {
        if (!window.confirm("Delete work order #" + woId + " permanently? This cannot be undone.")) return;
        setDeleting(true); setErr(null);
        try {
          const r = await fetch(API + "/api/workorder/" + woId, { method: "DELETE", headers: adminHeaders() });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setAdminPw(""); setDeleting(false); setGate({ label: "delete this work order", action: doDelete }); return; }
          if (!r.ok) throw new Error(d.error || "delete failed");
          if (onChanged) onChanged();
          onClose();
        } catch (e) { setErr(e.message); setDeleting(false); }
      };
      const remove = () => requireAdmin("delete this work order", doDelete);

      const doStopRecurrence = async () => {
        if (!window.confirm("Stop this recurring series? No future work orders will be generated. Existing ones are kept.")) return;
        setStopping(true); setErr(null);
        try {
          const r = await fetch(API + "/api/workorder/" + woId + "/stop-recurrence", {
            method: "POST", headers: adminHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ author: getUserName() }),
          });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setAdminPw(""); setStopping(false); setGate({ label: "stop recurrence", action: doStopRecurrence }); return; }
          if (!r.ok) throw new Error(d.error || "failed to stop recurrence");
          refresh();
        } catch (e) { setErr(e.message); } finally { setStopping(false); }
      };
      const stopRecur = () => requireAdmin("stop recurrence", doStopRecurrence);

      // Build a PDF of the work order (via jsPDF) and download it directly - no
      // print dialog. Works for any WO (scraped or MINT-created) using the detail
      // already loaded into `rec`.
      const exportWo = () => {
        if (!rec) return;
        const JsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!JsPDF) { setErr("PDF library failed to load. Refresh the page and try again."); return; }
        const doc = new JsPDF({ unit: "pt", format: "letter" });
        const MARGIN = 48;
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const contentW = pageW - MARGIN * 2;
        let y = MARGIN;

        const ensure = (needed) => {
          if (y + needed > pageH - MARGIN) { doc.addPage(); y = MARGIN; }
        };
        const text = (str, x, size, style, color) => {
          doc.setFont("helvetica", style || "normal");
          doc.setFontSize(size);
          doc.setTextColor.apply(doc, color || [30, 41, 59]);
          const lines = doc.splitTextToSize(String(str == null ? "" : str), contentW - (x - MARGIN));
          for (const ln of lines) { ensure(size + 4); doc.text(ln, x, y); y += size + 4; }
        };

        // Header band
        doc.setFillColor(37, 99, 235);
        doc.rect(0, 0, pageW, 6, "F");
        doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(37, 99, 235);
        doc.text("Bobrick", MARGIN, y + 10);
        doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(100, 116, 139);
        doc.text("Maintenance Work Order", MARGIN, y + 26);
        doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(30, 41, 59);
        doc.text("Work Order #" + (rec.wo_id || ""), pageW - MARGIN, y + 12, { align: "right" });
        if (rec.is_manual) {
          doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(4, 120, 87);
          doc.text("MINT", pageW - MARGIN, y + 28, { align: "right" });
        }
        y += 44;
        doc.setDrawColor(37, 99, 235); doc.setLineWidth(1.5);
        doc.line(MARGIN, y, pageW - MARGIN, y); y += 20;

        // Field table (two columns: label / value)
        const rows = [];
        const add = (label, val) => {
          if (val !== undefined && val !== null && String(val).trim() !== "") rows.push([label, String(val)]);
        };
        add("Machine", rec.equipment_name);
        add("EQ ID", rec.equipment_eq_id);
        add("Department", rec.department);
        add("Type", rec.wo_type);
        add("Status", rec.status);
        add("Urgency", rec.urgency);
        add("Date Notified", rec.date_notified);
        add("Due Date", rec.due_date);
        if (rec.frequency) add("Frequency", rec.recurrence_stopped ? rec.frequency + " (recurrence stopped)" : rec.frequency);
        if (rec.status === CLOSED_STATUS) {
          add("Completed", rec.completed_datetime);
          add("Work Performed By", rec.work_performed_by);
          add("Helpers", rec.helpers);
          add("Labor Time", rec.labor_time ? hours(rec.labor_time) : "");
          add("Material Cost", rec.material_cost ? money(rec.material_cost) : "");
          add("Downtime", rec.downtime_hours ? hours(rec.downtime_hours) : "");
        }
        const labelX = MARGIN, valX = MARGIN + 150;
        for (const [label, val] of rows) {
          doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(71, 85, 105);
          const valLines = doc.splitTextToSize(val, contentW - 150);
          const rowH = Math.max(14, valLines.length * 13);
          ensure(rowH + 4);
          const rowTop = y;
          doc.text(label, labelX, y + 9);
          doc.setFont("helvetica", "normal"); doc.setTextColor(30, 41, 59);
          let vy = y + 9;
          for (const ln of valLines) { doc.text(ln, valX, vy); vy += 13; }
          y = rowTop + rowH + 4;
          doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.5);
          doc.line(MARGIN, y - 2, pageW - MARGIN, y - 2);
        }

        const section = (title, body) => {
          if (!body || !String(body).trim()) return;
          y += 12; ensure(30);
          text(title.toUpperCase(), MARGIN, 10, "bold", [71, 85, 105]);
          y += 2;
          text(body, MARGIN, 11, "normal", [30, 41, 59]);
        };
        section("Problem", rec.problem);
        section("Audit Item", rec.audit_item);
        if (rec.status === CLOSED_STATUS) section("Comments", rec.completion_comments);

        if (rec.wo_type !== "scheduled" && Array.isArray(rec.solutions) && rec.solutions.length) {
          y += 12; ensure(30);
          text("SOLUTION LOG", MARGIN, 10, "bold", [71, 85, 105]); y += 2;
          for (const s of rec.solutions) {
            const meta = (s.author || "\u2014") + (s.created_at ? "  \u00b7  " + s.created_at : "");
            text(meta, MARGIN + 4, 9, "italic", [148, 163, 184]);
            text(s.text || "", MARGIN + 4, 11, "normal", [30, 41, 59]);
            y += 4;
          }
        }

        if (Array.isArray(rec.attachments) && rec.attachments.length) {
          y += 12; ensure(30);
          text("ATTACHMENTS", MARGIN, 10, "bold", [71, 85, 105]); y += 2;
          for (const a of rec.attachments) {
            const line = "\u2022 " + (a.filename || "file") + (a.uploaded_by ? "  (" + a.uploaded_by + ")" : "");
            text(line, MARGIN + 4, 11, "normal", [30, 41, 59]);
          }
        }

        y += 20; ensure(20);
        doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.5);
        doc.line(MARGIN, y, pageW - MARGIN, y); y += 12;
        text("Exported " + new Date().toLocaleString(), MARGIN, 9, "normal", [148, 163, 184]);

        doc.save("WorkOrder-" + (rec.wo_id || "export") + ".pdf");
      };

      const loadAudit = async () => {
        setAuditLoading(true); setErr(null);
        try {
          const r = await fetch(API + "/api/workorder/" + woId + "/audit", { headers: adminHeaders() });
          const d = await r.json().catch(() => ({}));
