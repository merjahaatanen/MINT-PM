    /* ------------------------------------------------------------------ */
    /* Checklist edit auth + markdown-table helpers                       */
    /* ------------------------------------------------------------------ */
    // The shared edit password is kept only in sessionStorage (cleared when the
    // browser tab closes) and sent as a header on every mutating request.
    function getEditPw() { try { return sessionStorage.getItem("blaEditPw") || ""; } catch (e) { return ""; } }
    function setEditPw(v) { try { v ? sessionStorage.setItem("blaEditPw", v) : sessionStorage.removeItem("blaEditPw"); } catch (e) {} }
    function editHeaders(extra) {
      const h = Object.assign({}, extra || {});
      const pw = getEditPw();
      if (pw) h["X-Edit-Password"] = pw;
      return h;
    }

    // Convert between a table cell's stored markdown (<br>-joined) and the
    // newline-per-item text shown in the friendly editor.
    function cellToText(s) { return String(s == null ? "" : s).replace(/<br\s*\/?>/gi, "\n"); }
    function cellToMd(s) {
      return String(s == null ? "" : s).split(/\r?\n/).map((x) => x.trim()).filter((x) => x.length).join("<br>");
    }
    function splitGuideRow(line) {
      let s = line.trim();
      if (s.startsWith("|")) s = s.slice(1);
      if (s.endsWith("|")) s = s.slice(0, -1);
      return s.split("|").map((c) => c.trim());
    }
    // Split guide markdown into ordered blocks of {type:"text"} and
    // {type:"table", headers, rows} so we can render a form-based editor and
    // faithfully rebuild the markdown afterwards.
    function parseGuideBlocks(md) {
      const lines = (md || "").split(/\r?\n/);
      const blocks = []; let buf = []; let i = 0;
      const flush = () => {
        const text = buf.join("\n").replace(/\s+$/, "");
        if (text.trim().length) blocks.push({ type: "text", text });
        buf = [];
      };
      while (i < lines.length) {
        const isRow = /^\s*\|.*\|\s*$/.test(lines[i]);
        const nextSep = i + 1 < lines.length && /^\s*\|?[\s:|-]*-{2,}[\s:|-]*$/.test(lines[i + 1]);
        if (isRow && nextSep) {
          flush();
          const headers = splitGuideRow(lines[i]);
          i += 2;
          const rows = [];
          while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(splitGuideRow(lines[i])); i++; }
          blocks.push({ type: "table", headers, rows });
          continue;
        }
        buf.push(lines[i]); i++;
      }
      flush();
      return blocks.length ? blocks : [{ type: "text", text: md || "" }];
    }
    function blocksToGuideMarkdown(blocks) {
      const parts = blocks.map((b) => {
        if (b.type === "text") return (b.text || "").replace(/\s+$/, "");
        const cols = b.headers.length;
        const head = "| " + b.headers.map((h) => (h || "").trim()).join(" | ") + " |";
        const sep = "| " + b.headers.map(() => ":---").join(" | ") + " |";
        const rows = b.rows.map((r) => {
          const cells = [];
          for (let c = 0; c < cols; c++) cells.push(cellToMd(r[c] || ""));
          return "| " + cells.join(" | ") + " |";
        });
        return [head, sep, ...rows].join("\n");
      });
      return parts.filter((p) => p !== "").join("\n\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
    }

    // Modal that verifies the shared edit password against the server.
    function PasswordGate({ onUnlock, onCancel }) {
      const [pw, setPw] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const submit = async () => {
        if (!pw) return;
        setBusy(true); setErr(null);
        try {
          const r = await fetch(API + "/api/verify-edit-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw }),
          });
          const d = await r.json();
          if (!r.ok || !d.ok) throw new Error(d.error || "Incorrect password");
          setEditPw(pw);
          onUnlock();
        } catch (e) { setErr(e.message); }
        finally { setBusy(false); }
      };
      return html`
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4"
          onClick=${onCancel}>
          <div className="bg-white rounded-2xl shadow-xl border border-emerald-100 w-full max-w-sm p-6"
            onClick=${(e) => e.stopPropagation()}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xl">🔒</span>
              <h3 className="text-lg font-extrabold text-slate-800">Unlock editing</h3>
            </div>
            <p className="text-sm text-slate-500 mb-4">Enter the shared edit password to make changes to checklists.</p>
            <input type="password" value=${pw} autoFocus
              onInput=${(e) => setPw(e.target.value)}
              onKeyDown=${(e) => { if (e.key === "Enter") submit(); }}
              placeholder="Password"
              className="w-full px-4 py-2 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-300 mb-3" />
            ${err && html`<div className="bg-rose-50 text-rose-700 rounded-lg px-3 py-2 text-sm mb-3">${err}</div>`}
            <div className="flex justify-end gap-2">
              <button onClick=${onCancel} className="px-4 py-2 rounded-full text-sm font-semibold text-slate-600 hover:bg-slate-50">Cancel</button>
              <button onClick=${submit} disabled=${busy || !pw}
                className="px-4 py-2 rounded-full text-sm font-semibold bg-emerald-700 hover:bg-emerald-800 text-white disabled:opacity-50">
                ${busy ? "Checking…" : "Unlock"}
              </button>
            </div>
          </div>
        </div>`;
    }

    // Friendly, form-based editor for the checklist. Each table row becomes a
    // labeled card with one field per column; each field is a plain textarea
    // where every line is a bullet (stored as <br> in the markdown).
    function GuideFormEditor({ blocks, onChange }) {
      const clone = () => blocks.map((b) => b.type === "table"
        ? { type: "table", headers: [...b.headers], rows: b.rows.map((r) => [...r]) }
        : { ...b });
      const apply = (fn) => { const c = clone(); fn(c); onChange(c); };
      const rowsOf = (s) => Math.max(2, (cellToText(s).match(/\n/g) || []).length + 1);
      return html`
        <div className="space-y-5">
          ${blocks.map((b, bi) => b.type === "text"
            ? html`<div key=${"t" + bi} className="bg-white rounded-2xl border border-slate-200 p-4">
                <label className="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Heading / notes</label>
                <textarea value=${b.text}
                  onInput=${(e) => apply((c) => { c[bi].text = e.target.value; })}
                  rows=${Math.max(2, (b.text.match(/\n/g) || []).length + 1)}
                  className="w-full text-sm leading-relaxed bg-slate-50 rounded-xl p-3 border border-slate-200
                             focus:outline-none focus:ring-2 focus:ring-emerald-300"></textarea>
              </div>`
            : html`<div key=${"tb" + bi} className="bg-white rounded-2xl border border-emerald-100 p-4">
                <div className="flex items-center flex-wrap gap-2 mb-3">
                  ${b.headers.map((h, hi) => html`
                    <input key=${hi} value=${h}
                      onInput=${(e) => apply((c) => { c[bi].headers[hi] = e.target.value; })}
                      className="text-[11px] font-bold uppercase tracking-wide text-emerald-800 bg-emerald-50 rounded-lg px-2 py-1
                                 border border-emerald-100 focus:outline-none focus:ring-2 focus:ring-emerald-300" />`)}
                </div>
                <div className="space-y-3">
                  ${b.rows.map((row, ri) => html`
                    <div key=${ri} className="rounded-xl border border-slate-200 bg-slate-50/60 p-3">
                      <div className="grid gap-3" style=${{ gridTemplateColumns: "repeat(" + b.headers.length + ", minmax(0,1fr))" }}>
                        ${b.headers.map((h, ci) => html`
                          <div key=${ci}>
                            <label className="block text-[11px] font-semibold text-slate-500 mb-1">${h}</label>
                            <textarea value=${cellToText(row[ci] || "")}
                              placeholder="One item per line"
                              onInput=${(e) => apply((c) => { c[bi].rows[ri][ci] = e.target.value; })}
                              rows=${rowsOf(row[ci] || "")}
                              className="w-full text-sm leading-relaxed bg-white rounded-lg p-2 border border-slate-200
                                         focus:outline-none focus:ring-2 focus:ring-emerald-300"></textarea>
                          </div>`)}
                      </div>
                      <div className="flex justify-end mt-2">
                        <button onClick=${() => apply((c) => { c[bi].rows.splice(ri, 1); })}
                          className="text-xs font-semibold text-rose-500 hover:text-rose-700">Remove row</button>
                      </div>
                    </div>`)}
                </div>
                <button onClick=${() => apply((c) => { c[bi].rows.push(b.headers.map(() => "")); })}
                  className="mt-3 text-sm font-semibold text-emerald-700 hover:text-emerald-900">+ Add row</button>
              </div>`)}
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Checklist (Ollama) tab                                             */
    /* ------------------------------------------------------------------ */
    function ChecklistTab({ deptKey, eqId, woIds, onOpenWo }) {
      const [state, setState] = useState({ loading: true });
      const [busy, setBusy] = useState(null);   // null | "generate" | "update" | "save"
      const [err, setErr] = useState(null);
      const [info, setInfo] = useState(null);
      const [editing, setEditing] = useState(false);
      const [editorMode, setEditorMode] = useState("form");  // "form" | "raw"
      const [blocks, setBlocks] = useState([]);
      const [rawDraft, setRawDraft] = useState("");
      const [protectedEdit, setProtectedEdit] = useState(false);
      const [gateAction, setGateAction] = useState(null);    // pending action while locked
      const ref = useRef(null);
      const base = "/api/departments/" + deptKey + "/machines/" + eqId + "/guide";

      const [showHistory, setShowHistory] = useState(false);
      const [versions, setVersions] = useState(null);
      const [histBusy, setHistBusy] = useState(false);
      const [viewing, setViewing] = useState(null);  // historical version being previewed
      const [adminProtected, setAdminProtected] = useState(false);
      const [adminGate, setAdminGate] = useState(null); // {label, action} while version history is locked

      const isAuthed = () => !protectedEdit || !!getEditPw();
      const requireAuth = (action) => { if (isAuthed()) action(); else setGateAction(() => action); };

      // Version history is gated by the admin password (same as work-order history).
      const requireAdmin = (label, action) => {
        if (!adminProtected || getAdminPw()) { action(); return; }
        setAdminGate({ label, action });
      };

      const load = useCallback(() => {
        setState({ loading: true });
        getJSON(base).then((d) => setState({ loading: false, ...d })).catch((e) => setErr(e.message));
      }, [base]);

      useEffect(() => {
        load(); setEditing(false); setInfo(null); setErr(null);
        setViewing(null); setShowHistory(false); setVersions(null);
      }, [load]);
      useEffect(() => { getJSON("/api/edit-auth").then((d) => setProtectedEdit(!!d.protected)).catch(() => {}); }, []);
      useEffect(() => { getJSON("/api/admin-auth").then((d) => setAdminProtected(!!d.protected)).catch(() => {}); }, []);

      // Any 401 means the stored password is missing/stale: drop it and re-prompt.
      const handleLocked = () => { setEditPw(""); setErr("Editing is locked. Enter the shared edit password."); };

      // Shared POST to the guide endpoint. First-time generation uses the edit
      // password; a full rebuild ("regen") is gated by the ADMIN password.
      const runGenerate = useCallback(async (regen) => {
        setBusy("generate"); setErr(null); setInfo(null);
        try {
          const url = API + base + (regen ? "?regenerate=1" : "");
          const r = await fetch(url, { method: "POST", headers: regen ? adminHeaders() : editHeaders() });
          const d = await r.json();
          if (r.status === 401) {
            if (regen) { setAdminPw(""); setAdminGate({ label: "regenerate the checklist", action: () => runGenerate(true) }); }
            else handleLocked();
            return;
          }
          if (!r.ok) throw new Error(d.error || "generation failed");
          setState({ loading: false, ...d });
        } catch (e) { setErr(e.message); }
        finally { setBusy(null); }
      }, [base]);

      const generate = useCallback(() => runGenerate(false), [runGenerate]);

      // Full rebuild from scratch (same endpoint as first generation). Confirm
      // first since it re-runs the model over every unscheduled work order.
      const regenerate = useCallback(() => {
        if (window.confirm("Rebuild this checklist from scratch using all unscheduled work orders? Your saved edits are kept, and the current version stays in history.")) {
          runGenerate(true);
        }
      }, [runGenerate]);

      const update = useCallback(async () => {
        setBusy("update"); setErr(null); setInfo(null);
        try {
          const r = await fetch(API + base + "/update", { method: "POST", headers: editHeaders() });
          const d = await r.json();
          if (r.status === 401) { handleLocked(); return; }
          if (!r.ok) throw new Error(d.error || "update failed");
          setState({ loading: false, ...d });
          setInfo(d.updated
            ? `Merged ${d.new_count} new work order${d.new_count === 1 ? "" : "s"} — your edits were preserved.`
            : "No new work orders since the last build — checklist unchanged.");
        } catch (e) { setErr(e.message); }
        finally { setBusy(null); }
      }, [base]);

      const startEdit = useCallback(() => {
        const md = state.markdown || "";
        setBlocks(parseGuideBlocks(md));
        setRawDraft(md);
        setEditorMode("form");
        setEditing(true); setErr(null); setInfo(null);
      }, [state.markdown]);

      const switchMode = (mode) => {
        if (mode === editorMode) return;
        if (mode === "raw") setRawDraft(blocksToGuideMarkdown(blocks));
        else setBlocks(parseGuideBlocks(rawDraft));
        setEditorMode(mode);
      };

      const save = useCallback(async () => {
        const markdown = editorMode === "raw" ? rawDraft : blocksToGuideMarkdown(blocks);
        setBusy("save"); setErr(null); setInfo(null);
        try {
          const r = await fetch(API + base, {
            method: "PUT",
            headers: editHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ markdown }),
          });
          const d = await r.json();
          if (r.status === 401) { handleLocked(); return; }
          if (!r.ok) throw new Error(d.error || "save failed");
          setState({ loading: false, ...d });
          setEditing(false);
          setInfo("Your edits were saved.");
        } catch (e) { setErr(e.message); }
        finally { setBusy(null); }
      }, [base, editorMode, rawDraft, blocks]);

      const loadHistory = useCallback(async () => {
        setHistBusy(true); setErr(null);
        try {
          const r = await fetch(API + base + "/versions", { headers: adminHeaders() });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setAdminPw(""); setShowHistory(false); setAdminGate({ label: "view version history", action: openHistory }); return; }
          if (!r.ok) throw new Error(d.error || "failed to load history");
          setVersions(d.versions || []);
        } catch (e) { setErr(e.message); }
        finally { setHistBusy(false); }
      }, [base]);

      const openHistory = () => requireAdmin("view version history", () => { setShowHistory(true); loadHistory(); });

      const openVersion = useCallback(async (n) => {
        setErr(null);
        try {
          const r = await fetch(API + base + "/versions/" + n, { headers: adminHeaders() });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setAdminPw(""); setAdminGate({ label: "view version history", action: () => openVersion(n) }); return; }
          if (!r.ok) throw new Error(d.error || "failed to load version");
          setViewing(d);
        } catch (e) { setErr(e.message); }
      }, [base]);

      const restoreVersion = useCallback(async (n) => {
        setBusy("restore"); setErr(null); setInfo(null);
        try {
          const r = await fetch(API + base + "/versions/" + n + "/restore", {
            method: "POST",
            headers: editHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({}),
          });
          const d = await r.json();
          if (r.status === 401) { handleLocked(); return; }
          if (!r.ok) throw new Error(d.error || "restore failed");
          setState({ loading: false, ...d });
          setViewing(null);
          loadHistory();
          setInfo("Restored version " + n + " as a new version.");
        } catch (e) { setErr(e.message); }
        finally { setBusy(null); }
      }, [base, loadHistory]);

      // Render markdown, linkify known WO numbers, then turn bulleted table
      // cells into real spaced-out lists for readability.
      const renderedHtml = state.markdown ? beautifyGuideCells(linkifyGuide(marked.parse(state.markdown), woIds)) : "";
      const viewHtml = viewing ? beautifyGuideCells(linkifyGuide(marked.parse(viewing.content || ""), woIds)) : "";

      useEffect(() => {
        const el = ref.current;
        if (!el || editing) return;
        const handler = (e) => {
          const wo = e.target && e.target.dataset && e.target.dataset.wo;
          if (wo) onOpenWo(wo);
        };
        el.addEventListener("click", handler);
        return () => el.removeEventListener("click", handler);
      }, [renderedHtml, onOpenWo, editing]);

      if (state.loading) return html`<${Spinner} label="Loading checklist…" />`;

      const btn = "px-4 py-2 rounded-full text-sm font-semibold shadow-sm disabled:opacity-50";
      const unlocked = protectedEdit && !!getEditPw();

      return html`
        <div>
          ${gateAction && html`<${PasswordGate}
            onCancel=${() => setGateAction(null)}
            onUnlock=${() => { const a = gateAction; setGateAction(null); if (a) a(); }} />`}

          ${adminGate && html`<${AdminGate} actionLabel=${adminGate.label}
            onCancel=${() => setAdminGate(null)}
            onUnlock=${() => { const a = adminGate.action; setAdminGate(null); if (a) a(); }} />`}

          <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
            <div className="text-sm text-slate-500 flex items-center gap-2">
              ${state.exists
                ? html`Built from this machine's unscheduled work orders. Edits you make are kept when you update.`
                : html`No checklist yet — generate one from the unscheduled work orders.`}
              ${protectedEdit && html`<span className=${"text-[11px] px-2 py-0.5 rounded-full border " +
                (unlocked ? "bg-emerald-50 text-emerald-700 border-emerald-100" : "bg-slate-100 text-slate-500 border-slate-200")}>
                ${unlocked ? "🔓 Editing unlocked" : "🔒 Editing locked"}
              </span>`}
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              ${!state.exists && html`
                <button onClick=${() => requireAuth(generate)} disabled=${!!busy} className=${btn + " bg-emerald-700 hover:bg-emerald-800 text-white"}>
                  ${busy === "generate" ? "Generating…" : "Generate Checklist"}
                </button>`}

              ${state.exists && !editing && html`
                <button onClick=${openHistory} disabled=${!!busy} title="See and restore previous versions"
                  className=${btn + " bg-white border border-emerald-200 text-emerald-800 hover:bg-emerald-50"}>
                  History${adminProtected && !getAdminPw() ? " 🔒" : ""}
                </button>
                <button onClick=${() => requireAuth(startEdit)} disabled=${!!busy} className=${btn + " bg-white border border-emerald-200 text-emerald-800 hover:bg-emerald-50"}>
                  Edit${protectedEdit && !getEditPw() ? " 🔒" : ""}
                </button>
                <button onClick=${() => requireAdmin("regenerate the checklist", regenerate)} disabled=${!!busy} title="Rebuild the checklist from scratch from all unscheduled work orders (admin only; your saved edits are kept)"
                  className=${btn + " bg-white border border-emerald-200 text-emerald-800 hover:bg-emerald-50"}>
                  ${busy === "generate" ? "Regenerating…" : "Regenerate"}${adminProtected && !getAdminPw() ? " 🔒" : ""}
                </button>
                <button onClick=${update} disabled=${!!busy} title="Adds newly reported issues while keeping your edits (no password needed)"
                  className=${btn + " bg-emerald-700 hover:bg-emerald-800 text-white"}>
                  ${busy === "update" ? "Updating…" : "Update with new work orders"}
                </button>`}

              ${editing && html`
                <div className="inline-flex rounded-full border border-emerald-200 bg-white p-0.5 text-xs font-semibold mr-1">
                  ${["form", "raw"].map((mode) => html`
                    <button key=${mode} onClick=${() => switchMode(mode)}
                      className=${"px-3 py-1.5 rounded-full transition " +
                        (editorMode === mode ? "bg-emerald-700 text-white shadow-sm" : "text-slate-600 hover:text-emerald-800")}>
                      ${mode === "form" ? "Easy editor" : "Markdown"}
                    </button>`)}
                </div>
                <button onClick=${() => setEditing(false)} disabled=${!!busy} className=${btn + " bg-white border border-slate-200 text-slate-600 hover:bg-slate-50"}>
                  Cancel
                </button>
                <button onClick=${save} disabled=${!!busy} className=${btn + " bg-emerald-700 hover:bg-emerald-800 text-white"}>
                  ${busy === "save" ? "Saving…" : "Save edits"}
                </button>`}
            </div>
          </div>

          ${err && html`<div className="bg-rose-50 text-rose-700 rounded-xl px-4 py-3 mb-4 text-sm">${err}</div>`}
          ${info && html`<div className="bg-emerald-50 text-emerald-800 rounded-xl px-4 py-3 mb-4 text-sm">${info}</div>`}
          ${busy && busy !== "save" && html`<${Spinner} label="Asking Ollama to analyze the work orders…" />`}

          ${editing
            ? (editorMode === "form"
              ? html`<div>
                  <p className="text-xs text-slate-400 mb-3">
                    Type one item per line in each box — each line becomes its own bullet. Use <b>+ Add row</b> for a new issue.
                  </p>
                  <${GuideFormEditor} blocks=${blocks} onChange=${setBlocks} />
                </div>`
              : html`<div>
                  <textarea value=${rawDraft} onInput=${(e) => setRawDraft(e.target.value)} spellcheck=${false}
                    className="w-full h-[60vh] font-mono text-sm leading-relaxed bg-white rounded-2xl p-4
                               border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-300"></textarea>
                  <p className="text-xs text-slate-400 mt-2">
                    Raw Markdown. Tables use the
                    <code className="mx-1">| col | col |</code> format with <code>&lt;br&gt;</code> for line breaks inside a cell.
                  </p>
                </div>`)
            : viewing
              ? html`<div>
                  <div className="flex items-center justify-between gap-3 flex-wrap bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-4 py-2.5 mb-3 text-sm">
                    <span>Viewing <b>version ${viewing.version_number}</b> · ${viewing.source_label} · ${fmtVersionStamp(viewing.created_at)}
                      <span className="opacity-70">(read-only)</span></span>
                    <span className="flex gap-2">
                      <button onClick=${() => setViewing(null)}
                        className="px-3 py-1 rounded-full bg-white border border-amber-300 text-amber-700 hover:bg-amber-100 text-xs font-semibold">
                        Back to current</button>
                      <button onClick=${() => requireAuth(() => restoreVersion(viewing.version_number))} disabled=${!!busy}
                        className="px-3 py-1 rounded-full bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold disabled:opacity-50">
                        ${busy === "restore" ? "Restoring…" : "Restore this version"}</button>
                    </span>
                  </div>
                  <div className="guide bg-white rounded-2xl p-6 shadow-sm border border-amber-200"
                       dangerouslySetInnerHTML=${{ __html: viewHtml }}></div>
                </div>`
              : state.exists
                ? html`<div ref=${ref} className="guide bg-white rounded-2xl p-6 shadow-sm border border-emerald-100"
                         dangerouslySetInnerHTML=${{ __html: renderedHtml }}></div>`
                : !busy && html`<div className="text-slate-400 bg-white rounded-2xl p-10 text-center border border-dashed border-emerald-200">
                     Click <b>Generate Checklist</b> to build an operator troubleshooting guide.</div>`}

          ${showHistory && html`
            <div className="fixed inset-0 z-40" onClick=${() => setShowHistory(false)}>
              <div className="absolute inset-0 bg-slate-900/20"></div>
              <aside onClick=${(e) => e.stopPropagation()}
                className="absolute top-0 right-0 h-full w-80 max-w-[85vw] bg-white shadow-2xl border-l border-emerald-100 flex flex-col fade-in">
                <div className="flex items-center justify-between px-4 py-3 border-b border-emerald-100">
                  <div>
                    <div className="font-extrabold text-slate-800">Version history</div>
                    <div className="text-[11px] text-slate-400">Every change is saved automatically</div>
                  </div>
                  <button onClick=${() => setShowHistory(false)}
                    className="w-8 h-8 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-lg leading-none">×</button>
                </div>
                <div className="flex-1 overflow-y-auto p-2">
                  ${histBusy && html`<${Spinner} label="Loading history…" />`}
                  ${versions && versions.length === 0 && !histBusy && html`
                    <div className="text-slate-400 text-sm p-4 text-center">No versions recorded yet.</div>`}
                  ${versions && versions.map((v, i) => {
                    const isCurrent = i === 0;
                    const active = viewing ? viewing.version_number === v.version_number : isCurrent;
                    return html`
                      <div key=${v.version_number}
                        onClick=${() => (isCurrent ? setViewing(null) : openVersion(v.version_number))}
                        className=${"rounded-xl border p-3 mb-2 cursor-pointer transition " +
                          (active ? "border-emerald-500 bg-emerald-50" : "border-slate-100 hover:bg-slate-50")}>
                        <div className="flex items-center justify-between gap-2">
                          <span className="font-bold text-slate-700 text-sm">Version ${v.version_number}
                            ${isCurrent && html`<span className="ml-1.5 text-[10px] uppercase tracking-wide font-semibold text-emerald-700">Current</span>`}
                          </span>
                          <span className=${"text-[10px] px-2 py-0.5 rounded-full font-semibold whitespace-nowrap " + sourceChip(v.source)}>${v.source_label}</span>
                        </div>
                        <div className="text-xs text-slate-500 mt-1">${fmtVersionStamp(v.created_at)}${v.author ? " · " + v.author : ""}</div>
                        ${!isCurrent && html`
                          <div className="mt-2 flex gap-3">
                            <button onClick=${(e) => { e.stopPropagation(); openVersion(v.version_number); }}
                              className="text-xs font-semibold text-emerald-700 hover:underline">View</button>
                            <button onClick=${(e) => { e.stopPropagation(); requireAuth(() => restoreVersion(v.version_number)); }}
                              disabled=${!!busy}
                              className="text-xs font-semibold text-emerald-700 hover:underline disabled:opacity-50">Restore</button>
                          </div>`}
                      </div>`;
                  })}
                </div>
              </aside>
            </div>`}
        </div>`;
    }

    // Format an ISO timestamp for the version list.
    function fmtVersionStamp(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return isNaN(d.getTime()) ? iso
        : d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    }

    // Colored chip class per version source.
    function sourceChip(source) {
      switch (source) {
        case "ai_generate": return "bg-emerald-100 text-emerald-800";
        case "ai_update":   return "bg-indigo-100 text-indigo-700";
        case "manual_edit": return "bg-amber-100 text-amber-700";
        case "restore":     return "bg-emerald-100 text-emerald-800";
        default:            return "bg-slate-100 text-slate-600";
      }
    }

    function linkifyGuide(htmlStr, woIds) {
      if (!woIds || woIds.size === 0) return htmlStr;
      return htmlStr.replace(/\b\d{2,7}\b/g, (m) =>
        woIds.has(m) ? `<span class="wo-link" data-wo="${m}">${m}</span>` : m);
    }

    // Improve readability of the generated tables: cells authored as
    // "- item<br>- item" render as one cramped run of text. Convert those into a
    // real bulleted list (<ul class="cell-list">) so each item is on its own,
    // clearly spaced line. Cells that aren't bulleted lists are left untouched.
    function beautifyGuideCells(htmlStr) {
      const stripEmphasis = (s) => String(s).replace(/<\/?(strong|b|em|i)>/gi, "");
      // Turn a "- a<br>- b" cell into a spaced bullet list; bold a leading
      // "Label:" prefix on each item. Returns null if the cell isn't a bullet list.
      const toBulletList = (inner, attrs) => {
        const parts = inner.split(/<br\s*\/?>/i).map((s) => s.trim()).filter((s) => s.length);
        if (!parts.length || !parts.every((p) => /^[-*]\s+/.test(p))) return null;
        const items = parts.map((p) => {
          let t = stripEmphasis(p.replace(/^[-*]\s+/, ""));
          t = t.replace(/^([^:<]{1,60}:)(\s+)/, "<strong>$1</strong>$2");
          return "<li>" + t + "</li>";
        }).join("");
        return "<td" + attrs + '><ul class="cell-list">' + items + "</ul></td>";
      };

      return String(htmlStr || "").replace(/<table[\s\S]*?<\/table>/gi, (table) => {
        // Map each column index to its header label so we know which cells are
        // the "Issue" / "Avg. Fix Time" columns (bolded whole).
        const headers = [];
        const thRe = /<th[^>]*>([\s\S]*?)<\/th>/gi;
        let hm;
        while ((hm = thRe.exec(table))) headers.push(hm[1].replace(/<[^>]+>/g, "").trim().toLowerCase());
        const boldWholeCol = (i) => headers[i] === "issue" || /^avg/.test(headers[i] || "");

        return table.replace(/(<tr[^>]*>)([\s\S]*?)(<\/tr>)/gi, (rowFull, open, rowInner, close) => {
          if (/<th[\s>]/i.test(rowFull)) return rowFull;  // leave the header row alone
          let col = -1;
          const newInner = rowInner.replace(/<td([^>]*)>([\s\S]*?)<\/td>/gi, (full, attrs, inner) => {
            col++;
            const list = toBulletList(inner, attrs);
            if (list) return list;
            if (boldWholeCol(col)) {
              const txt = stripEmphasis(inner).trim();
              return txt ? "<td" + attrs + "><strong>" + txt + "</strong></td>" : full;
            }
            return full;
          });
          return open + newInner + close;
        });
      });
    }

    // Multi-line SVG chart. Each selected metric is scaled to its OWN range
    // (0 -> that series' max) so lines with different units can be compared by
    // shape on one plot.
    function TrendChart({ months, selectedKeys, onPointClick }) {
      const W = 680, H = 260, padL = 12, padR = 12, padT = 16, padB = 26;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const x = (i) => padL + (plotW * i) / 11;
      const defs = TREND_METRICS.filter((m) => selectedKeys.includes(m.key));

      if (defs.length === 0)
        return html`<div className="h-64 flex items-center justify-center text-slate-400 text-sm text-center px-4">
          Select a metric below to plot it month&#8209;to&#8209;month.</div>`;

      const grid = [0, 0.25, 0.5, 0.75, 1].map((f, i) => {
        const gy = padT + plotH * f;
        return html`<line key=${"g" + i} x1=${padL} y1=${gy} x2=${W - padR} y2=${gy}
          stroke="#e2e8f0" strokeWidth="1" />`;
      });

      const series = defs.map((m) => {
        const vals = months.map((mo) => Number(mo[m.key]) || 0);
        const max = Math.max(...vals, 0);
        const y = (v) => (max <= 0 ? padT + plotH : padT + plotH * (1 - v / max));
        const pts = vals.map((v, i) => x(i) + "," + y(v)).join(" ");
        const dots = vals.map((v, i) => html`<circle key=${m.key + i} cx=${x(i)} cy=${y(v)} r="4"
          fill=${m.color} style=${{ cursor: "pointer" }}
          onClick=${(e) => { e.stopPropagation(); onPointClick && onPointClick(i + 1); }}>
          <title>${MONTHS[i]} · ${m.label}: ${m.fmt(v)} — click for synopsis</title></circle>`);
        return html`<g key=${m.key}>
          <polyline points=${pts} fill="none" stroke=${m.color} strokeWidth="2.5"
            strokeLinejoin="round" strokeLinecap="round" />
          ${dots}
        </g>`;
      });

      const xlabels = MONTHS.map((mo, i) => html`<text key=${"x" + i} x=${x(i)} y=${H - 8}
        textAnchor="middle" fill="#94a3b8" style=${{ fontSize: "10px" }}>${mo}</text>`);

      return html`
        <svg viewBox=${"0 0 " + W + " " + H} className="w-full" style=${{ height: "260px" }}>
          ${grid}${series}${xlabels}
        </svg>`;
    }

    function parseCommentSections(comment) {
      if (!comment) return null;
      const loginStart = comment.search(/\n\s*Operator Login\s*:/i);
      if (loginStart === -1) return null;
      const preLogin = comment.slice(0, loginStart).trim();
      const firstNewline = preLogin.indexOf("\n");
      let installation = "";
      let contacts = "";
      if (firstNewline === -1) {
        installation = preLogin;
      } else {
        installation = preLogin.slice(0, firstNewline).trim();
        contacts = preLogin.slice(firstNewline + 1).trim();
      }
      return { installation, contacts, logins: comment.slice(loginStart).trim() };
    }

      const SUMMARY_UTIL_KEYS = ["air", "water", "draine", "gas", "battery", "propane", "network"];
      const empty = {
        category: "", location_workcenter: "", type_capex: "", serial_no: "",
        asset_num: "", year_new: "", condition: "", service_status: "",
        as_of_year_month: "", replacement_cost: "", replacement_year: "",
        ery: "", comments: "",
      };
      SUMMARY_FIELDS.forEach((f) => (empty[f.key] = ""));
      empty.pm_comment = "";
      empty.pm_machine_settings = "";
      empty.pm_utilities = {};
      empty.pm_contacts = [];

      const [fields, setFields] = useState(empty);
      const [author, setAuthor] = useState(getUserName());
      const [busy, setBusy] = useState(false);
      const [ok, setOk] = useState(false);
      const [err, setErr] = useState(null);
      const [protectedEdit, setProtectedEdit] = useState(false);
      const [gateAction, setGateAction] = useState(null);

      const applySummary = (merged, summaryJson) => {
        try {
          const summary = JSON.parse(summaryJson || "{}");
          Object.keys(summary).forEach((k) => {
            if (k === "utilities") {
              merged.pm_utilities = summary[k] || {};
            } else if (k === "contacts") {
              merged.pm_contacts = Array.isArray(summary[k]) ? summary[k] : [];
            } else {
              merged["pm_" + k] = summary[k] || "";
            }
          });
        } catch (e) {}
        return merged;
      };

      const extractCostFromComment = (text) => {
        if (!text) return "";
        const m = text.match(/\$\s*[\d,]+(?:\.\d{2})?/);
        if (!m) return "";
        return m[0].replace(/\s+/g, "").replace(/\$/g, "").replace(/,/g, "");
      };

      const extractContactsFromComment = (text) => {
        if (!text) return [];
        const contacts = [];
        const seen = new Set();
        const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        // Bounded phone regex. The old pattern used nested optional groups that caused
        // catastrophic backtracking on some comments and hung the browser tab.
        const phoneRe = /(?:\+?1[-.\s/]*)?(?:\(\d{3}\)|\d{3})[-.\s/]{0,3}\d{3}[-.\s/]{0,3}\d{4}(?:\s*(?:ext|x|ext\.)\s*\d{1,5})?/gi;
        const phoneTestRe = /(?:\+?1[-.\s/]*)?(?:\(\d{3}\)|\d{3})[-.\s/]{0,3}\d{3}[-.\s/]{0,3}\d{4}(?:\s*(?:ext|x|ext\.)\s*\d{1,5})?/i;
        const emailRe = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
        const labelRe = /^\s*(p|c|f|cell|off|office|fax|phone|mobile)\s*[:\-]?\s*/i;

        const looksLikeName = (s) => {
          const clean = s.replace(/\b(Technical Support|Service Manager|Installation Tech|Installer|East coast tech|CA tech)\b/gi, "").trim();
          return /^[A-Z][a-zA-Z\.]+(?:\s+[A-Z][a-zA-Z\.]+){1,5}$/.test(clean) && clean.length < 60;
        };
        const stripTail = (s) => s.replace(labelRe, "").trim().replace(/[:\-|,|]+$/, "").replace(/\s*\([^)]*\)\s*$/, "").trim();

        lines.forEach((line, i) => {
          const matches = line.match(phoneRe) || [];
          matches.forEach((phone) => {
            const idx = line.indexOf(phone);
            let before = stripTail(line.slice(0, idx));
            let name = "";
            if (before && before.length > 1 && !phoneTestRe.test(before) && !emailRe.test(before) && before.split(/\s+/).length <= 8) {
              name = before;
            } else {
              for (let j = i - 1; j >= Math.max(0, i - 3); j--) {
                const prev = stripTail(lines[j]);
                if (phoneTestRe.test(prev) || emailRe.test(prev) || prev.length > 80) continue;
                if (looksLikeName(prev)) { name = prev; break; }
              }
            }
            const emailMatch = line.match(emailRe);
            const email = emailMatch ? emailMatch[0] : "";
            const key = (name + "|" + phone + "|" + email).toLowerCase();
            if (seen.has(key)) return;
            seen.add(key);
            contacts.push({ name: name || phone, phone, email });
          });
        });
        return contacts;
      };

      useEffect(() => {
        getJSON("/api/edit-auth").then((d) => setProtectedEdit(!!d.protected)).catch(() => {});
      }, []);

      useEffect(() => {
        const merged = applySummary(Object.assign({}, empty, info || {}), info && info.summary_json);
        const comment = merged.pm_comment || "";
        if (!merged.pm_contacts.length) {
          merged.pm_contacts = extractContactsFromComment(comment);
        }
        const costVal = String(merged.pm_original_cost || "").replace(/,/g, "");
        if ((!costVal || parseFloat(costVal) === 0) && comment) {
          const extracted = extractCostFromComment(comment);
          if (extracted) merged.pm_original_cost = extracted;
        }
        setFields(merged);
        setOk(false);
        setErr(null);
      }, [info]);

      const update = (key, value) => {
        setFields((f) => Object.assign({}, f, { [key]: value }));
        setOk(false);
      };
      const updateUtil = (key, checked) => {
        setFields((f) => Object.assign({}, f, {
          pm_utilities: Object.assign({}, f.pm_utilities, { [key]: !!checked }),
        }));
        setOk(false);
      };
      const updateContact = (idx, key, value) => {
        setFields((f) => {
          const arr = [...f.pm_contacts];
          arr[idx] = Object.assign({}, arr[idx] || {}, { [key]: value });
          return Object.assign({}, f, { pm_contacts: arr });
        });
        setOk(false);
      };
      const addContact = () => {
        setFields((f) => Object.assign({}, f, { pm_contacts: [...f.pm_contacts, { name: "", phone: "", email: "" }] }));
        setOk(false);
      };
      const removeContact = (idx) => {
        setFields((f) => Object.assign({}, f, { pm_contacts: f.pm_contacts.filter((_, i) => i !== idx) }));
        setOk(false);
      };

      const isAuthed = () => !protectedEdit || !!getEditPw();
      const locked = !isAuthed();
      const requireAuth = (action) => {
        if (isAuthed()) { action(); return; }
        setGateAction(() => action);
      };
      // Open the password gate purely to unlock the form (no follow-up action).
      const unlock = () => setGateAction(() => () => {});

      const doSave = async () => {
        if (!author.trim()) { setErr("Your name is required."); return; }
        setBusy(true); setErr(null); setOk(false);
        try {
          const summary = {};
          SUMMARY_FIELDS.forEach((f) => { summary[f.key.replace("pm_", "")] = fields[f.key] || ""; });
          summary.utilities = fields.pm_utilities || {};
          summary.comment = fields.pm_comment || "";
          summary.machine_settings = fields.pm_machine_settings || "";
          summary.contacts = fields.pm_contacts || [];
          const payload = Object.assign({}, fields, {
            summary_json: JSON.stringify(summary),
            author: author.trim(),
          });
          // do not send the flattened pm_* fields to the API
          SUMMARY_FIELDS.forEach((f) => delete payload[f.key]);
          delete payload.pm_comment;
          delete payload.pm_machine_settings;
          delete payload.pm_utilities;
          delete payload.pm_contacts;
          const saved = await sendJSON(
            `/api/departments/${deptKey}/machines/${eqId}/info`,
            "PATCH",
            payload,
            editHeaders()
          );
          setFields(applySummary(Object.assign({}, empty, saved), saved.summary_json));
          setUserName(author.trim());
          setOk(true);
        } catch (e) {
          if (e.message && e.message.includes("401")) {
            setEditPw("");
            setErr("Editing is locked. Enter the shared edit password.");
          } else {
            setErr(e.message);
          }
        } finally { setBusy(false); }
      };

      const save = () => requireAuth(doSave);

      return html`
        <div className="fade-in">
          <div className="mb-4">
            <h2 className="text-lg font-extrabold text-slate-800">Machine Information</h2>
            <p className="text-slate-500 text-sm">Equipment details and longevity tracking for ${machineName}.</p>
          </div>

          ${gateAction && html`<${PasswordGate}
            onCancel=${() => setGateAction(null)}
            onUnlock=${() => { const a = gateAction; setGateAction(null); if (a) a(); }} />`}

          <div className="bg-white rounded-2xl border border-emerald-100 shadow-sm p-5">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-sm uppercase tracking-wide text-emerald-600 font-bold">PM Equipment Summary</h3>
              <div className="flex items-center gap-2">
                ${protectedEdit && html`<span className="text-[11px] px-2 py-0.5 rounded-full border ${isAuthed() ? "bg-emerald-50 text-emerald-700 border-emerald-100" : "bg-slate-100 text-slate-500 border-slate-200"}">${isAuthed() ? "🔓 Editing unlocked" : "🔒 Editing locked"}</span>`}
                ${locked && html`<button onClick=${unlock}
                  className="text-[11px] px-3 py-1 rounded-full bg-emerald-700 text-white font-semibold hover:bg-emerald-800">
                  Unlock editing</button>`}
              </div>
            </div>

            <fieldset disabled=${locked} className="border-0 p-0 m-0 min-w-0 space-y-4">
              <!-- Identification -->
              <div className="bg-slate-50 rounded-xl border border-slate-200 p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs font-bold">ID</span>
                  <h4 className="text-sm font-bold text-slate-700">Identification</h4>
                </div>
                <div className="grid md:grid-cols-3 gap-3">
                  ${["pm_make", "pm_model", "pm_serial_no", "pm_asset_no", "pm_function", "pm_po_no"].map((k) => {
                    const f = SUMMARY_FIELDS.find((x) => x.key === k);
                    return html`<${TextInput} key=${k} label=${f.label} value=${fields[k]} placeholder="N/A"
                      onChange=${(v) => update(k, v)} />`;
                  })}
                </div>
              </div>

              <!-- Purchase & Warranty -->
              <div className="bg-slate-50 rounded-xl border border-slate-200 p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="w-6 h-6 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold">$</span>
                  <h4 className="text-sm font-bold text-slate-700">Purchase & Warranty</h4>
                </div>
                <div className="grid md:grid-cols-3 gap-3">
                  ${["pm_original_cost", "pm_purchase_date", "pm_warranty_end_date"].map((k) => {
                    const f = SUMMARY_FIELDS.find((x) => x.key === k);
                    return html`<${TextInput} key=${k} label=${f.label} value=${fields[k]} placeholder="N/A"
                      onChange=${(v) => update(k, v)} />`;
                  })}
                </div>
              </div>

              <!-- Electrical & Utilities -->
              <div className="bg-slate-50 rounded-xl border border-slate-200 p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="w-6 h-6 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center text-xs font-bold">⚡</span>
                  <h4 className="text-sm font-bold text-slate-700">Electrical & Utilities</h4>
                </div>
                <div className="grid md:grid-cols-4 gap-3 mb-3">
                  ${["pm_volts", "pm_amps", "pm_ph", "pm_branch_dust_collection"].map((k) => {
                    const f = SUMMARY_FIELDS.find((x) => x.key === k);
                    return html`<${TextInput} key=${k} label=${f.label} value=${fields[k]} placeholder="N/A"
                      onChange=${(v) => update(k, v)} />`;
                  })}
                </div>
                <div className="text-xs font-bold text-slate-500 uppercase mb-2">utilities used</div>
                <div className="flex flex-wrap gap-3">
                  ${SUMMARY_UTIL_KEYS.map((k) => html`
                    <label key=${k} className="inline-flex items-center gap-1.5 text-sm text-slate-700 cursor-pointer">
                      <input type="checkbox" checked=${!!(fields.pm_utilities || {})[k]}
                        onChange=${(e) => updateUtil(k, e.target.checked)}
                        className="accent-emerald-600 w-4 h-4" />
                      ${k}
                    </label>`)}
                </div>
              </div>

              <!-- Supplier & Service -->
              <div className="bg-slate-50 rounded-xl border border-slate-200 p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="w-6 h-6 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold">SP</span>
                  <h4 className="text-sm font-bold text-slate-700">Supplier & Service</h4>
                </div>
                <div className="grid md:grid-cols-3 gap-3">
                  ${["pm_manufacturer", "pm_distributor_a", "pm_distributor_b", "pm_distributor_c", "pm_service_a", "pm_service_b", "pm_service_c"].map((k) => {
                    const f = SUMMARY_FIELDS.find((x) => x.key === k);
                    return html`<${TextInput} key=${k} label=${f.label} value=${fields[k]} placeholder="N/A"
                      onChange=${(v) => update(k, v)} />`;
                  })}
                </div>
              </div>

              <!-- Replacement Planning -->
              <div className="bg-slate-50 rounded-xl border border-slate-200 p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="w-6 h-6 rounded-lg bg-rose-100 text-rose-700 flex items-center justify-center text-xs font-bold">RP</span>
                  <h4 className="text-sm font-bold text-slate-700">Replacement Planning</h4>
                </div>
                <div className="grid md:grid-cols-3 gap-3">
                  ${["pm_replacement_name", "pm_replacement_year", "pm_replacement_cost"].map((k) => {
                    const f = SUMMARY_FIELDS.find((x) => x.key === k);
                    return html`<${TextInput} key=${k} label=${f.label} value=${fields[k]} placeholder="N/A"
                      onChange=${(v) => update(k, v)} />`;
                  })}
                </div>
              </div>

              <!-- Machine Longevity -->
              <div className="bg-slate-50 rounded-xl border border-slate-200 p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="w-6 h-6 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-bold">⏱</span>
                  <h4 className="text-sm font-bold text-slate-700">Machine Longevity</h4>
                </div>
                <div className="grid md:grid-cols-3 gap-3">
                  <${TextInput} label="Category" value=${fields.category} placeholder="N/A"
                    onChange=${(v) => update("category", v)} />
                  <${TextInput} label="Location / Workcenter" value=${fields.location_workcenter} placeholder="N/A"
                    onChange=${(v) => update("location_workcenter", v)} />
                  <${TextInput} label="Type (capex/small tool)" value=${fields.type_capex} placeholder="N/A"
                    onChange=${(v) => update("type_capex", v)} />
                  <${TextInput} label="Serial No." value=${fields.serial_no} placeholder="N/A"
                    onChange=${(v) => update("serial_no", v)} />
                  <${TextInput} label="Asset #" value=${fields.asset_num} placeholder="N/A"
                    onChange=${(v) => update("asset_num", v)} />
                  <${TextInput} label="Year New" value=${fields.year_new} placeholder="N/A"
                    onChange=${(v) => update("year_new", v)} />
                  <${TextInput} label="Condition" value=${fields.condition} placeholder="N/A"
                    onChange=${(v) => update("condition", v)} />
                  <${TextInput} label="Service Status (in/out)" value=${fields.service_status} placeholder="N/A"
                    onChange=${(v) => update("service_status", v)} />
                  <${TextInput} label="As of (Year-Month)" value=${fields.as_of_year_month} placeholder="N/A"
                    onChange=${(v) => update("as_of_year_month", v)} />
                  <${TextInput} label="Est. Replacement Cost" value=${fields.replacement_cost} placeholder="N/A"
                    onChange=${(v) => update("replacement_cost", v)} />
                  <${TextInput} label="Est. Replacement Year" value=${fields.replacement_year} placeholder="N/A"
                    onChange=${(v) => update("replacement_year", v)} />
                  <${SelectInput} label="ERY" value=${fields.ery} options=${ERY_OPTIONS}
                    placeholder="N/A"
                    onChange=${(v) => update("ery", v)} />
                </div>
                <${TextArea} label="Comments" value=${fields.comments} placeholder="N/A" rows=${4}
                  onChange=${(v) => update("comments", v)} />
              </div>

              <!-- Notes -->
              <div className="bg-slate-50 rounded-xl border border-slate-200 p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="w-6 h-6 rounded-lg bg-purple-100 text-purple-700 flex items-center justify-center text-xs font-bold">N</span>
                  <h4 className="text-sm font-bold text-slate-700">Notes</h4>
                </div>
                <div className="grid md:grid-cols-2 gap-4">
                  <${TextArea} label="Comment" value=${fields.pm_comment} placeholder="N/A" rows=${4}
                    onChange=${(v) => update("pm_comment", v)} />
                  <${TextArea} label="Machine Settings" value=${fields.pm_machine_settings} placeholder="N/A" rows=${4}
                    onChange=${(v) => update("pm_machine_settings", v)} />
                </div>
              </div>

              <!-- Contacts -->
              <div className="bg-slate-50 rounded-xl border border-slate-200 p-4">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-teal-100 text-teal-700 flex items-center justify-center text-xs font-bold">C</span>
                    <h4 className="text-sm font-bold text-slate-700">Contacts</h4>
                  </div>
                  <button type="button" onClick=${addContact}
                    className="text-[11px] px-2 py-1 rounded-full bg-emerald-700 text-white font-semibold hover:bg-emerald-800">
                    + Add contact
                  </button>
                </div>
                <div className="space-y-3">
                  ${(fields.pm_contacts || []).map((c, i) => html`
                    <div key=${i} className="grid md:grid-cols-3 gap-3 items-start p-3 rounded-xl bg-white border border-slate-200">
                      <${TextInput} label="Name" value=${c.name || ""} placeholder="N/A"
                        onChange=${(v) => updateContact(i, "name", v)} />
                      <${TextInput} label="Phone" value=${c.phone || ""} placeholder="N/A"
                        onChange=${(v) => updateContact(i, "phone", v)} />
                      <div className="flex items-end gap-2">
                        <div className="flex-1">
                          <${TextInput} label="Email" value=${c.email || ""} placeholder="N/A"
                            onChange=${(v) => updateContact(i, "email", v)} />
                        </div>
                        <button type="button" onClick=${() => removeContact(i)}
                          className="mb-0.5 px-2 py-2 rounded-lg text-rose-600 hover:bg-rose-50 text-sm font-semibold"
                          title="Remove contact">
                          ✕
                        </button>
                      </div>
                    </div>`)}
                  ${!(fields.pm_contacts || []).length && html`<p className="text-sm text-slate-500">No contacts found. Names and phone numbers are auto-detected from the Comment field when available.</p>`}
                </div>
              </div>

              <div className="mt-2 border-t border-slate-100 pt-5">
                <${NameInput} value=${author} onChange=${setAuthor} />
                ${err && html`<div className="text-rose-600 text-sm mt-2">${err}</div>`}
                ${ok && html`<div className="text-emerald-600 text-sm mt-2">Saved.</div>`}
                <div className="flex justify-end mt-3">
                  <button onClick=${save} disabled=${busy}
                    className="px-5 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60 shadow-sm">
                    ${busy ? "Saving…" : "Save Machine Info"}${protectedEdit && !getEditPw() ? " 🔒" : ""}
                  </button>
                </div>
              </div>
            </fieldset>
          </div>
        </div>`;
    }

    function MachineView({ deptKey, eqId, deptLabel, divisionLabel, onHome, onCompany, onOpenDept, onOpenWo }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [tab, setTab] = useState("Dashboard");
      const tabRef = useRef(null);

      useEffect(() => {
        setData(null); setTab("Dashboard");
        getJSON("/api/departments/" + deptKey + "/machines/" + eqId)
          .then(setData).catch((e) => setErr(e.message));
      }, [deptKey, eqId]);

      // Fallback native click listener for the tab bar in case React event
      // delegation is interfered with (e.g. by a script rewriting the DOM).
      useEffect(() => {
        const el = tabRef.current;
        if (!el) return;
        const onClick = (e) => {
          const btn = e.target.closest("[data-tab]");
          if (!btn) return;
          const t = btn.getAttribute("data-tab");
          if (t) setTab(t);
        };
        el.addEventListener("click", onClick);
        return () => el.removeEventListener("click", onClick);
      }, []);

      if (err) return html`<div className="text-rose-600">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading machine…" />`;

      const m = data.machine;
      const woIds = new Set(
        [...(data.unscheduled || []), ...(data.scheduled || [])].map((r) => String(r.wo_id))
      );

      // Only expose the Trends tab for the enabled machines. Beyond the
      // explicitly-tracked eq IDs, enable it for every machine in the
      // "Machines" group of Toilet Partitions.
      const trendsEnabled = TRENDS_EQ_IDS.has(String(eqId)) ||
        (m.department_key === "toilet" && m.group === "Machines");
      const tabs = TABS.filter((t) => t !== "Trends" || trendsEnabled);

      return html`
        <div className="fade-in">
          <${Breadcrumb} items=${[
            { label: "Bobrick", onClick: onCompany },
            { label: (divisionLabel || "BLA") + " Division", onClick: onHome },
            { label: deptLabel || m.department, onClick: () => onOpenDept(deptKey) },
            { label: m.name },
          ]} />
          <div className="flex items-end justify-between flex-wrap gap-2 mb-5">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-800">${m.name}</h1>
              <div className="text-emerald-600 font-mono text-sm">${m.eq_label} · ${m.department}</div>
            </div>
          </div>

          <div ref=${tabRef} className="flex gap-2 mb-6 bg-white p-1.5 rounded-full shadow-sm border border-emerald-100 w-fit flex-wrap">
            ${tabs.map((t) => html`
              <button key=${t} data-tab=${t} onClick=${() => setTab(t)}
                className=${"px-4 py-2 rounded-full text-sm font-semibold transition " +
                  (tab === t ? "bg-emerald-700 text-white shadow" : "text-slate-500 hover:bg-emerald-50")}>
                ${t}
                ${t === "Unscheduled" && html`<span className="ml-1 opacity-70">(${data.stats.unscheduled_count})</span>`}
                ${t === "Scheduled" && html`<span className="ml-1 opacity-70">(${data.stats.scheduled_count})</span>`}
              </button>`)}
          </div>

          ${tab === "Dashboard" && html`
            <div className="fade-in">
              <${KpiRow} stats=${data.stats} />
              <p className="text-slate-400 text-sm mt-4">
                Quick view for ${m.name}. Use the tabs above for the troubleshooting checklist and full work-order details.
              </p>
            </div>`}

          ${tab === "Machine Info" && html`
            <div className="fade-in">
              <${MachineInfoTab} info=${data.info} deptKey=${deptKey} eqId=${eqId} machineName=${m.name} />
            </div>`}

          ${tab === "Trends" && html`
            <div className="fade-in">
              <${TrendsTab} deptKey=${deptKey} eqId=${eqId} machineName=${m.name} onOpenWo=${onOpenWo} />
            </div>`}

          ${tab === "Weekly" && html`
            <div className="fade-in">
              <${EmbeddedWeekly}
                predicate=${(r) => String(r.equipment_id) === String(eqId)}
                showDept=${false}
                onOpenWo=${onOpenWo}
                subtitle=${m.name + " · scheduled & unscheduled work orders by week (Sunday → Sunday)."} />
            </div>`}


          ${tab === "Monthly Calendar" && html`
            <div className="fade-in">
              <${EmbeddedMonthly}
                predicate=${(r) => String(r.equipment_id) === String(eqId)}
                showDept=${false}
                onOpenWo=${onOpenWo}
                title="Monthly Calendar"
                subtitle=${m.name + " · scheduled & unscheduled work orders for the month."}
                deptKey=${deptKey}
                eqId=${eqId} />
            </div>`}

          ${tab === "Checklist" && html`
            <div className="fade-in">
              <${ChecklistTab} deptKey=${deptKey} eqId=${eqId} woIds=${woIds} onOpenWo=${onOpenWo} />
            </div>`}

          ${tab === "Unscheduled" && html`
            <div className="fade-in">
              <${WorkOrderList} records=${data.unscheduled} kind="unscheduled" onOpen=${onOpenWo}
                filters=${["urgency", "status"]} />
            </div>`}

          ${tab === "Scheduled" && html`
            <div className="fade-in">
              <${WorkOrderList} records=${data.scheduled} kind="scheduled" onOpen=${onOpenWo}
                filters=${["status"]} />
            </div>`}
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Weekly schedule dashboard (Sunday -> Sunday)                        */
    /* ------------------------------------------------------------------ */
    const WEEK_DEFS = [
      { key: "last", label: "Last Week", accent: "border-slate-300", head: "bg-slate-100 text-slate-600" },
      { key: "this", label: "This Week", accent: "border-emerald-300", head: "bg-emerald-700 text-white" },
      { key: "next", label: "Next Week", accent: "border-emerald-200", head: "bg-emerald-400 text-white" },
    ];

    // Parse "MM/DD/YYYY" or "MM/DD/YYYY HH:MM" into a sortable timestamp.
    // Missing/unparseable dates sort last.
    function parseWODate(s) {
      if (!s) return Infinity;
      const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})(?:\s+(\d{1,2}):(\d{2}))?/);
      if (!m) return Infinity;
      let year = +m[3];
      if (m[3].length === 2) year += year <= 68 ? 2000 : 1900; // 2-digit year
      return new Date(year, +m[1] - 1, +m[2], +(m[4] || 0), +(m[5] || 0)).getTime();
    }

    // Collect work orders into the three week buckets for the records that
    // match `predicate`, then order each list by date: scheduled soonest-due
    // first, unscheduled oldest-notified first (oldest to complete first).
    function buildBuckets(data, predicate) {
      const b = {
        last: { scheduled: [], unscheduled: [] },
        this: { scheduled: [], unscheduled: [] },
        next: { scheduled: [], unscheduled: [] },
      };
      data.departments.forEach((d) => {
        WEEK_DEFS.forEach(({ key }) => {
          (d.weeks[key]?.scheduled || []).forEach((r) => { if (predicate(r)) b[key].scheduled.push(r); });
          (d.weeks[key]?.unscheduled || []).forEach((r) => { if (predicate(r)) b[key].unscheduled.push(r); });
        });
      });
      Object.values(b).forEach((w) => {
        w.scheduled.sort((a, c) => parseWODate(a.due_date) - parseWODate(c.due_date));
        w.unscheduled.sort((a, c) => parseWODate(a.date_notified) - parseWODate(c.date_notified));
      });
      return b;
    }

    function WeekWORow({ r, showDept, deptLabels, onOpenWo }) {
      const when = r.wo_type === "scheduled" ? r.due_date : r.date_notified;
      return html`
        <button onClick=${() => onOpenWo(r.wo_id)}
          className="w-full text-left bg-white rounded-xl px-3 py-2 border border-emerald-100
                     hover:border-emerald-300 hover:shadow-sm transition">
          <div className="flex items-center justify-between gap-2">
            <span className="font-bold text-emerald-800 text-sm">WO #${r.wo_id}</span>
            <span className="text-[11px] text-slate-400 whitespace-nowrap">${when || ""}</span>
          </div>
          <div className="text-xs text-slate-600 mt-0.5 line-clamp-2">${r.problem || r.audit_item || r.equipment_name || "—"}</div>
          <div className="flex items-center gap-2 mt-1 flex-wrap">
            <span className="text-[11px] text-slate-500 truncate max-w-[11rem]">${r.equipment_name || ""}</span>
            ${r.status && html`<span className=${"text-[10px] px-1.5 py-0.5 rounded-full border " + statusColor(r.status)}>${r.status}</span>`}
            ${showDept && deptLabels[r.department_key] && html`<span className="text-[10px] px-1.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">${deptLabels[r.department_key]}</span>`}
          </div>
        </button>`;
    }

    function WeekColumn({ def, week, bucket, showDept, deptLabels, onOpenWo, typeFilter = "all" }) {
      const sch = bucket.scheduled || [];
      const uns = bucket.unscheduled || [];
      const showSch = typeFilter !== "unscheduled";
      const showUns = typeFilter !== "scheduled";
      return html`
        <section className=${"bg-slate-50 rounded-2xl border " + def.accent + " overflow-hidden flex flex-col"}>
          <div className=${"px-4 py-3 " + def.head}>
            <div className="font-extrabold">${def.label}</div>
            <div className="text-xs opacity-80">${week ? (week.start + " → " + week.end) : ""}</div>
            <div className="flex gap-2 mt-2 text-xs">
              <span className="bg-white/80 text-sky-700 rounded-full px-2 py-0.5 font-semibold">${sch.length} scheduled</span>
              <span className="bg-white/80 text-rose-700 rounded-full px-2 py-0.5 font-semibold">${uns.length} unscheduled</span>
            </div>
          </div>
          <div className="p-3 space-y-4 overflow-y-auto" style=${{ maxHeight: "62vh" }}>
            ${showSch && html`<div>
              <div className="text-xs font-bold uppercase tracking-wide text-sky-600 mb-2">Scheduled (${sch.length})</div>
              <div className="space-y-2">
                ${sch.length === 0
                  ? html`<div className="text-slate-400 text-xs italic">None</div>`
                  : sch.map((r) => html`<${WeekWORow} key=${"s" + r.wo_id} r=${r} showDept=${showDept} deptLabels=${deptLabels} onOpenWo=${onOpenWo} />`)}
              </div>
            </div>`}
            ${showUns && html`<div>
              <div className="text-xs font-bold uppercase tracking-wide text-rose-600 mb-2">Unscheduled (${uns.length})</div>
              <div className="space-y-2">
                ${uns.length === 0
                  ? html`<div className="text-slate-400 text-xs italic">None</div>`
                  : uns.map((r) => html`<${WeekWORow} key=${"u" + r.wo_id} r=${r} showDept=${showDept} deptLabels=${deptLabels} onOpenWo=${onOpenWo} />`)}
              </div>
            </div>`}
          </div>
        </section>`;
    }

    // Pure presentational: renders the three week columns for whatever records
    // match `predicate`. Reused by the top-level tab, the department view and
    // the machine view.
    function WeeklyPanels({ data, predicate, showDept, onOpenWo, typeFilter = "all" }) {
      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const buckets = buildBuckets(data, predicate);
      return html`
        <div className="grid md:grid-cols-3 gap-4">
          ${WEEK_DEFS.map((def) => html`
            <${WeekColumn} key=${def.key} def=${def} week=${data.weeks[def.key]}
              bucket=${buckets[def.key]} showDept=${showDept}
              deptLabels=${deptLabels} onOpenWo=${onOpenWo} typeFilter=${typeFilter} />`)}
        </div>`;
    }

    // Escape a value for CSV output. Wraps in quotes and doubles embedded quotes.
    function csvCell(v) {
      const s = String(v ?? "").replace(/"/g, '""');
      return '"' + s + '"';
    }

    // Build a CSV of the weekly schedule for whatever records match `predicate`,
    // honoring the current type filter. Downloads directly.
    function exportWeeklyCsv({ data, predicate, showDept, typeFilter, scopeLabel }) {
      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const buckets = buildBuckets(data, predicate);
      const rows = [];
      rows.push(["Week", "Type", "WO ID", "Date", "Department", "Equipment", "EQ ID", "Status", "Urgency", "Description"]);
      const showSch = typeFilter !== "unscheduled";
      const showUns = typeFilter !== "scheduled";
      WEEK_DEFS.forEach((def) => {
        const bucket = buckets[def.key] || { scheduled: [], unscheduled: [] };
        if (showSch) {
          bucket.scheduled.forEach((r) => {
            rows.push([
              def.label,
              "Scheduled",
              r.wo_id || "",
              r.due_date || "",
              deptLabels[r.department_key] || r.department_key || "",
              r.equipment_name || "",
              r.equipment_eq_id || "",
              r.status || "",
              r.urgency || "",
              r.audit_item || "",
            ]);
          });
        }
        if (showUns) {
          bucket.unscheduled.forEach((r) => {
            rows.push([
              def.label,
              "Unscheduled",
              r.wo_id || "",
              r.date_notified || "",
              deptLabels[r.department_key] || r.department_key || "",
              r.equipment_name || "",
              r.equipment_eq_id || "",
              r.status || "",
              r.urgency || "",
              r.problem || "",
            ]);
          });
        }
      });
      const csv = rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const safe = (scopeLabel || "All").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "");
      a.download = "Weekly-Schedule-" + safe + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Build a PDF of the weekly schedule (via jsPDF) for whatever records match
    // `predicate`, honoring the current type filter (all / scheduled /
    // unscheduled). Downloads directly - no print dialog.
    function exportWeeklyPdf({ data, predicate, showDept, typeFilter, scopeLabel }) {
      const JsPDF = window.jspdf && window.jspdf.jsPDF;
      if (!JsPDF) { alert("PDF library failed to load. Refresh the page and try again."); return; }
      const doc = new JsPDF({ unit: "pt", format: "letter" });
      const MARGIN = 40;
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const contentW = pageW - MARGIN * 2;
      let y = MARGIN;
      const ensure = (n) => { if (y + n > pageH - MARGIN) { doc.addPage(); y = MARGIN; } };

      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const buckets = buildBuckets(data, predicate);

      // Header band
      doc.setFillColor(4, 120, 87); doc.rect(0, 0, pageW, 6, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(4, 120, 87);
      doc.text("Bobrick", MARGIN, y + 10);
      doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(100, 116, 139);
      doc.text("Weekly Work Order Schedule", MARGIN, y + 26);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(30, 41, 59);
      doc.text(scopeLabel || "All Departments", pageW - MARGIN, y + 12, { align: "right" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(148, 163, 184);
      doc.text("Exported " + new Date().toLocaleString(), pageW - MARGIN, y + 26, { align: "right" });
      y += 42;
      doc.setDrawColor(4, 120, 87); doc.setLineWidth(1.5);
      doc.line(MARGIN, y, pageW - MARGIN, y); y += 18;

      const showSch = typeFilter !== "unscheduled";
      const showUns = typeFilter !== "scheduled";

      const woLine = (r) => {
        const when = r.wo_type === "scheduled" ? r.due_date : r.date_notified;
        let s = "WO #" + (r.wo_id || "") + "   \u00b7   " + (when || "no date");
        if (r.equipment_name) s += "   \u00b7   " + r.equipment_name;
        return s;
      };
      const woDetail = (r) => {
        let d = r.problem || r.audit_item || "";
        const bits = [];
        if (r.status) bits.push(r.status);
        if (showDept && deptLabels[r.department_key]) bits.push(deptLabels[r.department_key]);
        if (bits.length) d = (d ? d + "   " : "") + "[" + bits.join(" \u00b7 ") + "]";
        return d;
      };

      const listSection = (heading, rows, color) => {
        ensure(20);
        doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor.apply(doc, color);
        doc.text(heading + " (" + rows.length + ")", MARGIN, y); y += 14;
        if (rows.length === 0) {
          doc.setFont("helvetica", "italic"); doc.setFontSize(9); doc.setTextColor(148, 163, 184);
          ensure(12); doc.text("None", MARGIN + 10, y); y += 14; return;
        }
        rows.forEach((r) => {
          const detail = woDetail(r);
          const detailLines = detail ? doc.splitTextToSize(detail, contentW - 20) : [];
          ensure(14 + detailLines.length * 11 + 4);
          doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(30, 41, 59);
          doc.text(woLine(r), MARGIN + 10, y); y += 12;
          if (detailLines.length) {
            doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(71, 85, 105);
            detailLines.forEach((ln) => { ensure(11); doc.text(ln, MARGIN + 18, y); y += 11; });
          }
          y += 3;
        });
      };

      WEEK_DEFS.forEach((def) => {
        const wk = data.weeks[def.key];
        const bucket = buckets[def.key];
        ensure(40);
        doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(30, 41, 59);
        doc.text(def.label, MARGIN, y);
        doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(100, 116, 139);
        doc.text(wk ? (wk.start + " to " + wk.end) : "", MARGIN + 120, y);
        y += 16;
        if (showSch) listSection("Scheduled", bucket.scheduled || [], [2, 132, 199]);
        if (showUns) listSection("Unscheduled", bucket.unscheduled || [], [225, 29, 72]);
        y += 8; ensure(6);
        doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.5);
        doc.line(MARGIN, y, pageW - MARGIN, y); y += 14;
      });

      const safe = (scopeLabel || "All").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "");
      doc.save("Weekly-Schedule-" + safe + ".pdf");
    }

    // ------------------------------------------------------------------ //
    // Monthly calendar exports (CSV + PDF)
    // ------------------------------------------------------------------ //
    function _monthlyItems({ data, predicate, typeFilter }) {
      const items = [];
      if (data && data.work_orders) {
        data.work_orders.forEach((r) => {
          if (!predicate(r)) return;
          if (typeFilter !== "all" && r.wo_type !== typeFilter) return;
          items.push(r);
        });
      }
      if (data && data.events) {
        data.events.forEach((e) => {
          if (!predicate(e)) return;
          items.push(e);
        });
      }
      items.sort((a, b) => a.date.localeCompare(b.date));
      return items;
    }

    function exportMonthlyCsv({ data, predicate, showDept, typeFilter, scopeLabel }) {
      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const rows = [];
      rows.push(["Date", "Type", "WO ID", "Department", "Equipment", "EQ ID", "Status", "Urgency", "Details"]);
      const items = _monthlyItems({ data, predicate, typeFilter });
      items.forEach((r) => {
        const isEvent = r.is_event;
        const type = isEvent
          ? "Event"
          : r.is_projected
            ? "Scheduled (projected)"
            : r.wo_type === "scheduled"
              ? "Scheduled"
              : "Unscheduled";
        const details = isEvent
          ? (r.title || "") + (r.description ? " - " + r.description : "")
          : r.wo_type === "scheduled"
            ? (r.audit_item || "PM")
            : (r.problem || "");
        rows.push([
          r.date,
          type,
          r.wo_id || "",
          showDept ? (deptLabels[r.department_key] || r.department_key || "") : "",
          r.equipment_name || (r.equipment_id ? "Machine " + r.equipment_id : ""),
          r.equipment_eq_id || r.equipment_id || "",
          r.status || "",
          r.urgency || "",
          details,
        ]);
      });
      const csv = rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const safe = (scopeLabel || "All").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "");
      a.download = "Monthly-Calendar-" + safe + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportMonthlyPdf({ data, predicate, showDept, typeFilter, scopeLabel }) {
      const JsPDF = window.jspdf && window.jspdf.jsPDF;
      if (!JsPDF) { alert("PDF library failed to load. Refresh the page and try again."); return; }
      const doc = new JsPDF({ unit: "pt", format: "letter" });
      const MARGIN = 40;
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const contentW = pageW - MARGIN * 2;
      let y = MARGIN;
      const ensure = (n) => { if (y + n > pageH - MARGIN) { doc.addPage(); y = MARGIN; } };

      const deptLabels = {};
      data.departments.forEach((d) => { deptLabels[d.key] = d.label; });
      const items = _monthlyItems({ data, predicate, typeFilter });

      // Header
