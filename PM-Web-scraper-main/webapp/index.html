<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINT - Maintenance Intelligence & Troubleshooting</title>
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script src="/vendor/htm.js"></script>
  <script src="/vendor/tailwind.js"></script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/jspdf.js"></script>
  <style>
    :root { color-scheme: light; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f1f5f9; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Rendered markdown / checklist styling */
    .guide h1 { font-size: 1.5rem; font-weight: 800; color: #047857; margin: .25rem 0 .75rem; }
    .guide h2 { font-size: 1.15rem; font-weight: 700; color: #065f46; margin: 1.5rem 0 .5rem; }
    .guide h3 { font-size: 1rem; font-weight: 700; color: #065f46; margin: 1rem 0 .4rem; }
    .guide p { margin: .5rem 0; line-height: 1.6; color: #334155; }
    .guide ul, .guide ol { margin: .5rem 0 .5rem 1.3rem; line-height: 1.7; color: #334155; }
    .guide ul { list-style: disc; }
    .guide ol { list-style: decimal; }
    .guide li { margin: .15rem 0; }
    .guide strong { color: #1e293b; }
    .guide table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 1rem 0 1.75rem;
                   font-size: .9rem; border: 1px solid #cbd5e1; border-radius: .5rem; overflow: hidden; }
    .guide th { background: #047857; color: #fff; text-align: left; padding: .7rem .9rem;
                font-weight: 600; border-bottom: 2px solid #065f46; vertical-align: top;
                letter-spacing: .01em; }
    .guide td { border-top: 1px solid #e2e8f0; padding: .85rem .9rem; vertical-align: top;
                color: #334155; line-height: 1.65; }
    .guide td + td, .guide th + th { border-left: 1px solid #e2e8f0; }
    .guide tbody tr:nth-child(even) { background: #f8fafc; }
    .guide tbody tr:hover { background: #ecfdf5; }
    /* Bullet lists inside table cells (converted from "- item<br>- item") */
    .guide td ul.cell-list { margin: 0; padding-left: 1.1rem; list-style: disc; }
    .guide td ul.cell-list > li { margin: .3rem 0; line-height: 1.55; padding-left: .15rem; }
    .guide td ul.cell-list > li:first-child { margin-top: 0; }
    .guide td ul.cell-list > li:last-child { margin-bottom: 0; }
    .guide code { background: #ecfdf5; padding: .1rem .35rem; border-radius: .35rem; font-size: .85em; }
    .guide hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.2rem 0; }
    .guide input[type=checkbox] { margin-right: .4rem; accent-color: #059669; }

    .wo-link { color: #047857; font-weight: 600; cursor: pointer; text-decoration: underline;
               text-decoration-style: dotted; }
    .wo-link:hover { color: #065f46; background: #d1fae5; border-radius: .25rem; }

    .fade-in { animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useCallback, useRef } = React;
    const html = htm.bind(React.createElement);
    const API = "";

    window.onerror = function (msg, url, line, col) {
      const b = document.body || document.documentElement;
      let el = document.getElementById("__js-error-banner");
      if (!el) {
        el = document.createElement("div");
        el.id = "__js-error-banner";
        el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#fee2e2;color:#991b1b;padding:10px 14px;font-family:monospace;font-size:13px;white-space:pre-wrap;border-bottom:2px solid #f87171;";
        b.appendChild(el);
      }
      el.textContent += "JS ERROR: " + msg + " at " + url + ":" + line + (col ? ":" + col : "") + "\n";
    };

    const CALENDAR_EVENT_TITLES = ["Technician visit", "Safety event", "Vendor visit"];

    /* ------------------------------------------------------------------ */
    /* Formatting helpers                                                  */
    /* ------------------------------------------------------------------ */
    const money = (n) =>
      "$" + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const hours = (n) => (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 1 }) + " h";
    const num = (n) => (Number(n) || 0).toLocaleString();
    const todayMDY = () => { const d = new Date(); return (d.getMonth() + 1) + "/" + d.getDate() + "/" + d.getFullYear(); };

    function urgencyColor(u) {
      const s = (u || "").toLowerCase();
      if (s.startsWith("1.")) return "bg-rose-100 text-rose-700 border-rose-200";
      if (s.startsWith("2.")) return "bg-orange-100 text-orange-700 border-orange-200";
      if (s.startsWith("3.")) return "bg-amber-100 text-amber-700 border-amber-200";
      if (s.startsWith("4.")) return "bg-yellow-100 text-yellow-700 border-yellow-200";
      if (s.startsWith("5.")) return "bg-sky-100 text-sky-700 border-sky-200";
      return "bg-slate-100 text-slate-600 border-slate-200";
    }

    function statusColor(st) {
      const s = (st || "").toLowerCase();
      if (s.includes("pending")) return "bg-amber-100 text-amber-700 border-amber-200";
      if (s.includes("progress") || s.includes("open") || s.includes("assigned"))
        return "bg-sky-100 text-sky-700 border-sky-200";
      if (s.includes("complete") || s.includes("closed") || s.includes("done"))
        return "bg-emerald-100 text-emerald-800 border-emerald-200";
      if (s.includes("cancel") || s.includes("void"))
        return "bg-rose-100 text-rose-700 border-rose-200";
      return "bg-slate-100 text-slate-600 border-slate-200";
    }

    async function getJSON(url) {
      const r = await fetch(API + url);
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ("HTTP " + r.status));
      return r.json();
    }

    // Send JSON to the API (POST/PATCH/PUT/DELETE) and return the parsed body.
    async function sendJSON(url, method, body, extraHeaders) {
      const r = await fetch(API + url, {
        method,
        headers: Object.assign({ "Content-Type": "application/json" }, extraHeaders || {}),
        body: JSON.stringify(body || {}),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
      return d;
    }

    // Upload one or more files to a work order (multipart).
    async function uploadAttachments(woId, files, author) {
      if (!files || !files.length) return null;
      const fd = new FormData();
      fd.append("author", author || "");
      for (const f of files) fd.append("file", f);
      const r = await fetch(API + "/api/workorder/" + encodeURIComponent(woId) + "/attachments",
        { method: "POST", body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "attachment upload failed");
      return d;
    }

    // The "your name" value is remembered across actions (localStorage) so
    // people don't have to retype it every time - but it is always required.
    function getUserName() { try { return localStorage.getItem("mintUser") || ""; } catch (e) { return ""; } }
    function setUserName(v) { try { localStorage.setItem("mintUser", v || ""); } catch (e) {} }

    // The admin password (gates deleting work orders + viewing version history)
    // is kept only in sessionStorage - cleared when the browser tab closes -
    // and sent as a header on the protected requests.
    function getAdminPw() { try { return sessionStorage.getItem("mintAdminPw") || ""; } catch (e) { return ""; } }
    function setAdminPw(v) { try { v ? sessionStorage.setItem("mintAdminPw", v) : sessionStorage.removeItem("mintAdminPw"); } catch (e) {} }
    function adminHeaders(extra) {
      const h = Object.assign({}, extra || {});
      const pw = getAdminPw();
      if (pw) h["X-Admin-Password"] = pw;
      return h;
    }

    const STATUS_OPTIONS = ["Pending", "In Progress", "Closed and Completed", "Cancelled"];
    const CLOSED_STATUS = "Closed and Completed";
    const FREQUENCY_OPTIONS = ["Weekly", "Bi-Weekly", "Monthly", "Quarterly", "Semi-Annually", "Annually"];
    const URGENCY_OPTIONS = [
      "1. Prod Stopped",
      "2. General Maint - High Priority",
      "3. Prod Affected, Not Stopped",
      "4. Prod Continuing but Affected Equipment stopped",
      "5. Prod Ongoing, Maint Required",
      "6. General Maint",
    ];

    /* ------------------------------------------------------------------ */
    /* Form building blocks (shared by all create/edit modals)            */
    /* ------------------------------------------------------------------ */
    const inputCls =
      "w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm text-slate-700 " +
      "focus:outline-none focus:ring-2 focus:ring-emerald-300";

    function LabeledField({ label, required, children, hint }) {
      return html`
        <label className="block">
          <div className="text-xs uppercase tracking-wide text-emerald-600 font-semibold mb-1">
            ${label}${required && html`<span className="text-rose-500"> *</span>`}
          </div>
          ${children}
          ${hint && html`<div className="text-[11px] text-slate-400 mt-1">${hint}</div>`}
        </label>`;
    }

    function TextInput({ label, value, onChange, placeholder, required, type, hint, disabled }) {
      return html`
        <${LabeledField} label=${label} required=${required} hint=${hint}>
          <input type=${type || "text"} value=${value} placeholder=${placeholder || ""} disabled=${!!disabled}
            onInput=${(e) => onChange && onChange(e.target.value)}
            className=${inputCls + (disabled ? " bg-slate-100 text-slate-500 cursor-not-allowed" : "")} />
        </${LabeledField}>`;
    }

    function TextArea({ label, value, onChange, placeholder, required, rows, hint }) {
      return html`
        <${LabeledField} label=${label} required=${required} hint=${hint}>
          <textarea rows=${rows || 3} value=${value} placeholder=${placeholder || ""}
            onInput=${(e) => onChange(e.target.value)} className=${inputCls}></textarea>
        </${LabeledField}>`;
    }

    function SelectInput({ label, value, onChange, options, required, placeholder, hint }) {
      return html`
        <${LabeledField} label=${label} required=${required} hint=${hint}>
          <select value=${value} onChange=${(e) => onChange(e.target.value)} className=${inputCls}>
            ${placeholder && html`<option value="">${placeholder}</option>`}
            ${options.map((o) => {
              const val = typeof o === "string" ? o : o.value;
              const lbl = typeof o === "string" ? o : o.label;
              return html`<option key=${val} value=${val}>${lbl}</option>`;
            })}
          </select>
        </${LabeledField}>`;
    }

    // The mandatory "Your name" field, wired to remember the value.
    function NameInput({ value, onChange }) {
      return html`
        <${TextInput} label="Your name" required=${true} value=${value}
          placeholder="e.g. Jane Smith"
          hint="Recorded on every work order you create or change."
          onChange=${(v) => { onChange(v); setUserName(v); }} />`;
    }

    // Shared confirm dialog for deactivating / restoring departments & machines.
    // Requires the user's name (like every other mutating action) and calls
    // onConfirm(name) which should perform the API call.
    function ConfirmActionModal({ title, message, confirmLabel, danger, onConfirm, onClose }) {
      const [name, setName] = useState(getUserName());
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const go = async () => {
        if (!name.trim()) { setErr("Your name is required."); return; }
        setBusy(true); setErr(null);
        try { setUserName(name.trim()); await onConfirm(name.trim()); onClose(); }
        catch (e) { setErr(e.message); setBusy(false); }
      };
      const btn = danger
        ? "bg-rose-600 hover:bg-rose-700"
        : "bg-emerald-700 hover:bg-emerald-800";
      return html`
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-start justify-center p-4 overflow-y-auto"
             onClick=${onClose}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md my-8 fade-in"
               onClick=${(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between px-6 py-4 border-b border-emerald-100">
              <div className=${"font-extrabold text-lg " + (danger ? "text-rose-600" : "text-emerald-800")}>${title}</div>
              <button onClick=${onClose}
                className="w-9 h-9 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xl leading-none">×</button>
            </div>
            <div className="p-6 space-y-4">
              <p className="text-sm text-slate-600">${message}</p>
              <${NameInput} value=${name} onChange=${setName} />
              ${err && html`<div className="text-rose-600 text-sm">${err}</div>`}
              <div className="flex gap-2 justify-end pt-1">
                <button onClick=${onClose} className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
                <button onClick=${go} disabled=${busy}
                  className=${"px-5 py-2 rounded-full text-white text-sm font-semibold disabled:opacity-60 " + btn}>
                  ${busy ? "Working…" : (confirmLabel || "Confirm")}</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function FileInput({ label, files, onChange, hint }) {
      return html`
        <${LabeledField} label=${label || "Attachments"} hint=${hint || "Photos, PDFs, docs - optional."}>
          <input type="file" multiple onChange=${(e) => onChange([...e.target.files])}
            className="block w-full text-sm text-slate-600 file:mr-3 file:py-1.5 file:px-3
                       file:rounded-full file:border-0 file:bg-emerald-700 file:text-white
                       file:text-sm file:font-semibold hover:file:bg-emerald-800" />
          ${files && files.length > 0 && html`
            <div className="text-[11px] text-slate-500 mt-1">${files.length} file(s) selected: ${files.map((f) => f.name).join(", ")}</div>`}
        </${LabeledField}>`;
    }

    /* ------------------------------------------------------------------ */
    /* Small UI building blocks                                           */
    /* ------------------------------------------------------------------ */
    function Spinner({ label }) {
      return html`
        <div className="flex items-center gap-3 text-emerald-700 py-6">
          <div className="w-5 h-5 border-2 border-emerald-200 border-t-emerald-700 rounded-full animate-spin"></div>
          <span>${label || "Loading…"}</span>
        </div>`;
    }

    const KPI_DEFS = [
      { key: "unscheduled_count", label: "Unscheduled WOs", fmt: num, accent: "from-emerald-600 to-emerald-500" },
      { key: "scheduled_count",   label: "Scheduled WOs",   fmt: num, accent: "from-teal-600 to-teal-500" },
      { key: "labor_time",        label: "Labor Time",      fmt: hours, accent: "from-cyan-600 to-cyan-500" },
      { key: "material_cost",     label: "Material Cost",   fmt: money, accent: "from-sky-600 to-sky-500" },
      { key: "downtime_hours",    label: "Downtime",        fmt: hours, accent: "from-indigo-500 to-indigo-400" },
    ];

    function KpiCard({ def, value }) {
      return html`
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-emerald-100 fade-in">
          <div className="text-sm text-emerald-600 font-bold">${def.label}</div>
          <div className="mt-1 text-2xl font-extrabold text-slate-800">${def.fmt(value)}</div>
          <div className=${"mt-3 h-1.5 rounded-full bg-gradient-to-r " + def.accent}></div>
        </div>`;
    }

    function KpiRow({ stats }) {
      if (!stats) return null;
      return html`
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
          ${KPI_DEFS.map((d) => html`<${KpiCard} key=${d.key} def=${d} value=${stats[d.key]} />`)}
        </div>`;
    }

    function Breadcrumb({ items }) {
      return html`
        <nav className="flex items-center flex-wrap gap-1 text-sm text-emerald-700 mb-5">
          ${items.map((it, i) => html`
            <span key=${i} className="flex items-center gap-1">
              ${i > 0 && html`<span className="text-emerald-300">/</span>`}
              ${it.onClick
                ? html`<button onClick=${it.onClick}
                          className="hover:underline font-medium hover:text-emerald-900">${it.label}</button>`
                : html`<span className="font-semibold text-slate-700">${it.label}</span>`}
            </span>`)}
        </nav>`;
    }

    function MintLogo({ className }) {
      const leaf = "M0 0 Q5 -2 5 -6 Q9 -9 7 -12 Q9 -15 6 -18 Q7 -21 4 -23 Q3 -26 0 -28 Q-3 -26 -4 -23 Q-7 -21 -6 -18 Q-9 -15 -7 -12 Q-9 -9 -5 -6 Q-5 -2 0 0 Z";
      return html`
        <svg viewBox="0 0 150 110" className=${className} fill="none"
             strokeWidth="11" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 96 L22 42 L42 66 L62 42" stroke="#6ee7b7"/>
          <path d="M62 42 L100 96 L100 42" stroke="#34d399"/>
          <path d="M80 42 L124 42" stroke="#a7f3d0"/>
          <path d="M62 42 L62 96" stroke="#ffffff"/>
          <g strokeLinecap="round">
            <g transform="translate(62 42) rotate(-48) scale(0.8)">
              <path d=${leaf} fill="#6ee7b7" stroke="none"/>
            </g>
            <g transform="translate(62 42) rotate(48) scale(0.8)">
              <path d=${leaf} fill="#34d399" stroke="none"/>
            </g>
          </g>
        </svg>`;
    }

    function Header({ onHome, onOpenInactive }) {
      return html`
        <header className="bg-slate-900 text-white shadow-lg">
          <div className="max-w-6xl mx-auto px-6 py-4 flex items-center gap-4">
            <div onClick=${onHome}
              className=${"flex items-end gap-3 " + (onHome ? "cursor-pointer" : "")}>
              <${MintLogo} className="h-16 w-auto" />
              <div className="text-emerald-100 text-sm font-medium -ml-2">Maintenance Intelligence & Troubleshooting</div>
            </div>
            ${onOpenInactive && html`
              <button onClick=${onOpenInactive}
                className="ml-auto flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-white/10 hover:bg-white/20
                           text-white text-sm font-semibold transition">
                <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 8v13H3V8"/><rect x="1" y="3" width="22" height="5" rx="1"/><path d="M10 12h4"/>
                </svg>
                <span>Inactive</span>
              </button>`}
          </div>
        </header>`;
    }

    /* ------------------------------------------------------------------ */
    /* Company dashboard (top layer)                                       */
    /* ------------------------------------------------------------------ */
    function CompanyDashboard({ onOpenDivision }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);

      useEffect(() => {
        getJSON("/api/company").then(setData).catch((e) => setErr(e.message));
      }, []);

      if (err) return html`<div className="text-rose-600">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading company…" />`;

      return html`
        <div className="fade-in">
          <h1 className="text-2xl font-extrabold text-slate-800 mb-1">${data.name}</h1>
          <p className="text-slate-500 mb-5">Company-wide maintenance overview across all divisions.</p>
          <${KpiRow} stats=${data.totals} />

          <h2 className="text-lg font-extrabold text-slate-700 mt-8 mb-4">Divisions</h2>
          <div className="grid md:grid-cols-2 gap-5">
            ${data.divisions.map((d) => html`
              <button key=${d.key} onClick=${() => onOpenDivision(d.key)}
                className="text-left bg-white rounded-3xl p-6 shadow-sm border border-emerald-100
                           hover:shadow-xl hover:border-emerald-300 transition group">
                <div className="flex items-center justify-between">
                  <div>
                    <div className="text-xl font-extrabold text-slate-800 group-hover:text-emerald-800">${d.name}</div>
                    <div className="text-sm text-slate-500">${d.department_count} departments · ${d.machine_count} machines</div>
                  </div>
                  <span className="text-emerald-500 text-2xl group-hover:translate-x-1 transition">→</span>
                </div>
                <div className="grid grid-cols-2 gap-2 mt-5 text-sm">
                  <div className="bg-emerald-50 rounded-xl px-3 py-2">
                    <div className="text-emerald-700 font-semibold">${num(d.unscheduled_count)}</div>
                    <div className="text-slate-500 text-xs">Unscheduled</div></div>
                  <div className="bg-teal-50 rounded-xl px-3 py-2">
                    <div className="text-teal-700 font-semibold">${num(d.scheduled_count)}</div>
                    <div className="text-slate-500 text-xs">Scheduled</div></div>
                  <div className="bg-cyan-50 rounded-xl px-3 py-2">
                    <div className="text-cyan-700 font-semibold">${hours(d.labor_time)}</div>
                    <div className="text-slate-500 text-xs">Labor</div></div>
                  <div className="bg-sky-50 rounded-xl px-3 py-2">
                    <div className="text-sky-700 font-semibold">${money(d.material_cost)}</div>
                    <div className="text-slate-500 text-xs">Material</div></div>
                  <div className="bg-indigo-50 rounded-xl px-3 py-2 col-span-2">
                    <div className="text-indigo-600 font-semibold">${hours(d.downtime_hours)}</div>
                    <div className="text-slate-500 text-xs">Downtime</div></div>
                </div>
              </button>`)}
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Division dashboard                                                 */
    /* ------------------------------------------------------------------ */
    const DIV_TABS = ["Departments", "Weekly Schedule", "Monthly Calendar", "Unscheduled", "Scheduled"];

    function DivisionDashboard({ divisionKey, onHome, onOpenDept, onOpenWo, refreshSignal }) {
      const divKey = divisionKey || "bla";
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [tab, setTab] = useState("Departments");
      const [woData, setWoData] = useState(null);
      const [woErr, setWoErr] = useState(null);
      const [creating, setCreating] = useState(false);
      const [reloadKey, setReloadKey] = useState(0);
      const [deactivating, setDeactivating] = useState(null);  // dept being deactivated
      const [restoring, setRestoring] = useState(null);        // dept being restored
      const [showInactive, setShowInactive] = useState(false);

      useEffect(() => {
        setData(null);
        getJSON("/api/divisions/" + divKey).then(setData).catch((e) => setErr(e.message));
      }, [divKey, reloadKey, refreshSignal]);

      // Drop the cached work-order lists when a WO is created/edited/deleted so
      // the open tab refetches.
      useEffect(() => { setWoData(null); setWoErr(null); }, [refreshSignal]);

      // Lazily load the division-wide work-order lists the first time the user
      // opens the Unscheduled/Scheduled tab (it's a large payload).
      useEffect(() => {
        if ((tab === "Unscheduled" || tab === "Scheduled") && !woData && !woErr) {
          getJSON("/api/workorders").then(setWoData).catch((e) => setWoErr(e.message));
        }
      }, [tab, woData, woErr]);

      const refreshAll = () => { setReloadKey((k) => k + 1); setWoData(null); setWoErr(null); };

      if (err) return html`<div className="text-rose-600">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading division…" />`;

      const totalUns = data.departments.reduce((a, d) => a + (d.unscheduled_count || 0), 0);
      const totalSch = data.departments.reduce((a, d) => a + (d.scheduled_count || 0), 0);

      return html`
        <div className="fade-in">
          ${onHome && html`<${Breadcrumb} items=${[
            { label: "Bobrick", onClick: onHome },
            { label: data.name + " Division" },
          ]} />`}
          <div className="flex items-start justify-between flex-wrap gap-3 mb-1">
            <h1 className="text-2xl font-extrabold text-slate-800">${data.name} Division</h1>
            <button onClick=${() => setCreating(true)}
              className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 shadow-sm">
              + New Work Order</button>
          </div>
          <p className="text-slate-500 mb-5">Combined quick view across all departments.</p>
          <${KpiRow} stats=${data.totals} />
          ${creating && html`<${CreateWorkOrderModal} divisionKey=${divKey}
            onClose=${() => setCreating(false)} onCreated=${refreshAll} onOpenWo=${onOpenWo} />`}

          <div className="flex gap-2 mt-8 mb-6 bg-white p-1.5 rounded-full shadow-sm border border-emerald-100 w-fit flex-wrap">
            ${DIV_TABS.map((t) => html`
              <button key=${t} onClick=${() => setTab(t)}
                className=${"px-4 py-2 rounded-full text-sm font-semibold transition " +
                  (tab === t ? "bg-emerald-700 text-white shadow" : "text-slate-500 hover:bg-emerald-50")}>
                ${t}
                ${t === "Unscheduled" && html`<span className="ml-1 opacity-70">(${num(totalUns)})</span>`}
                ${t === "Scheduled" && html`<span className="ml-1 opacity-70">(${num(totalSch)})</span>`}
              </button>`)}
          </div>

          ${tab === "Weekly Schedule" && html`
            <div className="fade-in">
              <${EmbeddedWeekly}
                predicate=${() => true}
                showDept=${true}
                onOpenWo=${onOpenWo}
                subtitle="All departments · scheduled & unscheduled work orders by week (Sunday → Sunday)." />
            </div>`}

          ${tab === "Monthly Calendar" && html`
            <div className="fade-in">
              <${EmbeddedMonthly}
                predicate=${() => true}
                showDept=${true}
                onOpenWo=${onOpenWo}
                title="Monthly Calendar"
                subtitle="All departments · scheduled & unscheduled work orders for the month." />
            </div>`}

          ${(tab === "Unscheduled" || tab === "Scheduled") && html`
            <div className="fade-in">
              ${woErr
                ? html`<div className="text-rose-600">${woErr}</div>`
                : !woData
                  ? html`<${Spinner} label="Loading all work orders…" />`
                  : html`<${WorkOrderList}
                      records=${tab === "Unscheduled" ? woData.unscheduled : woData.scheduled}
                      kind=${tab.toLowerCase()} onOpen=${onOpenWo}
                      filters=${tab === "Unscheduled" ? ["department", "urgency", "status"] : ["department", "status"]} />`}
            </div>`}

          ${tab === "Departments" && html`
          <div className="fade-in">
          <div className="grid md:grid-cols-2 gap-5">
            ${data.departments.map((d) => html`
              <div key=${d.key} onClick=${() => onOpenDept(d.key)}
                className="relative text-left bg-white rounded-3xl p-6 shadow-sm border border-emerald-100
                           hover:shadow-xl hover:border-emerald-300 transition group cursor-pointer">
                <button title="Deactivate department"
                  onClick=${(e) => { e.stopPropagation(); setDeactivating(d); }}
                  className="absolute top-3 right-3 w-8 h-8 rounded-full text-slate-300 hover:text-rose-600
                             hover:bg-rose-50 flex items-center justify-center text-xl leading-none
                             opacity-0 group-hover:opacity-100 transition">×</button>
                <div className="flex items-center justify-between pr-8">
                  <div>
                    <div className="text-xl font-extrabold text-slate-800 group-hover:text-emerald-800">${d.label}</div>
                    <div className="text-sm text-slate-500">${d.machine_count} machines</div>
                  </div>
                  <span className="text-emerald-500 text-2xl group-hover:translate-x-1 transition">→</span>
                </div>
                <div className="grid grid-cols-2 gap-2 mt-5 text-sm">
                  <div className="bg-emerald-50 rounded-xl px-3 py-2">
                    <div className="text-emerald-700 font-semibold">${num(d.unscheduled_count)}</div>
                    <div className="text-slate-500 text-xs">Unscheduled</div></div>
                  <div className="bg-teal-50 rounded-xl px-3 py-2">
                    <div className="text-teal-700 font-semibold">${num(d.scheduled_count)}</div>
                    <div className="text-slate-500 text-xs">Scheduled</div></div>
                  <div className="bg-cyan-50 rounded-xl px-3 py-2">
                    <div className="text-cyan-700 font-semibold">${hours(d.labor_time)}</div>
                    <div className="text-slate-500 text-xs">Labor</div></div>
                  <div className="bg-sky-50 rounded-xl px-3 py-2">
                    <div className="text-sky-700 font-semibold">${money(d.material_cost)}</div>
                    <div className="text-slate-500 text-xs">Material</div></div>
                  <div className="bg-indigo-50 rounded-xl px-3 py-2 col-span-2">
                    <div className="text-indigo-600 font-semibold">${hours(d.downtime_hours)}</div>
                    <div className="text-slate-500 text-xs">Downtime</div></div>
                </div>
                <div className="mt-4 flex justify-end">
                  <button onClick=${(e) => { e.stopPropagation(); onOpenDept(d.key, "Monthly Calendar"); }}
                    className="text-xs font-semibold text-emerald-700 hover:text-emerald-800 flex items-center gap-1.5 px-3 py-1.5 rounded-full hover:bg-emerald-50 transition">
                    <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor"
                         strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                      <line x1="16" y1="2" x2="16" y2="6"/>
                      <line x1="8" y1="2" x2="8" y2="6"/>
                      <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    Calendar
                  </button>
                </div>
              </div>`)}
          </div>

          ${(data.inactive_departments || []).length > 0 && html`
            <div className="mt-10 border-t border-slate-200 pt-4">
              <button onClick=${() => setShowInactive((v) => !v)}
                className="text-sm font-semibold text-slate-500 hover:text-emerald-800 flex items-center gap-1">
                <span>${showInactive ? "▾" : "▸"}</span>
                <span>Inactive departments (${data.inactive_departments.length})</span>
              </button>
              ${showInactive && html`
                <div className="mt-3 grid md:grid-cols-2 gap-3">
                  ${data.inactive_departments.map((d) => html`
                    <div key=${d.key} className="flex items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
                      <div className="font-semibold text-slate-600 truncate">${d.label}</div>

          ${deactivating && html`<${ConfirmActionModal}
            title="Deactivate department" danger=${true} confirmLabel="Deactivate"
            message=${"Move “" + deactivating.label + "” to the inactive section? Its machines and work orders will be hidden everywhere but nothing is deleted — you can restore it anytime."}
            onConfirm=${async (author) => { await sendJSON("/api/departments/" + deactivating.key + "/deactivate", "POST", { author }); refreshAll(); }}
            onClose=${() => setDeactivating(null)} />`}

          ${restoring && html`<${ConfirmActionModal}
            title="Restore department" confirmLabel="Restore"
            message=${"Restore “" + restoring.label + "” and bring back its machines and work orders?"}
            onConfirm=${async (author) => { await sendJSON("/api/departments/" + restoring.key + "/restore", "POST", { author }); refreshAll(); }}
            onClose=${() => setRestoring(null)} />`}
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Department dashboard                                               */
    /* ------------------------------------------------------------------ */
    function MachineCard({ m, onOpen, onDeactivate }) {
      return html`
        <div key=${m.eq_id} onClick=${() => onOpen(m.eq_id)}
          className=${"relative text-left bg-white rounded-2xl p-5 shadow-sm transition group cursor-pointer " +
            (m.has_critical_wo
              ? "border-2 border-rose-400 hover:border-rose-500 hover:shadow-lg hover:shadow-rose-100"
              : "border border-emerald-100 hover:shadow-lg hover:border-emerald-300")}>
          ${m.has_critical_wo && html`
            <span className="absolute -top-2 -left-2 bg-rose-600 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow">
              Critical WO
            </span>`}
          ${onDeactivate && html`
            <button title="Deactivate machine"
              onClick=${(e) => { e.stopPropagation(); onDeactivate(m); }}
              className="absolute top-2 right-2 w-7 h-7 rounded-full text-slate-300 hover:text-rose-600
                         hover:bg-rose-50 flex items-center justify-center text-lg leading-none
                         opacity-0 group-hover:opacity-100 transition">×</button>`}
          <div className="flex items-start justify-between gap-2 pr-6">
            <div className="font-bold text-slate-800 group-hover:text-emerald-800 leading-tight">${m.name}</div>
            ${m.has_guide && html`<span className="text-[10px] font-bold uppercase bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Guide</span>`}

          <div className="text-xs text-emerald-600 font-mono mt-0.5">${m.eq_label}</div>
          <div className="flex flex-wrap gap-2 mt-4 text-xs">
            <span className="bg-emerald-50 text-emerald-700 rounded-lg px-2 py-1 font-semibold">${num(m.unscheduled_count)} unsch.</span>
            <span className="bg-teal-50 text-teal-700 rounded-lg px-2 py-1 font-semibold">${num(m.scheduled_count)} sch.</span>
            <span className="bg-indigo-50 text-indigo-600 rounded-lg px-2 py-1 font-semibold" title="Downtime">${hours(m.downtime_hours)} down</span>
            <span className="bg-cyan-50 text-cyan-700 rounded-lg px-2 py-1 font-semibold" title="Labor time">${hours(m.labor_time)} labor</span>
            <span className="bg-sky-50 text-sky-700 rounded-lg px-2 py-1 font-semibold" title="Material cost">${money(m.material_cost)}</span>
          </div>
        </div>`;
    }

    function MachineGrid({ machines, onOpenMachine, onDeactivate }) {
      return html`
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${machines.map((m) => html`<${MachineCard} key=${m.eq_id} m=${m} onOpen=${onOpenMachine} onDeactivate=${onDeactivate} />`)}
        </div>`;
    }

    const DEPT_TABS = ["Machines", "Weekly Schedule", "Monthly Calendar", "Unscheduled", "Scheduled"];

    function DepartmentDashboard({ deptKey, divisionKey, divisionLabel, initialTab, onHome, onCompany, onOpenMachine, onOpenWo, refreshSignal }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [q, setQ] = useState("");
      const [tab, setTab] = useState(initialTab || "Machines");
      const [creating, setCreating] = useState(false);
      const [reloadKey, setReloadKey] = useState(0);
      const [deactivating, setDeactivating] = useState(null);  // machine being deactivated
      const [restoring, setRestoring] = useState(null);        // machine being restored
      const [showInactive, setShowInactive] = useState(false);

      useEffect(() => { setTab(initialTab || "Machines"); }, [deptKey, initialTab]);

      useEffect(() => {
        setData(null);
        getJSON("/api/departments/" + deptKey).then(setData).catch((e) => setErr(e.message));
      }, [deptKey, reloadKey, refreshSignal]);

      const refresh = () => setReloadKey((k) => k + 1);

      if (err) return html`<div className="text-rose-600">${err}</div>`;
      if (!data) return html`<${Spinner} label="Loading department…" />`;

      const inactiveMachines = data.inactive_machines || [];

      const machines = data.machines.filter((m) => {
        const s = q.trim().toLowerCase();
        if (!s) return true;
        return (m.name || "").toLowerCase().includes(s) ||
               (m.eq_label || "").toLowerCase().includes(s) ||
               (m.eq_id || "").toLowerCase().includes(s);
      });
      const groups = data.groups || [];
      // Toilet Partitions gets a department-wide Trends tab aggregating just its
      // "Machines" group. Other departments keep the standard tab set.
      const deptTabs = deptKey === "toilet"
        ? ["Machines", "Trends", "Weekly Schedule", "Monthly Calendar", "Unscheduled", "Scheduled"]
        : DEPT_TABS;

      return html`
        <div className="fade-in">
          <${Breadcrumb} items=${[
            { label: "Bobrick", onClick: onCompany },
            { label: (divisionLabel || "BLA") + " Division", onClick: onHome },
            { label: data.label },
          ]} />
          <div className="flex items-start justify-between flex-wrap gap-3 mb-1">
            <h1 className="text-2xl font-extrabold text-slate-800">${data.label}</h1>
            <button onClick=${() => setCreating(true)}
              className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 shadow-sm">
              + New Work Order</button>
          </div>
          <p className="text-slate-500 mb-5">${data.machines.length} machines · department quick view.</p>
          <${KpiRow} stats=${data.stats} />
          ${creating && html`<${CreateWorkOrderModal} divisionKey=${divisionKey || "bla"} presetDeptKey=${deptKey}
            onClose=${() => setCreating(false)} onCreated=${() => setReloadKey((k) => k + 1)} onOpenWo=${onOpenWo} />`}

          <div className="flex gap-2 mt-8 mb-6 bg-white p-1.5 rounded-full shadow-sm border border-emerald-100 w-fit flex-wrap">
            ${deptTabs.map((t) => html`
              <button key=${t} onClick=${() => setTab(t)}
                className=${"px-4 py-2 rounded-full text-sm font-semibold transition " +
                  (tab === t ? "bg-emerald-700 text-white shadow" : "text-slate-500 hover:bg-emerald-50")}>
                ${t}
                ${t === "Unscheduled" && html`<span className="ml-1 opacity-70">(${data.stats.unscheduled_count})</span>`}
                ${t === "Scheduled" && html`<span className="ml-1 opacity-70">(${data.stats.scheduled_count})</span>`}
              </button>`)}
          </div>

          ${tab === "Trends" && html`
            <div className="fade-in">
              <${DeptTrendsTab} deptKey=${deptKey} group="Machines" onOpenWo=${onOpenWo} />
            </div>`}

          ${tab === "Weekly Schedule" && html`
            <div className="fade-in">
              <${EmbeddedWeekly}
                predicate=${(r) => r.department_key === deptKey}
                showDept=${false}
                onOpenWo=${onOpenWo}
                subtitle=${data.label + " · scheduled & unscheduled work orders by week (Sunday → Sunday)."} />
            </div>`}

          ${tab === "Monthly Calendar" && html`
            <div className="fade-in">
              <${EmbeddedMonthly}
                predicate=${(r) => r.department_key === deptKey}
                showDept=${false}
                onOpenWo=${onOpenWo}
                title="Monthly Calendar"
                subtitle=${data.label + " · scheduled & unscheduled work orders for the month."}
                deptKey=${deptKey} />
            </div>`}

          ${tab === "Machines" && html`
            <div className="fade-in">
              <div className="flex items-center justify-end mb-3 gap-3 flex-wrap">
                <input value=${q} onInput=${(e) => setQ(e.target.value)}
                  placeholder="Search by name or EQ ID…"
                  className="px-4 py-2 rounded-full border border-emerald-200 bg-white text-sm w-64
                             focus:outline-none focus:ring-2 focus:ring-emerald-300" />
              </div>
              ${groups.length === 0
                ? html`<${MachineGrid} machines=${machines} onOpenMachine=${onOpenMachine} onDeactivate=${setDeactivating} />`
                : html`
                  <div className="space-y-8">
                    ${groups.map((g) => {
                      const inGroup = machines.filter((m) => m.group === g);
                      if (inGroup.length === 0) return null;
                      return html`
                        <section key=${g}>
                          <div className="flex items-center gap-3 mb-3">
                            <h3 className="text-base font-bold text-slate-700">${g}</h3>
                            <span className="text-xs font-semibold text-emerald-700 bg-emerald-50 rounded-full px-2.5 py-0.5">${inGroup.length}</span>
                            <div className="flex-1 h-px bg-emerald-100"></div>
                          </div>
                          <${MachineGrid} machines=${inGroup} onOpenMachine=${onOpenMachine} onDeactivate=${setDeactivating} />
                        </section>`;
                    })}
                  </div>`}
              ${machines.length === 0 && html`<div className="text-slate-400 mt-6">No machines match “${q}”.</div>`}

              ${inactiveMachines.length > 0 && html`
                <div className="mt-10 border-t border-slate-200 pt-4">
                  <button onClick=${() => setShowInactive((v) => !v)}
                    className="text-sm font-semibold text-slate-500 hover:text-emerald-800 flex items-center gap-1">
                    <span>${showInactive ? "▾" : "▸"}</span>
                    <span>Inactive machines (${inactiveMachines.length})</span>
                  </button>
                  ${showInactive && html`
                    <div className="mt-3 grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                      ${inactiveMachines.map((m) => html`
                        <div key=${m.eq_id} className="flex items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
                          <div className="min-w-0">
                            <div className="font-semibold text-slate-600 truncate">${m.name}</div>
                            <div className="text-xs text-slate-400 font-mono">EQ ID ${m.eq_id}</div>
                          </div>
                          <button onClick=${() => setRestoring(m)}
                            className="px-3 py-1.5 rounded-full bg-emerald-700 text-white text-xs font-semibold hover:bg-emerald-800 whitespace-nowrap">Restore</button>
                        </div>`)}
                    </div>`}
                </div>`}
            </div>`}

          ${tab === "Unscheduled" && html`
            <div className="fade-in">
              <${WorkOrderList} records=${data.unscheduled} kind="unscheduled" onOpen=${onOpenWo}
                filters=${["machine", "urgency", "status"]} />
            </div>`}

          ${tab === "Scheduled" && html`
            <div className="fade-in">
              <${WorkOrderList} records=${data.scheduled} kind="scheduled" onOpen=${onOpenWo}
                filters=${["machine", "status"]} />
            </div>`}

          ${deactivating && html`<${ConfirmActionModal}
            title="Deactivate machine" danger=${true} confirmLabel="Deactivate"
            message=${"Move “" + deactivating.name + "” to the inactive section? Its work orders will be hidden everywhere but nothing is deleted — you can restore it anytime."}
            onConfirm=${async (author) => { await sendJSON("/api/machines/deactivate", "POST", { author, dept_key: deptKey, eq_id: deactivating.eq_id, name: deactivating.name }); refresh(); }}
            onClose=${() => setDeactivating(null)} />`}

          ${restoring && html`<${ConfirmActionModal}
            title="Restore machine" confirmLabel="Restore"
            message=${"Restore “" + restoring.name + "” and bring back its work orders?"}
            onConfirm=${async (author) => { await sendJSON("/api/machines/restore", "POST", { author, dept_key: deptKey, eq_id: restoring.eq_id }); refresh(); }}
            onClose=${() => setRestoring(null)} />`}
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Work order list + modal                                            */
    /* ------------------------------------------------------------------ */
    // Which value each filter reads off a work-order record.
    const WO_FILTER_ACCESSORS = {
      department: (r) => r.department_label || r.department || r.department_key || "",
      machine: (r) => r.equipment_name || "",
      urgency: (r) => r.urgency || "",
      status: (r) => r.status || "",
    };
    const WO_FILTER_LABELS = {
      department: "All departments",
      machine: "All machines",
      urgency: "All urgencies",
      status: "All statuses",
    };

    // `filters` is an optional list naming which dropdowns to show, e.g.
    // ["department", "urgency", "status"]. Options are derived from the records.
    function WorkOrderList({ records, kind, onOpen, filters }) {
      const [q, setQ] = useState("");
      const [sel, setSel] = useState({});
      const active = Array.isArray(filters) ? filters : [];
      if (!records || records.length === 0)
        return html`<div className="text-slate-400 py-8 text-center">No ${kind} work orders.</div>`;

      // Always show newest first. Scheduled orders by due date, unscheduled by
      // the date they were reported; undated records sort to the bottom.
      const woTime = (r) => {
        const raw = kind === "scheduled"
          ? (r.due_date || r.date_notified)
          : (r.date_notified || r.due_date);
        const t = parseWODate(raw);
        return t === Infinity ? -Infinity : t;
      };
      const sorted = [...records].sort((a, b) => {
        const diff = woTime(b) - woTime(a);
        if (diff) return diff;
        // Same date: newest work-order number first (stable, deterministic).
        return String(b.wo_id || "").localeCompare(String(a.wo_id || ""), undefined, { numeric: true });
      });

      // Unique, sorted option values present in the records for each dropdown.
      const optionsFor = (name) => {
        const acc = WO_FILTER_ACCESSORS[name];
        return [...new Set(records.map(acc).filter(Boolean))]
          .sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
      };

      const filtered = sorted.filter((r) => {
        const s = q.trim().toLowerCase();
        if (s && !((r.wo_id || "").toLowerCase().includes(s) ||
                   (r.problem || r.audit_item || "").toLowerCase().includes(s) ||
                   (r.status || "").toLowerCase().includes(s))) return false;
        return active.every((name) =>
          !sel[name] || WO_FILTER_ACCESSORS[name](r) === sel[name]);
      });

      const selCls = "px-4 py-2 rounded-full border border-emerald-200 bg-white text-sm text-slate-700 " +
                     "focus:outline-none focus:ring-2 focus:ring-emerald-300";

      return html`
        <div>
          <div className="flex flex-wrap items-center gap-3 mb-4">
            <input value=${q} onInput=${(e) => setQ(e.target.value)}
              placeholder=${"Search " + kind + " work orders…"}
              className="px-4 py-2 rounded-full border border-emerald-200 bg-white text-sm w-full max-w-sm
                         focus:outline-none focus:ring-2 focus:ring-emerald-300" />
            ${active.map((name) => html`
              <select key=${name} value=${sel[name] || ""} className=${selCls}
                onChange=${(e) => setSel((s) => ({ ...s, [name]: e.target.value }))}>
                <option value="">${WO_FILTER_LABELS[name]}</option>
                ${optionsFor(name).map((o) => html`<option key=${o} value=${o}>${o}</option>`)}
              </select>`)}
          </div>
          <div className="space-y-3">
            ${filtered.map((r) => html`
              <button key=${r.wo_id} onClick=${() => onOpen(r.wo_id)}
                className="w-full text-left bg-white rounded-2xl p-4 shadow-sm border border-emerald-100
                           hover:shadow-md hover:border-emerald-300 transition">
                <div className="flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-bold text-emerald-800">WO #${r.wo_id}</span>
                    ${r.urgency && html`<span className=${"text-xs px-2 py-0.5 rounded-full border " + urgencyColor(r.urgency)}>${r.urgency}</span>`}
                    ${r.status && html`<span className=${"text-xs px-2 py-0.5 rounded-full border " + statusColor(r.status)}>${r.status}</span>`}
                    ${r.department_label && html`<span className="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">${r.department_label}</span>`}
                  </div>
                  <div className="text-xs text-slate-400 whitespace-nowrap">${r.date_notified || r.due_date || ""}</div>
                </div>
                <div className="text-sm text-slate-600 mt-1.5 line-clamp-2">${r.problem || r.audit_item || "—"}</div>
                <div className="flex gap-3 mt-2 text-xs text-slate-400">
                  <span>Labor ${hours(r.labor_time)}</span>
                  <span>Material ${money(r.material_cost)}</span>
                  <span>Downtime ${hours(r.downtime_hours)}</span>
                  ${(() => { const n = r.attachment_count != null ? r.attachment_count : (r.attachments ? r.attachments.length : 0); return n > 0 && html`<span className="text-emerald-600 font-semibold">📎 ${n}</span>`; })()}
                </div>
              </button>`)}
          </div>
          ${filtered.length === 0 && html`<div className="text-slate-400 py-6 text-center">No work orders match the current search and filters.</div>`}
        </div>`;
    }

    function Field({ label, value }) {
      if (value === undefined || value === null || value === "") return null;
      return html`
        <div>
          <div className="text-xs uppercase tracking-wide text-emerald-600 font-semibold">${label}</div>
          <div className="text-slate-700 whitespace-pre-wrap">${value}</div>
        </div>`;
    }

    // Inline editor for a work order's core fields. Requires a name.
    function WoEditForm({ rec, name, setName, onSaved, onCancel }) {
      const scheduled = rec.wo_type === "scheduled";
      const [f, setF] = useState({
        equipment_name: rec.equipment_name || "",
        equipment_eq_id: rec.equipment_eq_id || "",
        status: rec.status || "Pending",
        urgency: rec.urgency || "",
        date_notified: rec.date_notified || "",
        due_date: rec.due_date || "",
        problem: rec.problem || "",
        audit_item: rec.audit_item || "",
        work_performed_by: rec.work_performed_by || "",
        labor_time: rec.labor_time || "",
        material_cost: rec.material_cost || "",
        downtime_hours: rec.downtime_hours || "",
        completed_datetime: rec.completed_datetime || "",
        completion_comments: rec.completion_comments || "",
        frequency: rec.frequency || "",
      });
      const set = (k) => (v) => setF((s) => ({ ...s, [k]: v }));
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);

      // Machine dropdown, sourced from this WO's department. Picking a machine
      // auto-fills the (read-only) EQ ID. If the current machine isn't in the
      // master list (e.g. an old scraped WO), we keep it as a "current" option.
      const [machines, setMachines] = useState([]);
      useEffect(() => {
        const dk = rec.department_key;
        if (!dk) { setMachines([]); return; }
        getJSON("/api/departments/" + dk).then((d) => setMachines(d.machines || [])).catch(() => setMachines([]));
      }, [rec.department_key]);

      const KEEP_CURRENT = "__keep_current__";
      const machineOptions = machines.map((m) => ({ value: String(m.eq_id), label: m.name + " (" + m.eq_label + ")" }));
      const matchedMachine = machines.find((m) =>
        (f.equipment_eq_id && m.eq_label === f.equipment_eq_id) || (f.equipment_name && m.name === f.equipment_name));
      const machineSelectValue = matchedMachine ? String(matchedMachine.eq_id) : (f.equipment_name ? KEEP_CURRENT : "");
      const machineSelectOptions = matchedMachine || !f.equipment_name
        ? machineOptions
        : [{ value: KEEP_CURRENT, label: f.equipment_name + (f.equipment_eq_id ? " (" + f.equipment_eq_id + ")" : "") + " — current" }, ...machineOptions];
      const pickMachine = (eqId) => {
        if (eqId === KEEP_CURRENT || eqId === "") return;
        const m = machines.find((x) => String(x.eq_id) === String(eqId));
        if (m) setF((s) => ({ ...s, equipment_eq_id: m.eq_label, equipment_name: m.name }));
      };

      // Both WO types only collect labor/downtime/material/work-by/comments at
      // close-out. When the status is set to "Closed and Completed" these become
      // required (scheduled WOs also require the date completed).
      const closing = f.status === CLOSED_STATUS;

      const save = async () => {
        if (!name.trim()) { setErr("Your name is required."); return; }
        let fields = { ...f };
        if (closing) {
          const req = [
            ["work_performed_by", "Work performed by"],
            ["labor_time", "Labor time"],
            ["downtime_hours", "Downtime"],
            ["material_cost", "Material cost"],
            ["completion_comments", "Comments"],
          ];
          if (scheduled) req.unshift(["completed_datetime", "Date completed"]);
          for (const [k, lbl] of req) {
            if (!String(fields[k] ?? "").trim()) { setErr(lbl + " is required to close this work order."); return; }
          }
          if (!String(fields.completed_datetime || "").trim()) fields.completed_datetime = todayMDY();
        }
        setBusy(true); setErr(null);
        try {
          const d = await sendJSON("/api/workorder/" + rec.wo_id, "PATCH",
            { author: name.trim(), fields });
          onSaved(d.work_order);
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };

      return html`
        <div className="space-y-4">
          <${NameInput} value=${name} onChange=${setName} />
          <div className="grid sm:grid-cols-2 gap-3">
            <${SelectInput} label="Machine" value=${machineSelectValue} onChange=${pickMachine}
              options=${machineSelectOptions} placeholder=${machines.length ? "Select machine…" : "Loading machines…"} />
            <${TextInput} label="EQ ID" value=${f.equipment_eq_id} disabled=${true}
              hint="Set automatically from the selected machine." />
            <${SelectInput} label="Status" value=${f.status} onChange=${set("status")} options=${STATUS_OPTIONS} />
            ${scheduled
              ? html`<${TextInput} label="Due Date" value=${f.due_date} onChange=${set("due_date")} placeholder="M/D/YYYY" />`
              : html`<${SelectInput} label="Urgency" value=${f.urgency} onChange=${set("urgency")} options=${URGENCY_OPTIONS} placeholder="Select urgency…" />`}
            ${!scheduled && html`<${TextInput} label="Date Notified" value=${f.date_notified} onChange=${set("date_notified")} placeholder="MM/DD/YYYY" />`}
            ${scheduled && html`<${SelectInput} label="Frequency" value=${f.frequency} onChange=${set("frequency")} options=${FREQUENCY_OPTIONS} placeholder="How often…" />`}
          </div>
          ${scheduled
            ? html`<${TextArea} label="Audit Item" value=${f.audit_item} onChange=${set("audit_item")} rows=${4} />`
            : html`<${TextArea} label="Problem" value=${f.problem} onChange=${set("problem")} rows=${4} />`}

          ${closing && html`
            <div className="rounded-2xl border border-emerald-200 bg-emerald-50/60 p-4 space-y-3">
              <div className="text-sm font-bold text-emerald-800">Completion details (required)</div>
              <div className="grid sm:grid-cols-2 gap-3">
                <${TextInput} label="Work Performed By" required=${true} value=${f.work_performed_by} onChange=${set("work_performed_by")} />
                <${TextInput} label="Date Completed" required=${scheduled} value=${f.completed_datetime} onChange=${set("completed_datetime")} placeholder="MM/DD/YYYY" hint=${scheduled ? "" : "Defaults to today if left blank."} />
                <${TextInput} label="Labor Time (h)" required=${true} value=${f.labor_time} onChange=${set("labor_time")} type="number" />
                <${TextInput} label="Downtime (h)" required=${true} value=${f.downtime_hours} onChange=${set("downtime_hours")} type="number" />
                <${TextInput} label="Material Cost ($)" required=${true} value=${f.material_cost} onChange=${set("material_cost")} type="number" />
              </div>
              <${TextArea} label="Comments" required=${true} value=${f.completion_comments} onChange=${set("completion_comments")} rows=${3}
                placeholder="Summary of the completed work…" />
            </div>`}

          ${err && html`<div className="text-rose-600 text-sm">${err}</div>`}
          <div className="flex gap-2 justify-end">
            <button onClick=${onCancel} className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
            <button onClick=${save} disabled=${busy}
              className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60">
              ${busy ? "Saving…" : (closing ? "Close & complete" : "Save changes")}</button>
          </div>
        </div>`;
    }

    // The "Solution" log for a work order: an append-only list of dated,
    // attributed entries. Legacy scraped "comments" show as an imported note.
    function SolutionSection({ rec, name, setName, onChanged }) {
      const label = rec.wo_type === "scheduled" ? "Notes" : "Solution";
      const [text, setText] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const solutions = rec.solutions || [];

      const add = async () => {
        if (!name.trim()) { setErr("Your name is required."); return; }
        if (!text.trim()) { setErr(label + " text is required."); return; }
        setBusy(true); setErr(null);
        try {
          await sendJSON("/api/workorder/" + rec.wo_id + "/solutions", "POST",
            { author: name.trim(), text: text.trim() });
          setText("");
          onChanged();
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };

      return html`
        <div className="mt-6">
          <div className="text-xs uppercase tracking-wide text-emerald-600 font-semibold mb-2">${label}</div>
          <div className="space-y-2">
            ${rec.comments && html`
              <div className="rounded-xl bg-slate-50 border border-slate-100 p-3">
                <div className="text-[11px] font-semibold text-slate-400 uppercase mb-1">Imported note (from PM)</div>
                <div className="text-sm text-slate-600 whitespace-pre-wrap">${rec.comments}</div>
              </div>`}
            ${solutions.map((s) => html`
              <div key=${s.id} className="rounded-xl bg-emerald-50/60 border border-emerald-100 p-3">
                <div className="flex items-center justify-between gap-2 mb-1">
                  <span className="text-sm font-semibold text-emerald-800">${s.author || "Unknown"}</span>
                  <span className="text-[11px] text-slate-400">${(s.created_at || "").replace("T", " ")}</span>
                </div>
                <div className="text-sm text-slate-700 whitespace-pre-wrap">${s.text}</div>
              </div>`)}
            ${!rec.comments && solutions.length === 0 && html`
              <div className="text-slate-400 text-sm italic">No ${label.toLowerCase()} recorded yet.</div>`}
          </div>
          <div className="mt-3 space-y-2 rounded-xl border border-slate-100 p-3">
            <${NameInput} value=${name} onChange=${setName} />
            <${TextArea} label=${"Add to " + label.toLowerCase()} value=${text} onChange=${setText}
              rows=${3} placeholder=${"Describe what was tried / done…"} />
            ${err && html`<div className="text-rose-600 text-sm">${err}</div>`}
            <div className="flex justify-end">
              <button onClick=${add} disabled=${busy}
                className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60">
                ${busy ? "Adding…" : "Add " + label.toLowerCase()}</button>
            </div>
          </div>
        </div>`;
    }

    // Attachments list + uploader for a work order.
    function AttachmentSection({ rec, name, setName, onChanged }) {
      const [files, setFiles] = useState([]);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const atts = rec.attachments || [];

      const upload = async () => {
        if (!name.trim()) { setErr("Your name is required."); return; }
        if (!files.length) { setErr("Choose at least one file."); return; }
        setBusy(true); setErr(null);
        try {
          await uploadAttachments(rec.wo_id, files, name.trim());
          setFiles([]);
          onChanged();
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };

      return html`
        <div className="mt-6">
          <div className="text-xs uppercase tracking-wide text-emerald-600 font-semibold mb-2">Attachments</div>
          ${atts.length > 0
            ? html`<div className="flex flex-col gap-2 mb-3">
                ${atts.map((a) => html`
                  <a key=${a.id || a.url} href=${a.url} target="_blank" rel="noopener noreferrer"
                    className="flex items-center gap-2 px-3 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-sm font-medium transition">
                    <span>📎</span><span className="truncate flex-1">${a.filename || a.name || a.url}</span>
                    ${a.uploaded_by && html`<span className="text-[11px] text-slate-400">by ${a.uploaded_by}</span>`}
                  </a>`)}
              </div>`
            : html`<div className="text-slate-400 text-sm italic mb-3">No attachments yet.</div>`}
          <div className="space-y-2 rounded-xl border border-slate-100 p-3">
            <${NameInput} value=${name} onChange=${setName} />
            <${FileInput} files=${files} onChange=${setFiles} />
            ${err && html`<div className="text-rose-600 text-sm">${err}</div>`}
            <div className="flex justify-end">
              <button onClick=${upload} disabled=${busy}
                className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60">
                ${busy ? "Uploading…" : "Upload"}</button>
            </div>
          </div>
        </div>`;
    }

    // Password prompt for admin-gated actions (delete WO / view history).
    // Verifies against the server, then remembers it for the browser session.
    function AdminGate({ actionLabel, onUnlock, onCancel }) {
      const [pw, setPw] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const submit = async () => {
        if (!pw) return;
        setBusy(true); setErr(null);
        try {
          const r = await fetch(API + "/api/verify-admin-password", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw }),
          });
          const d = await r.json();
          if (!r.ok || !d.ok) throw new Error(d.error || "Incorrect password");
          setAdminPw(pw);
          onUnlock();
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };
      return html`
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4"
          onClick=${onCancel}>
          <div className="bg-white rounded-2xl shadow-xl border border-emerald-100 w-full max-w-sm p-6"
            onClick=${(e) => e.stopPropagation()}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xl">🔒</span>
              <h3 className="text-lg font-extrabold text-slate-800">Admin password required</h3>
            </div>
            <p className="text-sm text-slate-500 mb-4">Enter the admin password to ${actionLabel || "continue"}.</p>
            <input type="password" value=${pw} autoFocus
              onInput=${(e) => setPw(e.target.value)}
              onKeyDown=${(e) => { if (e.key === "Enter") submit(); }}
              placeholder="Admin password"
              className=${inputCls} />
            ${err && html`<div className="text-rose-600 text-sm mt-2">${err}</div>`}
            <div className="flex gap-2 justify-end mt-4">
              <button onClick=${onCancel}
                className="px-4 py-2 rounded-full border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancel</button>
              <button onClick=${submit} disabled=${busy || !pw}
                className="px-4 py-2 rounded-full bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800 disabled:opacity-60">
                ${busy ? "Checking…" : "Unlock"}</button>
            </div>
          </div>
        </div>`;
    }

    function WorkOrderModal({ woId, onClose, onOpenWo, onChanged }) {
      const [rec, setRec] = useState(null);
      const [err, setErr] = useState(null);
      const [editing, setEditing] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [name, setName] = useState(getUserName());
      const [adminProtected, setAdminProtected] = useState(false);
      const [gate, setGate] = useState(null);       // {label, action} when a password is needed
      const [audit, setAudit] = useState(null);      // version history (loaded on demand, gated)
      const [auditLoading, setAuditLoading] = useState(false);
      const [deleting, setDeleting] = useState(false);
      const [stopping, setStopping] = useState(false);

      const load = useCallback(() => {
        setRec(null); setErr(null);
        getJSON("/api/workorder/" + woId).then(setRec).catch((e) => setErr(e.message));
      }, [woId]);

      useEffect(() => { load(); setEditing(false); setShowHistory(false); setAudit(null); }, [load]);
      useEffect(() => {
        getJSON("/api/admin-auth").then((d) => setAdminProtected(!!d.protected)).catch(() => {});
      }, []);

      const refresh = () => {
        getJSON("/api/workorder/" + woId).then(setRec).catch((e) => setErr(e.message));
        if (onChanged) onChanged();
      };

      // Run `action` if admin isn't required / already unlocked this session;
      // otherwise pop the password gate first and run it once unlocked.
      const requireAdmin = (label, action) => {
        if (!adminProtected || getAdminPw()) { action(); return; }
        setGate({ label, action });
      };

      const doDelete = async () => {
        if (!window.confirm("Delete work order #" + woId + " permanently? This cannot be undone.")) return;
        setDeleting(true); setErr(null);
        try {
          const r = await fetch(API + "/api/workorder/" + woId, { method: "DELETE", headers: adminHeaders() });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setAdminPw(""); setDeleting(false); setGate({ label: "delete this work order", action: doDelete }); return; }
          if (!r.ok) throw new Error(d.error || "delete failed");
          if (onChanged) onChanged();
          onClose();
        } catch (e) { setErr(e.message); setDeleting(false); }
      };
      const remove = () => requireAdmin("delete this work order", doDelete);

      const doStopRecurrence = async () => {
        if (!window.confirm("Stop this recurring series? No future work orders will be generated. Existing ones are kept.")) return;
        setStopping(true); setErr(null);
        try {
          const r = await fetch(API + "/api/workorder/" + woId + "/stop-recurrence", {
            method: "POST", headers: adminHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ author: getUserName() }),
          });
          const d = await r.json().catch(() => ({}));
          if (r.status === 401) { setAdminPw(""); setStopping(false); setGate({ label: "stop recurrence", action: doStopRecurrence }); return; }
          if (!r.ok) throw new Error(d.error || "failed to stop recurrence");
          refresh();
        } catch (e) { setErr(e.message); } finally { setStopping(false); }
      };
      const stopRecur = () => requireAdmin("stop recurrence", doStopRecurrence);

      // Build a PDF of the work order (via jsPDF) and download it directly - no
      // print dialog. Works for any WO (scraped or MINT-created) using the detail
      // already loaded into `rec`.
      const exportWo = () => {
        if (!rec) return;
        const JsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!JsPDF) { setErr("PDF library failed to load. Refresh the page and try again."); return; }
        const doc = new JsPDF({ unit: "pt", format: "letter" });
        const MARGIN = 48;
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const contentW = pageW - MARGIN * 2;
        let y = MARGIN;

        const ensure = (needed) => {
          if (y + needed > pageH - MARGIN) { doc.addPage(); y = MARGIN; }
        };
        const text = (str, x, size, style, color) => {
          doc.setFont("helvetica", style || "normal");
          doc.setFontSize(size);
          doc.setTextColor.apply(doc, color || [30, 41, 59]);
          const lines = doc.splitTextToSize(String(str == null ? "" : str), contentW - (x - MARGIN));
          for (const ln of lines) { ensure(size + 4); doc.text(ln, x, y); y += size + 4; }
        };

        // Header band
        doc.setFillColor(37, 99, 235);
        doc.rect(0, 0, pageW, 6, "F");
        doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(37, 99, 235);
        doc.text("Bobrick", MARGIN, y + 10);
        doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(100, 116, 139);
        doc.text("Maintenance Work Order", MARGIN, y + 26);
        doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(30, 41, 59);
        doc.text("Work Order #" + (rec.wo_id || ""), pageW - MARGIN, y + 12, { align: "right" });
        if (rec.is_manual) {
          doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(4, 120, 87);
          doc.text("MINT", pageW - MARGIN, y + 28, { align: "right" });
        }
        y += 44;
        doc.setDrawColor(37, 99, 235); doc.setLineWidth(1.5);
        doc.line(MARGIN, y, pageW - MARGIN, y); y += 20;

        // Field table (two columns: label / value)
        const rows = [];
        const add = (label, val) => {
          if (val !== undefined && val !== null && String(val).trim() !== "") rows.push([label, String(val)]);
        };
        add("Machine", rec.equipment_name);
        add("EQ ID", rec.equipment_eq_id);
        add("Department", rec.department);
        add("Type", rec.wo_type);
        add("Status", rec.status);
        add("Urgency", rec.urgency);
        add("Date Notified", rec.date_notified);
        add("Due Date", rec.due_date);
        if (rec.frequency) add("Frequency", rec.recurrence_stopped ? rec.frequency + " (recurrence stopped)" : rec.frequency);
        if (rec.status === CLOSED_STATUS) {
          add("Completed", rec.completed_datetime);
          add("Work Performed By", rec.work_performed_by);
          add("Labor Time", rec.labor_time ? hours(rec.labor_time) : "");
          add("Material Cost", rec.material_cost ? money(rec.material_cost) : "");
          add("Downtime", rec.downtime_hours ? hours(rec.downtime_hours) : "");
        }
        const labelX = MARGIN, valX = MARGIN + 150;
        for (const [label, val] of rows) {
          doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(71, 85, 105);
          const valLines = doc.splitTextToSize(val, contentW - 150);
          const rowH = Math.max(14, valLines.length * 13);
          ensure(rowH + 4);
          const rowTop = y;
          doc.text(label, labelX, y + 9);
          doc.setFont("helvetica", "normal"); doc.setTextColor(30, 41, 59);
          let vy = y + 9;
          for (const ln of valLines) { doc.text(ln, valX, vy); vy += 13; }
          y = rowTop + rowH + 4;
          doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.5);
          doc.line(MARGIN, y - 2, pageW - MARGIN, y - 2);
        }

        const section = (title, body) => {
          if (!body || !String(body).trim()) return;
          y += 12; ensure(30);
          text(title.toUpperCase(), MARGIN, 10, "bold", [71, 85, 105]);
          y += 2;
          text(body, MARGIN, 11, "normal", [30, 41, 59]);
        };
        section("Problem", rec.problem);
        section("Audit Item", rec.audit_item);
        if (rec.status === CLOSED_STATUS) section("Comments", rec.completion_comments);

        if (rec.wo_type !== "scheduled" && Array.isArray(rec.solutions) && rec.solutions.length) {
          y += 12; ensure(30);
          text("SOLUTION LOG", MARGIN, 10, "bold", [71, 85, 105]); y += 2;
          for (const s of rec.solutions) {
            const meta = (s.author || "\u2014") + (s.created_at ? "  \u00b7  " + s.created_at : "");
            text(meta, MARGIN + 4, 9, "italic", [148, 163, 184]);
            text(s.text || "", MARGIN + 4, 11, "normal", [30, 41, 59]);
            y += 4;
          }
        }

        if (Array.isArray(rec.attachments) && rec.attachments.length) {
          y += 12; ensure(30);
          text("ATTACHMENTS", MARGIN, 10, "bold", [71, 85, 105]); y += 2;
          for (const a of rec.attachments) {
            const line = "\u2022 " + (a.filename || "file") + (a.uploaded_by ? "  (" + a.uploaded_by + ")" : "");
            text(line, MARGIN + 4, 11, "normal", [30, 41, 59]);
          }
        }

        y += 20; ensure(20);
