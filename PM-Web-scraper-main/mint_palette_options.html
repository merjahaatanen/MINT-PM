<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MINT Palette Options</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 px-6 py-10">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-extrabold mb-1">MINT color options</h1>
    <p class="text-slate-500 mb-8 text-sm">Each block shows the KPI cards, a primary button and an active tab in a different palette. Tell me which number you like (or mix &amp; match). The 5 KPI metrics are always: Unscheduled / Scheduled / Labor / Material / Downtime.</p>

    <div id="palettes" class="space-y-10"></div>
  </div>

<script>
  const KPIS = [
    { label: "Unscheduled WOs", value: "2,289" },
    { label: "Scheduled WOs",   value: "4,326" },
    { label: "Labor Time",      value: "5,389.6 h" },
    { label: "Material Cost",   value: "$439,010.24" },
    { label: "Downtime",        value: "987.9 h" },
  ];

  // Each palette: name, description, 5 accent gradient classes, primary btn, label text color
  const PALETTES = [
    {
      name: "1 - Current (multi-color)",
      desc: "What you have now: five distinct hues.",
      bars: ["from-rose-500 to-rose-400","from-sky-500 to-sky-400","from-indigo-500 to-indigo-400","from-emerald-600 to-emerald-500","from-cyan-500 to-cyan-400"],
      label: "text-emerald-600", btn: "bg-emerald-700 hover:bg-emerald-800", tab: "bg-emerald-700",
    },
    {
      name: "2 - Mint monochrome",
      desc: "All bars in shades of the brand green — calm and cohesive.",
      bars: ["from-emerald-800 to-emerald-700","from-emerald-600 to-emerald-500","from-teal-600 to-teal-500","from-green-600 to-green-500","from-emerald-400 to-emerald-300"],
      label: "text-emerald-700", btn: "bg-emerald-700 hover:bg-emerald-800", tab: "bg-emerald-700",
    },
    {
      name: "3 - Cool teal / cyan",
      desc: "Fresh, watery blues and teals. Still 'minty' but cooler.",
      bars: ["from-teal-600 to-teal-500","from-cyan-600 to-cyan-500","from-sky-600 to-sky-500","from-emerald-600 to-emerald-500","from-blue-500 to-blue-400"],
      label: "text-teal-700", btn: "bg-teal-700 hover:bg-teal-800", tab: "bg-teal-700",
    },
    {
      name: "4 - Neutral + green accent",
      desc: "Muted slate bars, green reserved for actions only. Very professional.",
      bars: ["from-slate-500 to-slate-400","from-slate-500 to-slate-400","from-slate-500 to-slate-400","from-emerald-600 to-emerald-500","from-slate-500 to-slate-400"],
      label: "text-slate-500", btn: "bg-emerald-700 hover:bg-emerald-800", tab: "bg-slate-800",
    },
    {
      name: "5 - Semantic (meaningful colors)",
      desc: "Colors carry meaning: red=unscheduled/urgent, blue=scheduled, amber=labor, green=cost, violet=downtime.",
      bars: ["from-red-500 to-red-400","from-blue-600 to-blue-500","from-amber-500 to-amber-400","from-emerald-600 to-emerald-500","from-violet-500 to-violet-400"],
      label: "text-emerald-700", btn: "bg-emerald-700 hover:bg-emerald-800", tab: "bg-emerald-700",
    },
    {
      name: "6 - Warm sunset",
      desc: "Warmer analogous set: teal to amber, easy on the eyes.",
      bars: ["from-rose-500 to-orange-400","from-amber-500 to-yellow-400","from-teal-600 to-teal-500","from-emerald-600 to-emerald-500","from-fuchsia-500 to-pink-400"],
      label: "text-teal-700", btn: "bg-teal-700 hover:bg-teal-800", tab: "bg-teal-700",
    },
  ];

  const root = document.getElementById("palettes");
  PALETTES.forEach(p => {
    const cards = KPIS.map((k, i) => `
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="text-xs uppercase tracking-wide ${p.label} font-bold">${k.label}</div>
        <div class="mt-1 text-2xl font-extrabold text-slate-800">${k.value}</div>
        <div class="mt-3 h-1.5 rounded-full bg-gradient-to-r ${p.bars[i]}"></div>
      </div>`).join("");
    root.insertAdjacentHTML("beforeend", `
      <section>
        <div class="flex items-baseline gap-3 mb-3">
          <h2 class="text-lg font-extrabold">${p.name}</h2>
          <span class="text-sm text-slate-500">${p.desc}</span>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">${cards}</div>
        <div class="flex items-center gap-3 mt-4">
          <button class="px-4 py-2 rounded-full ${p.btn} text-white text-sm font-semibold shadow-sm">+ New Work Order</button>
          <div class="flex gap-2 bg-white p-1.5 rounded-full shadow-sm border border-slate-100 w-fit">
            <span class="px-4 py-2 rounded-full text-sm font-semibold ${p.tab} text-white">Departments</span>
            <span class="px-4 py-2 rounded-full text-sm font-semibold text-slate-500">Unscheduled</span>
            <span class="px-4 py-2 rounded-full text-sm font-semibold text-slate-500">Scheduled</span>
          </div>
        </div>
      </section>`);
  });
</script>
</body>
</html>
